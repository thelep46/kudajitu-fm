<!doctype html><html lang="id" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUDAJITU FM • YouTube Mapping</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Arial,sans-serif;background:#061114;color:#f3f4f6}.glass{background:rgba(10,24,27,.94);border:1px solid rgba(45,212,191,.16)}.field{width:100%;background:#030a0c;border:1px solid #115e59;border-radius:.75rem;padding:.7rem 1rem;color:#fff;outline:0}.btn{padding:.65rem 1rem;border-radius:.7rem;font-size:.75rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center}.muted{color:#94a3b8}</style></head><body class="min-h-screen"><header class="sticky top-0 z-30 glass border-b border-teal-900/50 px-4 py-3"><div class="max-w-5xl mx-auto flex flex-wrap justify-between items-center gap-3"><div><h1 class="font-extrabold text-xl">🎵 YouTube Mapping</h1><p class="text-xs muted">Kelola pasangan lagu → Video YouTube</p></div><a href="admin.html" class="btn bg-gray-950 border border-teal-800">← Admin</a></div></header><main class="max-w-5xl mx-auto px-4 py-6 space-y-5"><section id="login" class="glass rounded-2xl p-6 max-w-md mx-auto"><h2 class="text-lg font-extrabold mb-3">Login Admin</h2><input id="password" type="password" class="field mb-3" placeholder="Password admin" onkeydown="if(event.key==='Enter')login()"><button onclick="login()" class="btn w-full bg-teal-600">Masuk</button><p id="msg" class="text-xs text-red-400 mt-3"></p></section><section id="app" class="hidden space-y-5"><div class="glass rounded-2xl p-5"><div class="flex justify-between items-center mb-4"><div><h2 class="font-extrabold">Tambah / Edit Mapping</h2><p class="text-xs muted">Masukkan URL YouTube atau Video ID.</p></div><button onclick="resetForm()" class="btn bg-gray-950 border border-teal-800">Reset</button></div><input id="title" class="field mb-3" placeholder="Judul lagu"><input id="artist" class="field mb-3" placeholder="Penyanyi / artis"><input id="video" class="field mb-3" placeholder="https://youtube.com/watch?v=... atau Video ID"><input id="oldKey" type="hidden"><button id="saveBtn" onclick="save()" class="btn w-full bg-teal-600">💾 Simpan Mapping</button><p id="formMsg" class="text-xs mt-3"></p></div><section class="glass rounded-2xl p-5"><div class="flex flex-wrap justify-between items-center gap-3 mb-4"><div><h2 class="font-extrabold">Daftar Mapping</h2><p id="count" class="text-xs muted">Memuat...</p></div><button onclick="load()" class="btn bg-gray-950 border border-teal-800">↻ Refresh</button></div><input id="search" oninput="render()" class="field mb-4" placeholder="Cari judul atau penyanyi..."><div id="list" class="space-y-2"></div></section></section></main><script>'use strict';const GAS='/api/gas',KEY='kudajitu_admin_token';let maps=[],loading=false;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}function jsonp(url,timeout=30000){return new Promise((resolve,reject)=>{const cb='__map_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false,t=setTimeout(()=>finish(Error('Timeout')),timeout);function finish(e,r){if(done)return;done=true;clearTimeout(t);s.remove();try{delete window[cb]}catch(x){}e?reject(e):resolve(r)}window[cb]=d=>d&&d.success!==false?finish(null,d):finish(Error(d?.message||'Server gagal'));s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&_='+Date.now();s.onerror=()=>finish(Error('Network error'));document.head.appendChild(s)})}function token(){return sessionStorage.getItem(KEY)||''}async function login(){let p=$('password').value;if(!p){$('msg').textContent='Password wajib diisi.';return}try{let r=await jsonp(GAS+'?action=adminlogin&password='+encodeURIComponent(p),30000);if(!r.success){$('msg').textContent=r.message||'Login gagal';return}sessionStorage.setItem(KEY,r.token);$('password').value='';$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}catch(e){$('msg').textContent='Gagal menghubungi server: '+e.message}}function vId(v){v=String(v||'').trim();let m=v.match(/[?&]v=([A-Za-z0-9_-]{6,})/);if(m)return m[1];m=v.match(/youtu\.be\/([A-Za-z0-9_-]{6,})/);if(m)return m[1];m=v.match(/youtube\.com\/shorts\/([A-Za-z0-9_-]{6,})/);if(m)return m[1];return v.replace(/[^A-Za-z0-9_-]/g,'')}function key(t,a){return (String(t||'').trim().toLowerCase()+'|'+String(a||'').trim().toLowerCase()).replace(/\s+/g,' ')}async function load(){if(loading)return;loading=true;try{let r=await jsonp(GAS+'?action=youtubemappings&adminToken='+encodeURIComponent(token()),30000);const raw=r.mappings||{};maps=Array.isArray(raw)?raw:Object.entries(raw).map(([key,videoId])=>{const parts=String(key).split('|'),title=parts.shift()||'',artist=parts.join('|');return{key:String(key),title:title,artist:artist,videoId:String(videoId||'')}}).filter(x=>x.key&&x.videoId);render()}catch(e){if(e.message==='LOGIN_REQUIRED')location.reload();else $('list').innerHTML='<p class="text-red-400 text-sm">Gagal memuat: '+esc(e.message)+'</p>'}finally{loading=false}}function render(){let q=$('search').value.toLowerCase().trim(),rows=maps.filter(x=>!q||String(x.title).toLowerCase().includes(q)||String(x.artist).toLowerCase().includes(q));$('count').textContent=rows.length+' mapping';$('list').innerHTML=rows.length?rows.map(x=>`<div class="rounded-xl border border-teal-900/60 bg-gray-950/60 p-4 flex flex-col sm:flex-row gap-3 sm:items-center"><div class="flex-1 min-w-0"><b>${esc(x.title)}</b><p class="text-xs muted">${esc(x.artist||'Unknown Artist')}</p><p class="text-[11px] text-teal-300 mt-1 break-all">${esc(x.videoId)}</p></div><div class="flex gap-2"><button class="btn bg-cyan-950 border border-cyan-800" onclick='edit(${JSON.stringify(x)})'>✏️ Edit</button><button class="btn bg-red-950 border border-red-800" onclick='del(${JSON.stringify(x.key)})'>🗑️</button></div></div>`).join(''):'<p class="text-sm muted text-center py-8">Belum ada mapping.</p>'}function resetForm(){$('title').value='';$('artist').value='';$('video').value='';$('oldKey').value='';$('formMsg').textContent=''}function edit(x){$('title').value=x.title||'';$('artist').value=x.artist||'';$('video').value=x.videoId||'';$('oldKey').value=x.key||'';scrollTo({top:0,behavior:'smooth'})}async function save(){let title=$('title').value.trim(),artist=$('artist').value.trim(),video=vId($('video').value),oldKey=$('oldKey').value;if(!title||!video){$('formMsg').textContent='Judul dan Video ID wajib diisi.';return}let k=key(title,artist),b=$('saveBtn');b.disabled=true;b.textContent='Menyimpan...';try{let u=GAS+'?action=saveyoutubemapping&adminToken='+encodeURIComponent(token())+'&key='+encodeURIComponent(k)+'&title='+encodeURIComponent(title)+'&artist='+encodeURIComponent(artist)+'&videoId='+encodeURIComponent(video);if(oldKey)u+='&oldKey='+encodeURIComponent(oldKey);let r=await jsonp(u,30000);$('formMsg').textContent=r.message||'Mapping tersimpan.';resetForm();await load()}catch(e){$('formMsg').textContent='Gagal menyimpan: '+e.message}finally{b.disabled=false;b.textContent='💾 Simpan Mapping'}}async function del(k){if(!confirm('Hapus mapping ini?'))return;try{let r=await jsonp(GAS+'?action=deleteyoutubemapping&adminToken='+encodeURIComponent(token())+'&key='+encodeURIComponent(k),30000);await load()}catch(e){alert('Gagal menghapus: '+e.message)}}</script></body></html>
