<!doctype html><html lang="id" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUDAJITU FM • YouTube Mapping</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#061114;color:#f3f4f6;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1000px;margin:auto;padding:18px}.top,.card{background:rgba(10,24,27,.94);border:1px solid rgba(45,212,191,.18);border-radius:16px}.top{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.muted{color:#94a3b8;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:16px}.card{padding:18px}.field{width:100%;background:#030a0c;border:1px solid #115e59;border-radius:11px;padding:12px;color:#fff;outline:0;margin:0 0 10px}.field:focus{border-color:#2dd4bf;box-shadow:0 0 0 3px rgba(45,212,191,.08)}button,.btn{border:1px solid #115e59;background:#0b2529;color:#fff;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.18s}button:hover,.btn:hover{transform:translateY(-1px);border-color:#2dd4bf}button:active{transform:scale(.98)}button:disabled{opacity:.55;cursor:wait}.primary{width:100%;background:#0d9488}.row{border:1px solid rgba(45,212,191,.2);background:#030a0c;border-radius:12px;padding:13px;margin-top:9px}.row:hover{border-color:#2dd4bf}.actions{display:flex;gap:7px;margin-top:9px}.danger{border-color:#7f1d1d;background:#2a0b0b}.toast{position:fixed;right:16px;bottom:16px;background:#0a181b;border:1px solid #115e59;border-radius:12px;padding:12px 15px;z-index:10}.ok{color:#86efac}.err{color:#fca5a5}@media(max-width:760px){.wrap{padding:10px}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><header class="top"><div><h1 style="margin:0;font-size:20px">🎵 YouTube Mapping</h1><div class="muted">Pasangkan Judul + Penyanyi dengan video YouTube untuk Player.</div></div><a class="btn" href="/admin">← Admin</a></header><div id="app" class="grid" style="display:none"><section class="card"><h2 style="margin-top:0">Tambah / Edit</h2><p class="muted">Gunakan URL YouTube atau Video ID 11 karakter.</p><input id="title" class="field" placeholder="Judul lagu" maxlength="150"><input id="artist" class="field" placeholder="Penyanyi / artis" maxlength="100"><input id="video" class="field" placeholder="https://youtube.com/watch?v=..." maxlength="250"><input id="oldKey" type="hidden"><button id="saveBtn" class="primary">💾 Simpan Mapping</button><button id="resetBtn" style="width:100%;margin-top:8px">↺ Reset</button><p id="formMsg" class="muted"></p></section><section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h2 style="margin:0">Daftar Mapping</h2><p id="count" class="muted">Memuat…</p></div><button id="refreshBtn">↻ Refresh</button></div><input id="search" class="field" style="margin-top:14px" placeholder="Cari judul atau penyanyi"><div id="list"></div></section></div><div id="loginMsg" class="card" style="padding:18px">Memeriksa sesi Admin…</div></div><div id="toast" class="toast" style="display:none"></div><script>'use strict';const URL='https://jdqcvfqysmjreibcaduk.supabase.co',KEY='sb_publishable_QDcyGfH-3dBNmUYE9pKIkg_uFmRsmOa',FN=URL+'/functions/v1/kudajitu-admin-v4';let db=null,maps=[],loading=false;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function toast(t,err){const e=$('toast');e.textContent=t;e.style.display='block';e.className='toast '+(err?'err':'ok');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display='none',3000)}function client(){if(db)return db;if(window.KUDAJITUAdminDB?.client)return db=window.KUDAJITUAdminDB.client;if(!window.supabase?.createClient)throw Error('Supabase JS belum siap.');return db=window.supabase.createClient(URL,KEY)}async function session(){const c=client(),s=(await c.auth.getSession()).data.session;if(!s)return null;return s}async function api(action,payload){const s=await session();if(!s)throw Error('LOGIN_REQUIRED');const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token},body:JSON.stringify({action,...(payload||{})}),cache:'no-store'});const d=await r.json().catch(()=>null);if(!r.ok||!d?.success)throw Error(d?.message||'Server Admin gagal.');return d}function key(t,a){return(String(t||'').trim().toLowerCase()+'|'+String(a||'').trim().toLowerCase()).replace(/\s+/g,' ')}function vid(v){const raw=String(v||'').trim();try{const u=new URL(raw),h=u.hostname.toLowerCase().replace(/^www\./,'');if(h==='youtu.be')return(u.pathname.split('/').filter(Boolean)[0]||'');if(['youtube.com','m.youtube.com','music.youtube.com'].includes(h)){const q=u.searchParams.get('v');if(q)return q;const p=u.pathname.split('/').filter(Boolean);if(['shorts','embed','live'].includes(p[0])&&p[1])return p[1]}}catch(_){}return/^[A-Za-z0-9_-]{11}$/.test(raw)?raw:''}async function load(){if(loading)return;loading=true;$('refreshBtn').disabled=true;try{const d=await api('youtubemappings');maps=(d.mappings||[]).map(x=>({id:x.id,key:key(x.title,x.artist),title:x.title||'',artist:x.artist||'',videoId:x.youtube_id||''}));render()}catch(e){toast('Gagal memuat: '+e.message,true)}finally{loading=false;$('refreshBtn').disabled=false}}function render(){const q=$('search').value.trim().toLowerCase(),rows=maps.filter(x=>!q||x.title.toLowerCase().includes(q)||x.artist.toLowerCase().includes(q));$('count').textContent=rows.length+' mapping';$('list').innerHTML=rows.length?rows.map(x=>'<div class="row"><b>'+esc(x.title)+'</b><div class="muted">'+esc(x.artist||'Unknown Artist')+'</div><div style="font-size:11px;color:#5eead4;margin-top:5px;word-break:break-all">'+esc(x.videoId)+'</div><div class="actions"><button data-edit="'+encodeURIComponent(JSON.stringify(x))+'">✏️ Edit</button><button class="danger" data-del="'+esc(x.key)+'">🗑 Hapus</button></div></div>').join(''):'<div class="muted" style="text-align:center;padding:30px">Belum ada mapping.</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(JSON.parse(decodeURIComponent(b.dataset.edit))));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del(b.dataset.del))}function resetForm(){$('title').value='';$('artist').value='';$('video').value='';$('oldKey').value='';$('formMsg').textContent=''}function edit(x){$('title').value=x.title;$('artist').value=x.artist;$('video').value=x.videoId;$('oldKey').value=x.key;window.scrollTo({top:0,behavior:'smooth'})}async function save(){const title=$('title').value.trim(),artist=$('artist').value.trim(),video=vid($('video').value),oldKey=$('oldKey').value;if(!title||!artist||!video||video.length!==11){$('formMsg').textContent='Judul, penyanyi, dan Video ID YouTube valid wajib diisi.';return}$('saveBtn').disabled=true;$('saveBtn').textContent='⏳ Menyimpan…';try{if(oldKey&&oldKey!==key(title,artist))await api('deleteyoutubemapping',{key:oldKey});await api('saveyoutubemapping',{title,artist,videoId:video});resetForm();$('formMsg').textContent='Mapping tersimpan.';toast('Mapping berhasil disimpan.');await load()}catch(e){$('formMsg').textContent='Gagal: '+e.message;toast('Gagal menyimpan mapping.',true)}finally{$('saveBtn').disabled=false;$('saveBtn').textContent='💾 Simpan Mapping'}}async function del(k){if(!confirm('Hapus mapping ini?'))return;try{await api('deleteyoutubemapping',{key:k});toast('Mapping dihapus.');await load()}catch(e){toast('Gagal menghapus: '+e.message,true)}}$('saveBtn').onclick=save;$('resetBtn').onclick=resetForm;$('refreshBtn').onclick=load;$('search').oninput=render;(async()=>{try{const s=await session();if(!s){$('loginMsg').textContent='Sesi Admin tidak ditemukan. Silakan login di Admin lalu buka kembali menu ini.';return}$('loginMsg').style.display='none';$('app').style.display='grid';await load()}catch(e){$('loginMsg').textContent='Gagal memuat: '+(e?.message||e)}})();</script></body></html>
