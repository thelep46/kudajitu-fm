<!doctype html><html lang="id" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUDAJITU FM • YouTube Mapping</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;background:#061114;color:#f3f4f6}.glass{background:rgba(10,24,27,.94);border:1px solid rgba(45,212,191,.16)}.field{width:100%;background:#030a0c;border:1px solid #115e59;border-radius:.75rem;padding:.7rem 1rem;color:#fff;outline:0}.btn{padding:.65rem 1rem;border-radius:.7rem;font-size:.75rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:.3rem;transition:.18s}.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(1px) scale(.98)}.btn:disabled{opacity:.55;cursor:wait}.muted{color:#94a3b8}.maprow{transition:.18s}.maprow:hover{border-color:rgba(45,212,191,.5);transform:translateY(-1px)}.toast{position:fixed;right:16px;bottom:16px;padding:12px 16px;border-radius:12px;background:#0a181b;border:1px solid #115e59;z-index:50}.toast.show{animation:in .2s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}</style></head><body class="min-h-screen"><header class="sticky top-0 z-30 glass border-b border-teal-900/50 px-4 py-3"><div class="max-w-5xl mx-auto flex flex-wrap justify-between items-center gap-3"><div><h1 class="font-extrabold text-xl">🎵 YouTube Mapping</h1><p class="text-xs muted">Kelola pasangan lagu → Video YouTube</p></div><a href="admin.html" class="btn bg-gray-950 border border-teal-800">← Admin</a></div></header><main class="max-w-5xl mx-auto px-4 py-6 space-y-5"><section id="app" class="hidden space-y-5"><div class="glass rounded-2xl p-5"><div class="flex justify-between items-center mb-4 gap-3"><div><h2 class="font-extrabold">Tambah / Edit Mapping</h2><p class="text-xs muted">Masukkan URL YouTube atau Video ID.</p></div><button onclick="resetForm()" class="btn bg-gray-950 border border-teal-800">Reset</button></div><input id="title" class="field mb-3" placeholder="Judul lagu"><input id="artist" class="field mb-3" placeholder="Penyanyi / artis"><input id="video" class="field mb-3" placeholder="https://youtube.com/watch?v=... atau Video ID"><input id="oldKey" type="hidden"><button id="saveBtn" onclick="save()" class="btn w-full bg-teal-600">💾 Simpan Mapping</button><p id="formMsg" class="text-xs mt-3"></p></div><section class="glass rounded-2xl p-5"><div class="flex flex-wrap justify-between items-center gap-3 mb-4"><div><h2 class="font-extrabold">Daftar Mapping</h2><p id="count" class="text-xs muted">Memuat...</p></div><button id="refreshBtn" onclick="load()" class="btn bg-gray-950 border border-teal-800">↻ Refresh</button></div><p class="text-[11px] muted mb-3">Mapping tersimpan di backend Supabase dan digunakan Player untuk mencocokkan lagu dengan video YouTube.</p><input id="search" oninput="render()" class="field mb-4" placeholder="Cari judul atau penyanyi..."><div id="list" class="space-y-2"></div></section></section></main><div id="toast" class="toast hidden"></div><script>'use strict';const URL='https://jdqcvfqysmjreibcaduk.supabase.co',KEY='sb_publishable_QDcyGfH-3dBNmUYE9pKIkg_uFmRsmOa';let db,maps=[],loading=false;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function toast(t,error=false){const e=$('toast');e.textContent=t;e.className='toast show'+(error?' border-red-700':'');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.add('hidden'),3200)}async function session(){const r=await db.auth.getSession(),s=r.data?.session,u=s?.user;if(!s||String(u?.app_metadata?.role||'').toLowerCase()!=='admin')throw Error('Sesi Admin tidak valid. Silakan login kembali.');return s}function key(t,a){return(String(t||'').trim().toLowerCase()+'|'+String(a||'').trim().toLowerCase()).replace(/\s+/g,' ')}function splitKey(k){const s=String(k||''),i=s.indexOf('|');return i<0?{title:s,artist:''}:{title:s.slice(0,i),artist:s.slice(i+1)}}function vId(v){v=String(v||'').trim();try{const u=new URL(v),h=u.hostname.toLowerCase().replace(/^www\./,'');if(h==='youtu.be')return(u.pathname.split('/').filter(Boolean)[0]||'');if(['youtube.com','m.youtube.com','music.youtube.com'].includes(h)){if(u.searchParams.get('v'))return u.searchParams.get('v');const p=u.pathname.split('/').filter(Boolean);if(['shorts','embed','live'].includes(p[0])&&p[1])return p[1]}}catch(_){}return v.replace(/[^A-Za-z0-9_-]/g,'')}async function load(){if(loading)return;loading=true;const b=$('refreshBtn');if(b){b.disabled=true;b.innerHTML='⏳ Memuat...'}try{await session();const {data,error}=await db.from('youtube_mappings').select('id,title,artist,youtube_id,youtube_url').order('title');if(error)throw error;maps=(data||[]).map(x=>({key:key(x.title,x.artist),title:String(x.title||''),artist:String(x.artist||''),videoId:String(x.youtube_id||''),id:x.id})).filter(x=>x.key&&x.videoId);render()}catch(e){toast('Gagal memuat: '+e.message,true);if(/sesi|admin/i.test(e.message))setTimeout(()=>location.href='admin.html',900)}finally{loading=false;if(b){b.disabled=false;b.innerHTML='↻ Refresh'}}}function render(){const q=($('search').value||'').toLowerCase().trim(),rows=maps.filter(x=>!q||x.title.toLowerCase().includes(q)||x.artist.toLowerCase().includes(q));$('count').textContent=rows.length+' mapping';$('list').innerHTML=rows.length?rows.map(x=>`<div class="maprow rounded-xl border border-teal-900/60 bg-gray-950/60 p-4 flex flex-col sm:flex-row gap-3 sm:items-center"><div class="flex-1 min-w-0"><b>${esc(x.title)}</b><p class="text-xs muted">${esc(x.artist||'Unknown Artist')}</p><p class="text-[11px] text-teal-300 mt-1 break-all">${esc(x.videoId)}</p></div><div class="flex gap-2"><button class="btn bg-cyan-950 border border-cyan-800" onclick='edit(${JSON.stringify(x).replace(/</g,'\\u003c')})'>✏️ Edit</button><button class="btn bg-red-950 border border-red-800" onclick='del(${JSON.stringify(x.key).replace(/'/g,"\\'")})'>🗑️ Hapus</button></div></div>`).join(''):'<p class="text-sm muted text-center py-8">Belum ada mapping.</p>'}function resetForm(){$('title').value='';$('artist').value='';$('video').value='';$('oldKey').value='';$('formMsg').textContent=''}function edit(x){$('title').value=x.title||'';$('artist').value=x.artist||'';$('video').value=x.videoId||'';$('oldKey').value=x.key||'';scrollTo({top:0,behavior:'smooth'})}async function save(){const title=$('title').value.trim(),artist=$('artist').value.trim(),video=vId($('video').value),oldKey=$('oldKey').value;if(!title||!/^[A-Za-z0-9_-]{11}$/.test(video)){$('formMsg').textContent='Judul dan Video ID YouTube yang valid wajib diisi.';return}const b=$('saveBtn');b.disabled=true;b.innerHTML='⏳ Menyimpan...';try{await session();const old=splitKey(oldKey);if(oldKey&&oldKey!==key(title,artist)){const r=await db.from('youtube_mappings').delete().eq('title',old.title).eq('artist',old.artist);if(r.error)throw r.error}const existing=await db.from('youtube_mappings').select('id').eq('title',title).eq('artist',artist).limit(1).maybeSingle();if(existing.error)throw existing.error;let r;if(existing.data?.id)r=await db.from('youtube_mappings').update({youtube_id:video,youtube_url:'https://www.youtube.com/watch?v='+video,updated_at:new Date().toISOString()}).eq('id',existing.data.id);else r=await db.from('youtube_mappings').insert({title,artist,youtube_id:video,youtube_url:'https://www.youtube.com/watch?v='+video,created_at:new Date().toISOString(),updated_at:new Date().toISOString()});if(r.error)throw r.error;$('formMsg').textContent='Mapping tersimpan.';resetForm();await load();toast('Mapping berhasil disimpan.')}catch(e){$('formMsg').textContent='Gagal menyimpan: '+e.message;toast('Gagal menyimpan mapping.',true)}finally{b.disabled=false;b.innerHTML='💾 Simpan Mapping'}}async function del(k){if(!confirm('Hapus mapping ini?'))return;try{await session();const p=splitKey(k),r=await db.from('youtube_mappings').delete().eq('title',p.title).eq('artist',p.artist);if(r.error)throw r.error;await load();toast('Mapping berhasil dihapus.')}catch(e){toast('Gagal menghapus: '+e.message,true)}}(async()=>{try{db=window.supabase.createClient(URL,KEY);await session();$('app').classList.remove('hidden');await load()}catch(e){toast(e.message,true);setTimeout(()=>location.href='admin.html',1200)}})();</script></body></html>
