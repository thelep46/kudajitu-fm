<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUDAJITU FM • Setup Admin</title><style>body{font-family:system-ui,sans-serif;background:#061114;color:#f3f4f6;margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(92vw,420px);background:#0a181b;border:1px solid #164e4a;border-radius:18px;padding:24px;box-sizing:border-box}h1{margin:0 0 6px}.muted{color:#94a3b8;font-size:13px;line-height:1.5}.field{width:100%;box-sizing:border-box;background:#030a0c;border:1px solid #115e59;border-radius:12px;padding:12px 14px;color:white;margin-top:10px;outline:none}.btn{width:100%;margin-top:14px;background:#0d9488;border:0;color:white;border-radius:12px;padding:12px;font-weight:800;cursor:pointer}.msg{margin-top:12px;font-size:13px}.danger{color:#fca5a5}.ok{color:#5eead4}code{word-break:break-all}</style></head><body><main class="card"><h1>Setup Admin KUDAJITU FM</h1><p class="muted">Halaman ini hanya untuk membuat akun Admin pertama. Token bersifat satu kali pakai.</p><input id="token" class="field" placeholder="Bootstrap token" autocomplete="off"><input id="email" type="email" class="field" placeholder="Email Admin" autocomplete="username"><input id="password" type="password" class="field" placeholder="Password baru (minimal 8 karakter)" autocomplete="new-password"><button id="btn" class="btn">Buat Akun Admin</button><div id="msg" class="msg"></div></main><script>const FN='https://jdqcvfqysmjreibcaduk.supabase.co/functions/v1/kudajitu-admin-bootstrap';const $=id=>document.getElementById(id);$('btn').onclick=async()=>{const b=$('btn'),m=$('msg');b.disabled=true;b.textContent='Memproses...';m.textContent='';m.className='msg';try{const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bootstrapToken:$('token').value.trim(),email:$('email').value.trim(),password:$('password').value})});const d=await r.json().catch(()=>({success:false,message:'Respons tidak valid.'}));if(!r.ok||!d.success)throw Error(d.message||'Gagal membuat akun.');m.className='msg ok';m.textContent='Akun Admin berhasil dibuat. Sekarang buka admin.html dan login dengan email/password tersebut.';$('token').value='';b.textContent='Selesai';}catch(e){m.className='msg danger';m.textContent=e.message||'Gagal membuat akun.';b.disabled=false;b.textContent='Buat Akun Admin'}};</script></body></html>
