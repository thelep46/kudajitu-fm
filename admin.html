<!doctype html><html lang="id" class="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUDAJITU FM • Admin</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script>tailwind.config={theme:{extend:{colors:{brand:{400:'#2dd4bf',500:'#14b8a6',600:'#0d9488'}}}}}</script><style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#061114;color:#f3f4f6}.glass{background:rgba(10,24,27,.9);backdrop-filter:blur(14px);border:1px solid rgba(45,212,191,.15)}.field{width:100%;background:#030a0c;border:1px solid #115e59;border-radius:.75rem;padding:.7rem 1rem;color:white;outline:0}.btn{padding:.65rem 1rem;border-radius:.7rem;font-size:.75rem;font-weight:800}.danger{background:#4a1118;border:1px solid #7f1d1d;color:#fecaca}.ok{background:#0d9488;color:white}.muted{color:#9ca3af}</style></head><body class="min-h-screen"><header class="sticky top-0 z-40 glass border-b border-teal-900/50 px-4 lg:px-8 py-3"><div class="max-w-7xl mx-auto flex justify-between items-center"><div><h1 class="font-extrabold text-xl">KUDAJITU FM <span class="text-xs text-brand-300">ADMIN</span></h1><p class="text-xs muted">Dashboard pengelolaan request</p></div><a href="./" class="btn bg-gray-950 border border-teal-800">← Halaman User</a></div></header><main class="max-w-7xl mx-auto px-4 lg:px-8 py-6"><section id="login" class="max-w-md mx-auto mt-10"><div class="glass rounded-2xl p-7"><div class="text-center mb-6"><div class="w-16 h-16 mx-auto rounded-2xl bg-brand-600/20 flex items-center justify-center mb-3"><i class="fa-solid fa-user-shield text-2xl text-brand-400"></i></div><h2 class="text-xl font-extrabold">Login Admin</h2><p class="text-xs muted mt-1">Akses khusus pengelola KUDAJITU FM</p></div><input id="password" type="password" autocomplete="current-password" placeholder="Password admin" class="field mb-3" onkeydown="if(event.key==='Enter')login()"><button onclick="login()" class="btn ok w-full">Masuk ke Dashboard</button><p id="loginMsg" class="text-xs text-red-400 mt-3 text-center"></p></div></section><section id="dashboard" class="hidden space-y-6"><div class="flex flex-wrap justify-between items-center gap-3"><div><h2 class="text-2xl font-extrabold">Dashboard Admin</h2><p class="text-xs muted">Kelola antrean tanpa menampilkan panel admin kepada user.</p></div><button onclick="logout()" class="btn bg-gray-950 border border-teal-800">Keluar</button></div><div class="grid grid-cols-3 gap-3"><div class="glass rounded-xl p-4 text-center"><span class="text-[10px] muted block">ANTREAN</span><b id="pending" class="text-2xl text-amber-300">0</b></div><div class="glass rounded-xl p-4 text-center"><span class="text-[10px] muted block">SELESAI</span><b id="played" class="text-2xl text-brand-300">0</b></div><div class="glass rounded-xl p-4 text-center"><span class="text-[10px] muted block">TOTAL</span><b id="total" class="text-2xl text-cyan-300">0</b></div></div><div class="glass rounded-2xl p-5"><div class="flex flex-wrap gap-2 mb-4"><button onclick="markAll()" class="btn ok">✓ Tandai Semua Selesai</button><button onclick="clearAll()" class="btn danger">Hapus Semua</button><button onclick="load()" class="btn bg-gray-950 border border-teal-800">↻ Refresh</button></div><div id="list" class="space-y-3"></div></div></section></main><div id="toast" class="fixed right-4 bottom-4 z-50"></div><script>'use strict';const GAS='https://script.google.com/macros/s/AKfycbyUB8drjL1dSJedYjKIKjVc5gzIE3Pe-QS0FF8o1_zU4NkAweGLFquhHLfy1Nt_eITA-Q/exec',PASSWORD='290979';let data=[],busy=false;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}function toast(t){$('toast').innerHTML='<div class="glass rounded-xl px-4 py-3 text-xs">'+esc(t)+'</div>';setTimeout(()=>$('toast').innerHTML='',2500)}function login(){if($('password').value!==PASSWORD){$('loginMsg').textContent='Password admin salah.';return}sessionStorage.setItem('kudajitu_admin','1');show();load()}function show(){if(sessionStorage.getItem('kudajitu_admin')!=='1')return;$('login').classList.add('hidden');$('dashboard').classList.remove('hidden')}function logout(){sessionStorage.removeItem('kudajitu_admin');location.reload()}function norm(x){return{id:String(x?.id??''),requester:String(x?.requester??''),title:String(x?.title??''),artist:String(x?.artist??''),timestamp:x?.timestamp??'',status:String(x?.status??'pending').toLowerCase()==='played'?'played':'pending'}}async function load(){if(busy)return;busy=true;try{let r=await fetch(GAS+'?t='+Date.now(),{cache:'no-store'}),j=await r.json();data=(Array.isArray(j)?j:j.data||[]).map(norm);render()}catch(e){toast('Gagal mengambil data.')}finally{busy=false}}function render(){$('pending').textContent=data.filter(x=>x.status==='pending').length;$('played').textContent=data.filter(x=>x.status==='played').length;$('total').textContent=data.length;$('list').innerHTML=data.length?data.map((r,i)=>`<div class="glass rounded-xl p-4 flex gap-3 items-center"><input type="checkbox" class="w-5 h-5" ${r.status==='played'?'checked':''} onchange="status('${esc(r.id)}',this.checked)"><div class="flex-1 min-w-0"><b class="block truncate">${esc(r.title)}</b><span class="text-sm text-gray-400">${esc(r.artist)}</span><div class="text-[11px] muted">${esc(r.requester)} • ${r.status}</div></div><button onclick="del('${esc(r.id)}')" class="btn danger">Hapus</button></div>`).join(''):'<p class="text-center muted py-10">Belum ada request.</p>'}function post(payload){return fetch(GAS,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})}async function sync(){await new Promise(r=>setTimeout(r,1000));await load()}async function status(id,on){await post({action:'updateStatus',id,status:on?'played':'pending'});toast('Status diperbarui');sync()}async function del(id){if(!confirm('Hapus request ini?'))return;await post({action:'delete',id});toast('Request dihapus');sync()}async function markAll(){let p=data.filter(x=>x.status==='pending');if(!p.length)return toast('Tidak ada antrean.');if(!confirm('Tandai semua sebagai selesai?'))return;for(const r of p)await post({action:'updateStatus',id:r.id,status:'played'});toast('Semua selesai');sync()}async function clearAll(){if(!data.length)return;if(!confirm('Hapus SEMUA request?'))return;for(const r of data)await post({action:'delete',id:r.id});toast('Semua dihapus');sync()}show();if(sessionStorage.getItem('kudajitu_admin')==='1')load();</script></body></html>
