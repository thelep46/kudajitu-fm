<!doctype html><html lang="id" class="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUDAJITU FM • Admin</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#061114;color:#f3f4f6}.glass{background:rgba(10,24,27,.9);backdrop-filter:blur(14px);border:1px solid rgba(45,212,191,.15)}.field{width:100%;background:#030a0c;border:1px solid #115e59;border-radius:.75rem;padding:.7rem 1rem;color:white;outline:0}.btn{padding:.65rem 1rem;border-radius:.7rem;font-size:.75rem;font-weight:800}.danger{background:#4a1118;border:1px solid #7f1d1d;color:#fecaca}.ok{background:#0d9488;color:white}.play{background:#164e63;border:1px solid #0e7490;color:#a5f3fc}.muted{color:#9ca3af}.filter{padding:.45rem .75rem;border-radius:.6rem;font-size:.7rem;font-weight:800;color:#9ca3af}.filter.active{background:#0d9488;color:white}</style></head><body class="min-h-screen"><header class="sticky top-0 z-40 glass border-b border-teal-900/50 px-4 lg:px-8 py-3"><div class="max-w-7xl mx-auto flex justify-between items-center"><div><h1 class="font-extrabold text-xl">KUDAJITU FM <span class="text-xs text-teal-300">ADMIN</span></h1><p class="text-xs muted">Dashboard pengelolaan request</p></div><a href="./" class="btn bg-gray-950 border border-teal-800"><i class="fa-solid fa-arrow-left mr-1"></i>User</a></div></header><main class="max-w-7xl mx-auto px-4 lg:px-8 py-6"><section id="login" class="max-w-md mx-auto mt-10"><div class="glass rounded-2xl p-7"><div class="text-center mb-6"><i class="fa-solid fa-user-shield text-3xl text-teal-400"></i><h2 class="text-xl font-extrabold mt-3">Login Admin</h2></div><input id="password" type="password" class="field mb-3" placeholder="Password admin" onkeydown="if(event.key==='Enter')login()"><button onclick="login()" class="btn ok w-full">Masuk</button><p id="loginMsg" class="text-xs text-red-400 mt-3 text-center"></p></div></section><section id="dashboard" class="hidden space-y-5"><div class="flex flex-wrap justify-between items-center gap-3"><div><h2 class="text-2xl font-extrabold">Dashboard Admin</h2><p id="sourceInfo" class="text-xs muted">Memuat...</p></div><div class="flex gap-2"><button onclick="load(true)" class="btn bg-gray-950 border border-teal-800"><i class="fa-solid fa-rotate mr-1"></i>Refresh</button><button onclick="logout()" class="btn bg-gray-950 border border-teal-800">Keluar</button></div></div><div class="grid grid-cols-3 gap-3"><div class="glass rounded-xl p-4 text-center"><span class="text-[10px] muted block">ANTREAN</span><b id="pending" class="text-2xl text-amber-300">0</b></div><div class="glass rounded-xl p-4 text-center"><span class="text-[10px] muted block">SELESAI</span><b id="played" class="text-2xl text-teal-300">0</b></div><div class="glass rounded-xl p-4 text-center"><span class="text-[10px] muted block">TOTAL</span><b id="total" class="text-2xl text-cyan-300">0</b></div></div><div class="glass rounded-2xl p-5"><div class="flex flex-wrap justify-between gap-3 mb-4"><div><div class="flex flex-wrap bg-gray-950 p-1 rounded-xl border border-teal-900/50"><button id="dToday" onclick="setDate('today')" class="filter active">Hari Ini</button><button id="dYesterday" onclick="setDate('yesterday')" class="filter">Kemarin</button><button id="dAll" onclick="setDate('all')" class="filter">Semua</button></div><p id="dateLabel" class="text-[11px] text-gray-500 mt-2"></p></div><div class="flex gap-2"><button onclick="markAll()" class="btn ok">✓ Tandai Semua</button><button onclick="clearVisible()" class="btn danger">🗑 Hapus Tampilan</button></div></div><div class="flex flex-wrap items-center gap-2 mb-4"><span class="text-[10px] uppercase font-extrabold text-gray-500">Status:</span><button id="sAll" onclick="setStatus('all')" class="filter active">Semua</button><button id="sNew" onclick="setStatus('new')" class="filter">Request Baru</button><button id="sPending" onclick="setStatus('pending')" class="filter">Belum Diputar</button><button id="sPlayed" onclick="setStatus('played')" class="filter">Sudah Diputar</button></div><div id="list" class="space-y-3"></div></div></section></main><div id="toast" class="fixed right-4 bottom-4 z-50"></div><script>'use strict';const GAS='https://script.google.com/macros/s/AKfycbyUB8drjL1dSJedYjKIKjVc5gzIE3Pe-QS0FF8o1_zU4NkAweGLFquhHLfy1Nt_eITA-Q/exec',PASSWORD='290979';let data=[],busy=false,dateFilter='today',statusFilter='all',lastLoad=0;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}function toast(t,error=false){let e=document.createElement('div');e.className='glass rounded-xl px-4 py-3 text-xs shadow-xl '+(error?'border border-red-700':'border border-teal-800');e.textContent=t;$('toast').appendChild(e);setTimeout(()=>e.remove(),2500)}function login(){if($('password').value!==PASSWORD){$('loginMsg').textContent='Password admin salah.';return}sessionStorage.setItem('kudajitu_admin','1');show();load(true)}function show(){if(sessionStorage.getItem('kudajitu_admin')!=='1')return;$('login').classList.add('hidden');$('dashboard').classList.remove('hidden')}function logout(){sessionStorage.removeItem('kudajitu_admin');location.reload()}function norm(x){return{id:String(x?.id??''),requester:String(x?.requester??''),title:String(x?.title??''),artist:String(x?.artist??''),note:String(x?.note??''),timestamp:x?.timestamp??'',status:String(x?.status??'pending').toLowerCase()==='played'?'played':'pending'}}function key(v){let d=new Date(v);return isNaN(d)?'':d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function wantedKey(offset){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+offset);return key(d)}function visible(){let rows=dateFilter==='today'?data.filter(x=>key(x.timestamp)===wantedKey(0)):dateFilter==='yesterday'?data.filter(x=>key(x.timestamp)===wantedKey(-1)):data;return statusFilter==='all'?rows:statusFilter==='new'?rows.filter(x=>x.status==='pending'&&Date.now()-new Date(x.timestamp).getTime()<3600000):rows.filter(x=>x.status===statusFilter)}function setDate(f){dateFilter=f;['Today','Yesterday','All'].forEach(x=>$('d'+x).classList.toggle('active',x.toLowerCase()===f));$('dateLabel').textContent=f==='today'?'Menampilkan request hari ini':f==='yesterday'?'Menampilkan request kemarin':'Menampilkan seluruh riwayat';load(false)}function setStatus(f){statusFilter=f;['All','New','Pending','Played'].forEach(x=>$('s'+x).classList.toggle('active',x.toLowerCase()===f));render()}function ago(v){let s=(Date.now()-new Date(v).getTime())/1000;if(!isFinite(s)||s<0)return'';if(s<60)return'baru saja';if(s<3600)return Math.floor(s/60)+'m lalu';if(s<86400)return Math.floor(s/3600)+'j lalu';return Math.floor(s/86400)+'h lalu'}async function load(force){if(busy||(!force&&Date.now()-lastLoad<5000))return;busy=true;$('sourceInfo').textContent='Memuat data...';try{let q=dateFilter==='today'?'today':dateFilter==='yesterday'?'yesterday':'all';let r=await fetch(GAS+'?range='+q+'&t='+Date.now(),{cache:'no-store'});let j=await r.json();if(!j.success)throw Error(j.message||'Gagal');data=(j.data||[]).map(norm);lastLoad=Date.now();render();$('sourceInfo').textContent='Terakhir diperbarui '+new Date().toLocaleTimeString('id-ID')}catch(e){console.error(e);toast('Gagal memuat data: '+e.message,true);$('sourceInfo').textContent='Gagal memuat data'}finally{busy=false}}function render(){let rows=visible(),p=rows.filter(x=>x.status==='pending'),s=rows.filter(x=>x.status==='played');$('pending').textContent=p.length;$('played').textContent=s.length;$('total').textContent=rows.length;$('list').innerHTML=rows.length?rows.map((r,i)=>`<div class="glass rounded-xl p-4 flex flex-col sm:flex-row gap-3 sm:items-center"><div class="w-10 h-10 rounded-xl bg-gray-950 flex items-center justify-center shrink-0 ${r.status==='played'?'text-teal-400':'text-amber-300'}">${r.status==='played'?'✓':'#'+(i+1)}</div><div class="flex-1 min-w-0"><div class="flex flex-wrap items-center gap-2"><b class="truncate">${esc(r.title)}</b><span class="text-[10px] px-2 py-1 rounded-full ${r.status==='pending'?'bg-amber-500/10 text-amber-300':'bg-teal-500/10 text-teal-300'}">${r.status==='pending'?'BELUM DIPUTAR':'SUDAH DIPUTAR'}</span></div><div class="text-sm text-gray-400">${esc(r.artist)}</div><div class="text-[11px] muted">${esc(r.requester)}${r.timestamp?' • '+esc(ago(r.timestamp)):''}</div>${r.note?`<div class="text-[11px] text-gray-500">${esc(r.note)}</div>`:''}</div><div class="flex flex-wrap gap-2"><button onclick="playSong('${encodeURIComponent(r.title+' - '+r.artist)}')" class="btn play">▶ Putar</button><label class="btn ${r.status==='played'?'ok':'bg-gray-950 border border-teal-800'} cursor-pointer"><input type="checkbox" class="mr-2" ${r.status==='played'?'checked':''} onchange="changeStatus('${esc(r.id)}',this.checked)">✓ Tandai</label><button onclick="del('${esc(r.id)}')" class="btn danger">🗑 Hapus</button></div></div>`).join(''):'<div class="text-center muted py-10">Belum ada request pada filter ini.</div>'}function playSong(q){window.open('https://www.youtube.com/results?search_query='+q,'_blank','noopener,noreferrer')}function post(payload){return fetch(GAS,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})}async function changeStatus(id,on){let r=data.find(x=>x.id===id);if(!r)return;let old=r.status;r.status=on?'played':'pending';render();try{await post({action:'updateStatus',id:id,status:r.status});toast('Status diperbarui.')}catch(e){r.status=old;render();toast('Gagal memperbarui status',true)}}async function del(id){let r=data.find(x=>x.id===id);if(!r||!confirm('Hapus request "'+r.title+'"?'))return;let old=data;data=data.filter(x=>x.id!==id);render();try{await post({action:'delete',id:id});toast('Request dihapus.')}catch(e){data=old;render();toast('Gagal menghapus request',true)}}async function markAll(){let rows=visible().filter(x=>x.status==='pending');if(!rows.length)return toast('Tidak ada request belum diputar.');if(!confirm('Tandai '+rows.length+' request sebagai selesai?'))return;rows.forEach(r=>r.status='played');render();try{await post({action:'updateStatuses',items:rows.map(r=>({id:r.id,status:'played'}))});toast(rows.length+' request ditandai selesai.')}catch(e){toast('Perubahan sedang dikirim ke server.',true)}}async function clearVisible(){let rows=visible();if(!rows.length)return toast('Tidak ada request pada filter ini.');if(!confirm('Hapus '+rows.length+' request yang tampil?'))return;let old=data;data=data.filter(x=>!rows.some(y=>y.id===x.id));render();try{await post({action:'deleteBatch',ids:rows.map(x=>x.id)});toast(rows.length+' request dihapus.')}catch(e){data=old;render();toast('Gagal menghapus request',true)}}show();if(sessionStorage.getItem('kudajitu_admin')==='1')load(true);setInterval(()=>{if(sessionStorage.getItem('kudajitu_admin')==='1')load(false)},30000);</script></body></html>
