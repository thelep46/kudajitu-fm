<!doctype html><html lang="id" class="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUDAJITU FM • Admin</title><meta name="description" content="Panel admin KUDAJITU FM untuk mengelola antrean request lagu."><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script>tailwind.config={theme:{extend:{colors:{brand:{400:'#2dd4bf',500:'#14b8a6',600:'#0d9488'}}}}}</script><style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#061114;color:#f3f4f6}.glass{background:rgba(10,24,27,.9);backdrop-filter:blur(14px);border:1px solid rgba(45,212,191,.15)}.field{width:100%;background:#030a0c;border:1px solid #115e59;border-radius:.75rem;padding:.7rem 1rem;color:white;outline:0}.field:focus{border-color:#2dd4bf}.btn{padding:.65rem 1rem;border-radius:.7rem;font-size:.75rem;font-weight:800}.danger{background:#4a1118;border:1px solid #7f1d1d;color:#fecaca}.ok{background:#0d9488;color:white}.play{background:#164e63;border:1px solid #0e7490;color:#a5f3fc}.muted{color:#9ca3af}.filter{padding:.45rem .75rem;border-radius:.6rem;font-size:.7rem;font-weight:800;color:#9ca3af}.filter.active{background:#0d9488;color:white}</style></head><body class="min-h-screen"><header class="sticky top-0 z-40 glass border-b border-teal-900/50 px-4 lg:px-8 py-3"><div class="max-w-7xl mx-auto flex justify-between items-center gap-3"><div class="min-w-0"><h1 class="font-extrabold text-xl">KUDAJITU FM <span class="text-xs text-brand-300">ADMIN</span></h1><p class="text-xs muted truncate">Dashboard pengelolaan request</p></div><div class="flex gap-2"><a href="./" class="btn bg-gray-950 border border-teal-800"><i class="fa-solid fa-arrow-left mr-1"></i>Halaman User</a></div></div></header><main class="max-w-7xl mx-auto px-4 lg:px-8 py-6"><section id="login" class="max-w-md mx-auto mt-10"><div class="glass rounded-2xl p-7"><div class="text-center mb-6"><div class="w-16 h-16 mx-auto rounded-2xl bg-brand-600/20 flex items-center justify-center mb-3"><i class="fa-solid fa-user-shield text-2xl text-brand-400"></i></div><h2 class="text-xl font-extrabold">Login Admin</h2><p class="text-xs muted mt-1">Akses khusus pengelola KUDAJITU FM</p></div><input id="password" type="password" autocomplete="current-password" placeholder="Password admin" class="field mb-3" onkeydown="if(event.key==='Enter')login()"><button onclick="login()" class="btn ok w-full"><i class="fa-solid fa-right-to-bracket mr-1"></i>Masuk ke Dashboard</button><p id="loginMsg" class="text-xs text-red-400 mt-3 text-center"></p></div></section><section id="dashboard" class="hidden space-y-6"><div class="flex flex-wrap justify-between items-center gap-3"><div><h2 class="text-2xl font-extrabold">Dashboard Admin</h2><p class="text-xs muted">User hanya melihat request hari ini. Admin tetap dapat melihat riwayat.</p></div><button onclick="logout()" class="btn bg-gray-950 border border-teal-800"><i class="fa-solid fa-right-from-bracket mr-1"></i>Keluar</button></div><div class="grid grid-cols-3 gap-3"><div class="glass rounded-xl p-4 text-center"><span class="text-[10px] muted block">ANTREAN</span><b id="pending" class="text-2xl text-amber-300">0</b></div><div class="glass rounded-xl p-4 text-center"><span class="text-[10px] muted block">SELESAI</span><b id="played" class="text-2xl text-brand-300">0</b></div><div class="glass rounded-xl p-4 text-center"><span class="text-[10px] muted block">TOTAL</span><b id="total" class="text-2xl text-cyan-300">0</b></div></div><div class="glass rounded-2xl p-5"><div class="flex flex-wrap items-center justify-between gap-3 mb-4"><div><div class="flex bg-gray-950 p-1 rounded-xl border border-teal-900/50"><button id="dToday" onclick="setDateFilter('today')" class="filter active">Hari Ini</button><button id="dYesterday" onclick="setDateFilter('yesterday')" class="filter">Kemarin</button><button id="dAll" onclick="setDateFilter('all')" class="filter">Semua</button></div><p id="dateLabel" class="text-[11px] text-gray-500 mt-2">Menampilkan request hari ini</p></div><div class="flex flex-wrap gap-2"><button onclick="markAll()" class="btn ok"><i class="fa-solid fa-check mr-1"></i>Tandai Semua</button><button onclick="clearVisible()" class="btn danger"><i class="fa-solid fa-trash mr-1"></i>Hapus Tampilan</button><button onclick="load(true)" class="btn bg-gray-950 border border-teal-800"><i class="fa-solid fa-rotate mr-1"></i>Refresh</button></div></div><div id="list" class="space-y-3"></div></div></section></main><div id="toast" class="fixed right-4 bottom-4 z-50"></div><script>'use strict';const GAS='https://script.google.com/macros/s/AKfycbyUB8drjL1dSJedYjKIKjVc5gzIE3Pe-QS0FF8o1_zU4NkAweGLFquhHLfy1Nt_eITA-Q/exec',PASSWORD='290979';let data=[],busy=false,dateFilter='today';const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}function toast(t,type='ok'){let e=document.createElement('div');e.className='glass rounded-xl px-4 py-3 text-xs shadow-xl '+(type==='error'?'border border-red-700':'border border-teal-800');e.innerHTML='<i class="fa-solid '+(type==='error'?'fa-circle-exclamation text-red-400':'fa-circle-check text-brand-400')+' mr-2"></i>'+esc(t);$('toast').appendChild(e);setTimeout(()=>e.remove(),2500)}function login(){if($('password').value!==PASSWORD){$('loginMsg').textContent='Password admin salah.';return}$('loginMsg').textContent='';sessionStorage.setItem('kudajitu_admin','1');show();load(true)}function show(){if(sessionStorage.getItem('kudajitu_admin')!=='1')return;$('login').classList.add('hidden');$('dashboard').classList.remove('hidden')}function logout(){sessionStorage.removeItem('kudajitu_admin');location.reload()}function norm(x){return{id:String(x?.id??''),requester:String(x?.requester??''),title:String(x?.title??''),artist:String(x?.artist??''),note:String(x?.note??''),timestamp:x?.timestamp??'',status:String(x?.status??'pending').toLowerCase()==='played'?'played':'pending'}}function dateKey(v){let d=new Date(v);if(!isFinite(d.getTime()))return'';return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function shiftKey(days){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+days);return dateKey(d)}function visibleData(){let today=shiftKey(0),yesterday=shiftKey(-1);if(dateFilter==='today')return data.filter(x=>dateKey(x.timestamp)===today);if(dateFilter==='yesterday')return data.filter(x=>dateKey(x.timestamp)===yesterday);return data}function setDateFilter(f){dateFilter=f;['Today','Yesterday','All'].forEach(x=>$('d'+x).classList.toggle('active',x.toLowerCase()===f));$('dateLabel').textContent=f==='today'?'Menampilkan request hari ini':f==='yesterday'?'Menampilkan request kemarin':'Menampilkan seluruh riwayat request';render()}function ago(v){let d=new Date(v),s=(Date.now()-d.getTime())/1000;if(!isFinite(s)||s<0)return'';if(s<60)return'baru saja';if(s<3600)return Math.floor(s/60)+'m lalu';if(s<86400)return Math.floor(s/3600)+'j lalu';return Math.floor(s/86400)+'h lalu'}async function load(showToast=false){if(busy)return;busy=true;try{let r=await fetch(GAS+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json(),d=Array.isArray(j)?j:j?.data;if(!Array.isArray(d))throw Error('Response tidak valid');data=d.map(norm);render();if(showToast)toast('Data berhasil diperbarui.')}catch(e){console.error(e);toast('Gagal mengambil data dari Google Sheets.','error')}finally{busy=false}}function render(){let rows=visibleData(),pending=rows.filter(x=>x.status==='pending'),played=rows.filter(x=>x.status==='played');$('pending').textContent=pending.length;$('played').textContent=played.length;$('total').textContent=rows.length;$('list').innerHTML=rows.length?rows.map((r,i)=>`<div class="glass rounded-xl p-4 flex flex-col sm:flex-row gap-3 sm:items-center"><div class="w-10 h-10 rounded-xl bg-gray-950 flex items-center justify-center shrink-0 ${r.status==='played'?'text-brand-400':'text-amber-300'}">${r.status==='played'?'<i class="fa-solid fa-check"></i>':'#'+(i+1)}</div><div class="flex-1 min-w-0"><div class="flex flex-wrap items-center gap-2"><b class="block truncate">${esc(r.title)}</b><span class="text-[10px] px-2 py-1 rounded-full ${r.status==='pending'?'bg-amber-500/10 text-amber-300':'bg-brand-500/10 text-brand-300'}">${r.status==='pending'?'MENUNGGU':'SELESAI'}</span></div><span class="text-sm text-gray-400">${esc(r.artist)}</span><div class="text-[11px] muted">${esc(r.requester)}${r.timestamp?' • '+esc(ago(r.timestamp)):''}</div>${r.note?`<div class="text-[11px] text-gray-500 mt-1">${esc(r.note)}</div>`:''}</div><div class="flex flex-wrap gap-2 sm:justify-end"><button onclick="playSong('${encodeURIComponent(r.title+' - '+r.artist)}')" class="btn play"><i class="fa-solid fa-play mr-1"></i>Putar</button><label class="btn ${r.status==='played'?'ok':'bg-gray-950 border border-teal-800'} cursor-pointer"><input type="checkbox" class="mr-2 accent-teal-500" ${r.status==='played'?'checked':''} onchange="status('${esc(r.id)}',this.checked)"><i class="fa-solid fa-check mr-1"></i>Tandai</label><button onclick="del('${esc(r.id)}')" class="btn danger"><i class="fa-solid fa-trash mr-1"></i>Hapus</button></div></div>`).join(''):'<div class="text-center muted py-10"><i class="fa-solid fa-music text-3xl opacity-30 mb-3"></i><p>Belum ada request pada filter ini.</p></div>'}function playSong(q){window.open('https://www.youtube.com/results?search_query='+q,'_blank','noopener,noreferrer')}function post(payload){return fetch(GAS,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})}async function sync(){await new Promise(r=>setTimeout(r,1000));await load()}async function status(id,on){let r=data.find(x=>x.id===String(id));if(!r)return;let old=r.status;r.status=on?'played':'pending';render();try{await post({action:'updateStatus',id:String(id),status:r.status});await sync();toast('Status diperbarui.')}catch(e){r.status=old;render();toast('Status gagal diperbarui.','error')}}async function del(id){let r=data.find(x=>x.id===String(id));if(!r||!confirm('Hapus request "'+r.title+'"?'))return;let old=[...data];data=data.filter(x=>x.id!==String(id));render();try{await post({action:'delete',id:String(id)});await sync();toast('Request dihapus.')}catch(e){data=old;render();toast('Request gagal dihapus.','error')}}async function markAll(){let rows=visibleData().filter(x=>x.status==='pending');if(!rows.length)return toast('Tidak ada antrean pada filter ini.');if(!confirm('Tandai '+rows.length+' request sebagai selesai?'))return;for(const r of rows)await post({action:'updateStatus',id:r.id,status:'played'});toast('Request ditandai selesai.');await sync()}async function clearVisible(){let rows=visibleData();if(!rows.length)return toast('Tidak ada request pada filter ini.');if(!confirm('Hapus '+rows.length+' request yang sedang ditampilkan?'))return;for(const r of rows)await post({action:'delete',id:r.id});toast('Request yang ditampilkan telah dihapus.');await sync()}show();if(sessionStorage.getItem('kudajitu_admin')==='1')load();setInterval(()=>{if(sessionStorage.getItem('kudajitu_admin')==='1')load()},10000);</script></body></html>
