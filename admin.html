<!doctype html><html lang="id" class="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUDAJITU FM • Admin</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#061114;color:#f3f4f6}.glass{background:rgba(10,24,27,.92);backdrop-filter:blur(14px);border:1px solid rgba(45,212,191,.15)}.btn{padding:.65rem 1rem;border-radius:.7rem;font-size:.75rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center}.filter{padding:.45rem .75rem;border-radius:.6rem;font-size:.7rem;font-weight:800;color:#9ca3af}.filter.active{background:#0d9488;color:white}.field{width:100%;background:#030a0c;border:1px solid #115e59;border-radius:.75rem;padding:.7rem 1rem;color:white;outline:0}</style></head><body class="min-h-screen"><header class="sticky top-0 z-40 glass border-b border-teal-900/50 px-4 lg:px-8 py-3"><div class="max-w-7xl mx-auto flex flex-col lg:flex-row lg:justify-between lg:items-center gap-3"><div><h1 class="font-extrabold text-xl">KUDAJITU FM <span class="text-xs text-teal-300">ADMIN</span></h1><p class="text-xs text-gray-400">Dashboard pengelolaan request</p></div><nav class="flex flex-wrap gap-2"><a href="users.html" class="btn bg-cyan-950 border border-cyan-800">👥 User Management</a><a href="announcement.html" class="btn bg-teal-950 border border-teal-700">📢 Pengumuman</a><a href="./" class="btn bg-gray-950 border border-teal-800">🏠 User</a></nav></div></header><main class="max-w-7xl mx-auto px-4 lg:px-8 py-6"><section id="login" class="max-w-md mx-auto mt-10"><div class="glass rounded-2xl p-7"><h2 class="text-xl font-extrabold text-center mb-5">Login Admin</h2><input id="password" type="password" class="field mb-3" placeholder="Password admin" onkeydown="if(event.key==='Enter')login()"><button onclick="login()" class="btn w-full bg-teal-600">Masuk</button><p id="loginMsg" class="text-xs text-red-400 mt-3 text-center"></p></div></section><section id="dashboard" class="hidden space-y-5"><div class="flex flex-wrap justify-between items-center gap-3"><div><h2 class="text-2xl font-extrabold">Dashboard Admin</h2><p id="sourceInfo" class="text-xs text-gray-500">Memuat...</p></div><div class="flex gap-2"><button id="refreshBtn" onclick="load(true)" class="btn bg-gray-950 border border-teal-800">Refresh</button><button onclick="logout()" class="btn bg-gray-950 border border-teal-800">Keluar</button></div></div><div class="grid grid-cols-3 gap-3"><div class="glass rounded-xl p-4 text-center"><span class="text-[10px] text-gray-500 block">ANTREAN</span><b id="pending" class="text-2xl text-amber-300">0</b></div><div class="glass rounded-xl p-4 text-center"><span class="text-[10px] text-gray-500 block">SELESAI</span><b id="played" class="text-2xl text-teal-300">0</b></div><div class="glass rounded-xl p-4 text-center"><span class="text-[10px] text-gray-500 block">TOTAL</span><b id="total" class="text-2xl text-cyan-300">0</b></div></div><div class="glass rounded-2xl p-5"><div class="flex flex-wrap justify-between gap-3 mb-4"><div class="flex bg-gray-950 p-1 rounded-xl border border-teal-900/50"><button id="dToday" onclick="setDate('today')" class="filter active">Hari Ini</button><button id="dYesterday" onclick="setDate('yesterday')" class="filter">Kemarin</button><button id="dAll" onclick="setDate('all')" class="filter">Semua</button></div><div class="flex gap-2"><button id="markAllBtn" onclick="markAll()" class="btn bg-teal-600">✓ Tandai Semua</button><button onclick="clearVisible()" class="btn bg-red-950 border border-red-800">Hapus Tampilan</button></div></div><div class="flex flex-wrap items-center gap-2 mb-4"><span class="text-[10px] uppercase font-extrabold text-gray-500">Status:</span><button id="sAll" onclick="setStatus('all')" class="filter active">Semua</button><button id="sNew" onclick="setStatus('new')" class="filter">Request Baru</button><button id="sPending" onclick="setStatus('pending')" class="filter">Belum Diputar</button><button id="sPlayed" onclick="setStatus('played')" class="filter">Sudah Diputar</button></div><div id="list" class="space-y-3"></div></div></section></main><div id="toast" class="fixed right-4 bottom-4 z-50 space-y-2 max-w-sm"></div><script>'use strict';const GAS='https://script.google.com/macros/s/AKfycbyUB8drjL1dSJedYjKIKjVc5gzIE3Pe-QS0FF8o1_zU4NkAweGLFquhHLfy1Nt_eITA-Q/exec',PASSWORD='290979';let data=[],dateFilter='today',statusFilter='all',loading=false;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toast(t,error=false){const e=document.createElement('div');e.className='glass rounded-xl px-4 py-3 text-xs shadow-xl border '+(error?'border-red-700':'border-teal-800');e.textContent=t;$('toast').appendChild(e);setTimeout(()=>e.remove(),3200)}function busy(b,on,label){if(!b)return;if(on){b.disabled=true;b.dataset.old=b.innerHTML;b.innerHTML=label}else{b.disabled=false;b.innerHTML=b.dataset.old||b.innerHTML}}function login(){if($('password').value!==PASSWORD){$('loginMsg').textContent='Password admin salah.';return}sessionStorage.setItem('kudajitu_admin','1');show();load(true)}function show(){if(sessionStorage.getItem('kudajitu_admin')==='1'){$('login').classList.add('hidden');$('dashboard').classList.remove('hidden')}}function logout(){sessionStorage.removeItem('kudajitu_admin');location.reload()}function norm(x){return{id:String(x?.id??''),requester:String(x?.requester??''),title:String(x?.title??''),artist:String(x?.artist??''),note:String(x?.note??''),timestamp:x?.timestamp??'',status:String(x?.status??'pending').toLowerCase()==='played'?'played':'pending',playedAt:x?.playedAt??''}}function dayKey(offset){const d=new Date();d.setDate(d.getDate()+offset);return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta'}).format(d)}function rowDay(v){const d=new Date(v);return isNaN(d)?'':new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta'}).format(d)}function visible(){let r=dateFilter==='today'?data.filter(x=>rowDay(x.timestamp)===dayKey(0)):dateFilter==='yesterday'?data.filter(x=>rowDay(x.timestamp)===dayKey(-1)):data;if(statusFilter==='pending')return r.filter(x=>x.status==='pending');if(statusFilter==='played')return r.filter(x=>x.status==='played');if(statusFilter==='new')return r.filter(x=>x.status==='pending'&&Date.now()-new Date(x.timestamp).getTime()<3600000);return r}function setDate(f){dateFilter=f;['Today','Yesterday','All'].forEach(x=>$('d'+x).classList.toggle('active',x.toLowerCase()===f));load(false)}function setStatus(f){statusFilter=f;['All','New','Pending','Played'].forEach(x=>$('s'+x).classList.toggle('active',x.toLowerCase()===f));render()}function ago(v){const s=(Date.now()-new Date(v).getTime())/1000;if(!isFinite(s)||s<0)return'';if(s<60)return'baru saja';if(s<3600)return Math.floor(s/60)+'m lalu';if(s<86400)return Math.floor(s/3600)+'j lalu';return Math.floor(s/86400)+'h lalu'}function render(){const rows=visible(),pending=rows.filter(x=>x.status==='pending').sort((a,b)=>(new Date(a.timestamp).getTime()||0)-(new Date(b.timestamp).getTime()||0)),played=rows.filter(x=>x.status==='played').sort((a,b)=>(new Date(b.playedAt||b.timestamp).getTime()||0)-(new Date(a.playedAt||a.timestamp).getTime()||0));let ordered=statusFilter==='pending'||statusFilter==='new'?pending:statusFilter==='played'?played:pending.concat(played);$('pending').textContent=pending.length;$('played').textContent=played.length;$('total').textContent=rows.length;$('list').innerHTML=ordered.length?ordered.map((r)=>{const pos=r.status==='pending'?pending.findIndex(x=>x.id===r.id)+1:0;return `<div class="glass rounded-xl p-4 flex flex-col sm:flex-row gap-3 sm:items-center" data-id="${esc(r.id)}"><div class="w-10 h-10 rounded-xl bg-gray-950 flex items-center justify-center shrink-0 ${r.status==='played'?'text-teal-400':'text-amber-300'}">${r.status==='played'?'✓':'#'+pos}</div><div class="flex-1 min-w-0"><div class="flex flex-wrap items-center gap-2"><b class="truncate">${esc(r.title)}</b><span class="text-[10px] px-2 py-1 rounded-full ${r.status==='pending'?'bg-amber-500/10 text-amber-300':'bg-teal-500/10 text-teal-300'}">${r.status==='pending'?'BELUM DIPUTAR':'SUDAH DIPUTAR'}</span></div><div class="text-sm text-gray-400">${esc(r.artist)}</div><div class="text-[11px] text-gray-500">${esc(r.requester)}${r.timestamp?' • '+esc(ago(r.timestamp)):''}</div>${r.note?`<div class="text-[11px] text-gray-500">${esc(r.note)}</div>`:''}</div><div class="flex flex-wrap gap-2"><button class="btn bg-cyan-950 border border-cyan-800" onclick="playSong('${encodeURIComponent(r.title+' - '+r.artist)}')">▶ Putar</button><label class="btn ${r.status==='played'?'bg-teal-600':'bg-gray-950 border border-teal-800'} cursor-pointer"><input type="checkbox" class="mr-2" ${r.status==='played'?'checked':''} onchange="changeStatus('${encodeURIComponent(r.id)}',this)">✓ Tandai</label><button class="btn bg-red-950 border border-red-800" onclick="del('${encodeURIComponent(r.id)}',this)">Hapus</button></div></div>`}).join(''):'<div class="text-center text-gray-500 py-10">Belum ada request pada filter ini.</div>'}function playSong(q){window.open('https://www.youtube.com/results?search_query='+q,'_blank','noopener,noreferrer')}function jsonp(url,timeout=15000){return new Promise((resolve,reject)=>{const cb='__admin_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const timer=setTimeout(()=>finish(Error('Timeout')),timeout);function finish(err,res){if(done)return;done=true;clearTimeout(timer);s.remove();try{delete window[cb]}catch(e){}err?reject(err):resolve(res)}window[cb]=d=>d&&d.success!==false?finish(null,d):finish(Error(d?.message||'Server gagal'));s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&_='+Date.now();s.onerror=()=>finish(Error('Network error'));document.head.appendChild(s)})}async function retry(fn,n=3){let e;for(let i=0;i<n;i++){try{return await fn()}catch(x){e=x;if(i<n-1)await new Promise(r=>setTimeout(r,700*(i+1)))}}throw e}async function load(force=false){if(loading)return;loading=true;busy($('refreshBtn'),true,'Memuat...');try{const j=await retry(()=>jsonp(GAS+'?range='+encodeURIComponent(dateFilter)));data=(j.data||[]).map(norm);render();$('sourceInfo').textContent='Terakhir diperbarui '+new Date().toLocaleTimeString('id-ID');if(force)toast('Data berhasil diperbarui.')}catch(e){console.error(e);$('sourceInfo').textContent='Gagal sinkronisasi';toast('Gagal memuat data: '+e.message,true)}finally{loading=false;busy($('refreshBtn'),false)}}async function action(url,msg){const res=await retry(()=>jsonp(url,20000));if(!res||res.success!==true)throw Error(res?.message||'Server tidak mengonfirmasi perubahan');toast(res.message||msg);return res}async function changeStatus(id,box){const realId=decodeURIComponent(id),row=data.find(x=>x.id===realId);if(!row)return;const oldStatus=row.status,oldPlayedAt=row.playedAt;const st=box.checked?'played':'pending';box.disabled=true;try{const res=await action(GAS+'?action=markPlayed&id='+encodeURIComponent(realId)+'&status='+st,st==='played'?'Lagu ditandai sudah diputar.':'Lagu dikembalikan ke antrean.');row.status=res.status||st;row.playedAt=res.playedAt||'';render();await new Promise(r=>setTimeout(r,250));await load(false)}catch(e){row.status=oldStatus;row.playedAt=oldPlayedAt;render();toast('Status gagal disimpan: '+e.message,true)}finally{box.disabled=false}}async function del(id,btn){const realId=decodeURIComponent(id),row=data.find(x=>x.id===realId);if(!row||!confirm('Hapus request "'+row.title+'"?'))return;busy(btn,true,'Menghapus...');try{await action(GAS+'?action=delete&id='+encodeURIComponent(realId),'Request dihapus.');await load(false)}catch(e){toast('Gagal menghapus: '+e.message,true)}finally{busy(btn,false)}}async function markAll(){const rows=visible().filter(x=>x.status==='pending');if(!rows.length){toast('Tidak ada request yang belum diputar.');return}if(!confirm('Tandai '+rows.length+' request sebagai sudah diputar?'))return;try{await action(GAS+'?action=updateStatuses&ids='+encodeURIComponent(rows.map(x=>x.id).join(','))+'&status=played',rows.length+' request diperbarui.');await load(false)}catch(e){toast('Gagal menandai semua: '+e.message,true)}}async function clearVisible(){const rows=visible();if(!rows.length)return;if(!confirm('Hapus '+rows.length+' request yang sedang tampil?'))return;try{await action(GAS+'?action=deleteBatch&ids='+encodeURIComponent(rows.map(x=>x.id).join(',')),'Request yang tampil dihapus.');await load(false)}catch(e){toast('Gagal menghapus: '+e.message,true)}}window.addEventListener('DOMContentLoaded',()=>{show();if(sessionStorage.getItem('kudajitu_admin')==='1')load(true)});</script></body></html>
