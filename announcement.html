<!doctype html><html lang="id" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUDAJITU FM • Pengumuman</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#061114;color:#f3f4f6}.glass{background:rgba(10,24,27,.9);backdrop-filter:blur(14px);border:1px solid rgba(45,212,191,.15)}.field{width:100%;background:#030a0c;border:1px solid #115e59;border-radius:.75rem;padding:.7rem 1rem;color:white;outline:0}.btn{padding:.65rem 1rem;border-radius:.7rem;font-size:.75rem;font-weight:800}.toast{position:fixed;right:16px;bottom:16px;padding:12px 16px;border-radius:12px;background:#0a181b;border:1px solid #115e59;z-index:50}.preview{position:fixed;inset:0;background:rgba(0,0,0,.76);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:18px;z-index:40}.preview.show{display:flex}.card{width:min(520px,100%);background:#071719;border:1px solid rgba(45,212,191,.3);border-radius:24px;padding:24px;box-shadow:0 25px 80px #0008}.content{white-space:pre-wrap;word-break:break-word;color:#cbd5e1;line-height:1.7}</style></head><body class="min-h-screen"><header class="sticky top-0 z-30 glass px-4 lg:px-8 py-3"><div class="max-w-5xl mx-auto flex justify-between items-center"><div><h1 class="font-extrabold text-xl">KUDAJITU FM <span class="text-xs text-teal-300">ADMIN</span></h1><p class="text-xs text-gray-400">📢 Pengumuman User</p></div><a href="admin.html" class="btn bg-gray-950 border border-teal-800">← Dashboard</a></div></header><main class="max-w-5xl mx-auto px-4 py-6"><section class="glass rounded-2xl p-6 space-y-5"><div><h2 class="text-2xl font-extrabold">Pengumuman User</h2><p class="text-xs text-gray-500 mt-1">Atur informasi yang akan muncul sebagai popup di halaman user. Data disimpan di Apps Script Properties, bukan Google Sheet.</p></div><div class="flex items-center justify-between p-4 rounded-xl bg-gray-950/70 border border-teal-900/50"><div><b class="text-sm">Status Pengumuman</b><p id="statusText" class="text-xs text-gray-500">Memuat...</p></div><label class="relative inline-flex items-center cursor-pointer"><input id="enabled" type="checkbox" class="sr-only peer"><div class="w-12 h-6 bg-gray-700 rounded-full peer peer-checked:bg-teal-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-6"></div></label></div><div class="grid md:grid-cols-2 gap-4"><div><label class="text-xs font-bold uppercase text-gray-400">Jenis</label><select id="type" class="field mt-1"><option value="info">🔵 Informasi</option><option value="warning">🟡 Peringatan</option><option value="important">🔴 Penting</option></select></div><div><label class="text-xs font-bold uppercase text-gray-400">Tampilan</label><select id="mode" class="field mt-1"><option value="once">Tampilkan sekali per pengumuman</option><option value="always">Tampilkan setiap membuka/sinkronisasi</option></select></div></div><div><label class="text-xs font-bold uppercase text-gray-400">Judul</label><input id="title" maxlength="120" class="field mt-1" placeholder="Contoh: INFORMASI KUDAJITU FM"></div><div><label class="text-xs font-bold uppercase text-gray-400">Isi Pengumuman</label><textarea id="content" maxlength="5000" rows="10" class="field mt-1" placeholder="Tulis informasi apa saja di sini...&#10;&#10;Bisa menggunakan beberapa baris dan emoji 🎵📢"></textarea><p class="text-[10px] text-gray-500 mt-1">Maksimal 5.000 karakter.</p></div><div class="flex flex-wrap gap-2"><button id="previewBtn" onclick="preview()" class="btn bg-gray-950 border border-teal-800">👁 Preview</button><button id="saveBtn" onclick="save()" class="btn bg-teal-600">💾 Simpan & Tampilkan</button><button onclick="disableAnn()" class="btn bg-red-950 border border-red-800">Nonaktifkan</button></div></section></main><div id="toast" class="toast hidden"></div><div id="preview" class="preview"><div class="card"><div class="flex gap-3"><div id="picon" class="w-11 h-11 rounded-xl bg-teal-500/15 text-teal-300 flex items-center justify-center text-xl">📢</div><div class="flex-1"><h3 id="ptitle" class="font-extrabold text-lg"></h3><span class="text-[10px] text-gray-500 uppercase tracking-widest">Pengumuman</span></div><button onclick="closePreview()" class="text-gray-400 text-xl">×</button></div><div id="pcontent" class="content mt-4 max-h-[52vh] overflow-auto"></div><div class="text-right mt-5 pt-4 border-t border-teal-900/40"><button onclick="closePreview()" class="btn bg-teal-600">✓ Saya Mengerti</button></div></div></div><script>'use strict';const GAS='https://script.google.com/macros/s/AKfycbyUB8drjL1dSJedYjKIKjVc5gzIE3Pe-QS0FF8o1_zU4NkAweGLFquhHLfy1Nt_eITA-Q/exec',KEY='290979',$=id=>document.getElementById(id);function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2500)}function jsonp(url,timeout){return new Promise((resolve,reject)=>{let cb='__a_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script'),done=false,t=setTimeout(()=>{finish();reject(Error('Timeout'))},timeout||10000);function finish(){if(done)return;done=true;clearTimeout(t);s.remove();try{delete window[cb]}catch(e){}}window[cb]=d=>{finish();d&&d.success!==false?resolve(d):reject(Error(d?.message||'Gagal'))};s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&_='+Date.now();s.onerror=()=>{finish();reject(Error('Network error'))};document.head.appendChild(s)})}function fill(a){$('enabled').checked=!!a.enabled;$('type').value=a.type||'info';$('mode').value=a.mode||'once';$('title').value=a.title||'';$('content').value=a.content||'';$('statusText').textContent=a.enabled?'Aktif':'Nonaktif'}function load(){jsonp(GAS+'?action=announcement').then(r=>fill(r.announcement||{})).catch(()=>toast('Gagal mengambil pengumuman.'))}function preview(){let t=$('type').value;$('ptitle').textContent=$('title').value||'INFORMASI KUDAJITU FM';$('pcontent').textContent=$('content').value||'Belum ada isi pengumuman.';$('picon').textContent=t==='important'?'⚠️':t==='warning'?'🔔':'📢';$('preview').classList.add('show')}function closePreview(){$('preview').classList.remove('show')}function save(){let title=$('title').value.trim(),content=$('content').value.trim();if(!title||!content){toast('Judul dan isi pengumuman wajib diisi.');return}let b=$('saveBtn');b.disabled=true;jsonp(GAS+'?action=saveannouncement&adminKey='+encodeURIComponent(KEY)+'&enabled='+$('enabled').checked+'&type='+encodeURIComponent($('type').value)+'&mode='+encodeURIComponent($('mode').value)+'&title='+encodeURIComponent(title)+'&content='+encodeURIComponent(content),15000).then(r=>{fill(r.announcement||{});toast('Pengumuman berhasil disimpan dan ditampilkan.')}).catch(()=>toast('Gagal menyimpan pengumuman.')).finally(()=>b.disabled=false)}function disableAnn(){jsonp(GAS+'?action=clearannouncement&adminKey='+encodeURIComponent(KEY)+'&enabled=false&type=info&mode=once&title=&content=',15000).then(r=>{fill(r.announcement||{});toast('Pengumuman dinonaktifkan.')}).catch(()=>toast('Gagal menonaktifkan.'))}load();</script></body></html>
