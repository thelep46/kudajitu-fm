<!doctype html>
<html lang="id" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>KUDAJITU FM • Maintenance</title>
  <meta name="description" content="KUDAJITU FM sedang dalam pemeliharaan sistem.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:#061114;color:#f3f4f6}
    .glass{background:rgba(10,24,27,.82);backdrop-filter:blur(16px);border:1px solid rgba(45,212,191,.16)}
    .glow{box-shadow:0 0 45px rgba(20,184,166,.12)}
    .disc{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle,#14b8a6 0 8%,#111827 9% 11%,#374151 12% 14%,#111827 15% 22%,#374151 23% 24%,#111827 25% 34%,#374151 35% 36%,#111827 37% 49%,#020617 50%);box-shadow:inset 0 0 12px rgba(0,0,0,.8),0 0 24px rgba(45,212,191,.25);animation:spin 5s linear infinite}
    .ring{position:absolute;width:112px;height:112px;border-radius:50%;border:1px solid rgba(45,212,191,.35);animation:pulse 2s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{50%{transform:scale(1.08);opacity:.45}}
    @media(prefers-reduced-motion:reduce){.disc,.ring{animation:none}}
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-5">
  <main class="w-full max-w-lg text-center">
    <div class="glass glow rounded-3xl p-8 md:p-10">
      <div class="relative w-28 h-28 mx-auto mb-7 flex items-center justify-center">
        <div class="ring"></div>
        <div class="disc"></div>
      </div>
      <div class="text-xs font-extrabold tracking-[.25em] text-teal-300 mb-3">KUDAJITU FM</div>
      <h1 class="text-2xl md:text-3xl font-extrabold mb-3">Sedang Dalam Pemeliharaan</h1>
      <p class="text-sm md:text-base leading-relaxed text-gray-400 max-w-md mx-auto">
        Kami sedang melakukan pemeliharaan dan peningkatan sistem agar KUDAJITU FM dapat berjalan lebih baik.
      </p>
      <div class="mt-7 inline-flex items-center gap-2 px-4 py-2 rounded-full bg-teal-500/10 border border-teal-500/20 text-xs text-teal-300">
        <span class="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></span>
        Sistem sedang diperbarui
      </div>
      <button type="button" onclick="location.reload()" class="mt-7 w-full py-3 rounded-xl bg-teal-600 hover:bg-teal-500 transition font-extrabold text-sm text-white">
        Coba Lagi
      </button>
    </div>
    <p class="mt-5 text-[11px] text-gray-600">Terima kasih atas pengertiannya.</p>
  </main>
</body>
</html>
