name: Patch Admin Header Layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move player into menu and controls into header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')

          old_nav = '''<nav class="flex items-center gap-2">
          <a href="player.html" class="btn bg-teal-600 text-white">🎧 <span class="hidden sm:inline">Player</span></a>
          <div class="relative"><details><summary class="btn bg-gray-950 border border-teal-800">☰ <span class="hidden sm:inline">Menu</span></summary><div class="menu-panel glass shadow-2xl"><a href="users.html" class="menu-link">👥 User Management</a><a href="announcement.html" class="menu-link">📢 Pengumuman</a><a href="youtube-mapping.html" class="menu-link">🎵 YouTube Mapping</a><a href="./" class="menu-link">🏠 Halaman User</a></div></details></div>
          </nav>'''

          new_nav = '''<nav class="flex items-center gap-2">
          <button id="headerRefreshBtn" onclick="load(true)" class="btn bg-gray-950 border border-teal-800" title="Refresh">↻ <span class="hidden sm:inline">Refresh</span></button>
          <button onclick="logout()" class="btn bg-gray-950 border border-teal-800" title="Keluar">↪ <span class="hidden sm:inline">Keluar</span></button>
          <div class="relative"><details><summary class="btn bg-teal-600 text-white">☰ <span class="hidden sm:inline">Menu</span></summary><div class="menu-panel glass shadow-2xl"><a href="player.html" class="menu-link">🎧 Player</a><a href="users.html" class="menu-link">👥 User Management</a><a href="announcement.html" class="menu-link">📢 Pengumuman</a><a href="youtube-mapping.html" class="menu-link">🎵 YouTube Mapping</a><a href="./" class="menu-link">🏠 Halaman User</a></div></details></div>
          </nav>'''

          old_row = '''<div class="flex flex-wrap items-center justify-between gap-3"><div><p class="text-[10px] uppercase tracking-widest text-teal-400 font-extrabold">Control Room</p><h2 class="text-xl sm:text-2xl font-extrabold">Antrean Request</h2><p id="sourceInfo" class="text-[11px] text-gray-500 mt-1">Memuat...</p></div><div class="flex gap-2"><button id="refreshBtn" onclick="load(true)" class="btn bg-gray-950 border border-teal-800">↻ Refresh</button><button onclick="logout()" class="btn bg-gray-950 border border-teal-800">Keluar</button></div></div>'''
          new_row = '''<div class="flex flex-wrap items-center justify-between gap-3"><div><p class="text-[10px] uppercase tracking-widest text-teal-400 font-extrabold">Control Room</p><h2 class="text-xl sm:text-2xl font-extrabold">Antrean Request</h2><p id="sourceInfo" class="text-[11px] text-gray-500 mt-1">Memuat...</p></div></div>'''

          if old_nav not in s:
              raise SystemExit('Expected header navigation not found; aborting without changes.')
          if old_row not in s:
              raise SystemExit('Expected dashboard action row not found; aborting without changes.')

          s = s.replace(old_nav, new_nav, 1)
          s = s.replace(old_row, new_row, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove temporary patch workflow and commit
        run: |
          rm -f .github/workflows/patch-admin-header-layout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add admin.html .github/workflows/patch-admin-header-layout.yml
          git commit -m 'fix: tidy admin header navigation'
          git push
