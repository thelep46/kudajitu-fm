name: Repair Player Admin Session
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch session persistence and heartbeat
        shell: python
        run: |
          from pathlib import Path
          import sys
          p = Path('apps-script/AuthRouter.gs')
          s = p.read_text(encoding='utf-8')
          s = s.replace("var KUDA_AUTH_TOKEN_CACHE_SECONDS=21600;var KUDA_USERS_SHEET='users';var KUDA_ADMIN_TOKEN_CACHE_SECONDS=21600;var KUDA_ADMIN_HASH_PROPERTY='KUDA_ADMIN_PASSWORD_HASH';var KUDA_USER_LOGIN_MODE_PROPERTY='KUDA_USER_LOGIN_MODE';", "var KUDA_AUTH_TOKEN_CACHE_SECONDS=21600;var KUDA_USERS_SHEET='users';var KUDA_ADMIN_TOKEN_CACHE_SECONDS=21600;var KUDA_ADMIN_HASH_PROPERTY='KUDA_ADMIN_PASSWORD_HASH';var KUDA_ADMIN_SESSION_PROPERTY='KUDA_ADMIN_SESSIONS_V1';var KUDA_USER_LOGIN_MODE_PROPERTY='KUDA_USER_LOGIN_MODE';")
          old = "function kudaAdminHash_(){return String(PropertiesService.getScriptProperties().getProperty(KUDA_ADMIN_HASH_PROPERTY)||'').trim().toLowerCase();}function kudaAdminTokenKey_(t){return'kudajitu_admin_'+String(t);}function kudaAdminToken_(token){if(!token)return false;try{return!!CacheService.getScriptCache().get(kudaAdminTokenKey_(token));}catch(e){return false;}}\nfunction kudaAdminLogin_(p){var pw=String(p.password||'');if(!pw)return{success:false,message:'Password admin wajib diisi.'};var hash=kudaAdminHash_();if(!hash)return{success:false,message:'Login admin belum dikonfigurasi di server.'};if(kudaHash_(pw)!==hash)return{success:false,message:'Password admin salah.'};var token=Utilities.getUuid().replace(/-/g,'')+Utilities.getUuid().replace(/-/g,'');CacheService.getScriptCache().put(kudaAdminTokenKey_(token),JSON.stringify({role:'admin',createdAt:new Date().toISOString()}),KUDA_ADMIN_TOKEN_CACHE_SECONDS);return{success:true,token:token,expiresIn:KUDA_ADMIN_TOKEN_CACHE_SECONDS};}\nfunction kudaAdminSession_(p){return kudaAdminToken_(String(p.token||''))?{success:true,role:'admin'}:{success:false,message:'LOGIN_REQUIRED'};}function kudaAdminLogout_(p){try{CacheService.getScriptCache().remove(kudaAdminTokenKey_(String(p.token||'')));}catch(e){}return{success:true};}function kudaRequireAdmin_(p){if(!kudaAdminToken_(String(p.adminToken||p.token||'')))throw new Error('LOGIN_REQUIRED');return true;}"
          new = "function kudaAdminHash_(){return String(PropertiesService.getScriptProperties().getProperty(KUDA_ADMIN_HASH_PROPERTY)||'').trim().toLowerCase();}function kudaAdminTokenKey_(t){return'kudajitu_admin_'+String(t);}function kudaAdminPropKey_(t){return'kudajitu_admin_session_'+String(t);}\nfunction kudaAdminToken_(token){if(!token)return false;var t=String(token),now=Date.now();try{var raw=PropertiesService.getScriptProperties().getProperty(kudaAdminPropKey_(t));if(raw){var x=JSON.parse(raw);if(x&&Number(x.expiresAt||0)>now){try{CacheService.getScriptCache().put(kudaAdminTokenKey_(t),raw,KUDA_ADMIN_TOKEN_CACHE_SECONDS);}catch(e){}return true;}try{PropertiesService.getScriptProperties().deleteProperty(kudaAdminPropKey_(t));}catch(e){}}}catch(e){}try{return!!CacheService.getScriptCache().get(kudaAdminTokenKey_(t));}catch(e){return false;}}\nfunction kudaAdminLogin_(p){var pw=String(p.password||'');if(!pw)return{success:false,message:'Password admin wajib diisi.'};var hash=kudaAdminHash_();if(!hash)return{success:false,message:'Login admin belum dikonfigurasi di server.'};if(kudaHash_(pw)!==hash)return{success:false,message:'Password admin salah.'};var token=Utilities.getUuid().replace(/-/g,'')+Utilities.getUuid().replace(/-/g,'');var now=Date.now(),record={role:'admin',createdAt:new Date(now).toISOString(),expiresAt:now+KUDA_ADMIN_TOKEN_CACHE_SECONDS*1000};var raw=JSON.stringify(record);try{PropertiesService.getScriptProperties().setProperty(kudaAdminPropKey_(token),raw);}catch(e){}try{CacheService.getScriptCache().put(kudaAdminTokenKey_(token),raw,KUDA_ADMIN_TOKEN_CACHE_SECONDS);}catch(e){}return{success:true,token:token,expiresIn:KUDA_ADMIN_TOKEN_CACHE_SECONDS};}\nfunction kudaAdminSession_(p){var t=String(p.token||''),ok=kudaAdminToken_(t);if(!ok)return{success:false,message:'LOGIN_REQUIRED'};var now=Date.now(),record={role:'admin',createdAt:new Date(now).toISOString(),expiresAt:now+KUDA_ADMIN_TOKEN_CACHE_SECONDS*1000},raw=JSON.stringify(record);try{PropertiesService.getScriptProperties().setProperty(kudaAdminPropKey_(t),raw);CacheService.getScriptCache().put(kudaAdminTokenKey_(t),raw,KUDA_ADMIN_TOKEN_CACHE_SECONDS);}catch(e){}return{success:true,role:'admin'};}function kudaAdminLogout_(p){var t=String(p.token||'');try{PropertiesService.getScriptProperties().deleteProperty(kudaAdminPropKey_(t));}catch(e){}try{CacheService.getScriptCache().remove(kudaAdminTokenKey_(t));}catch(e){}return{success:true};}function kudaRequireAdmin_(p){if(!kudaAdminToken_(String(p.adminToken||p.token||'')))throw new Error('LOGIN_REQUIRED');return true;}"
          if old not in s:
              print('AuthRouter target block not found', file=sys.stderr); sys.exit(1)
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          p2 = Path('player.html')
          t = p2.read_text(encoding='utf-8')
          old2 = "async function auth(){const t=token();if(!t){$('auth').innerHTML='<b>Login Admin diperlukan</b><p class=\"small\">Login di /admin lalu buka menu 🎧 Player.</p>';return false}try{const d=await jsonp(GAS+'?action=adminsession&token='+encodeURIComponent(t),12000);if(d.success){$('auth').innerHTML='<span class=\"ok\">✓ Admin terhubung</span>';return true}}catch(e){}$('auth').innerHTML='<b class=\"error\">Session Admin tidak valid</b>';return false}"
          new2 = old2 + "\nasync function keepAdminSession(){const t=token();if(!t)return false;try{const d=await jsonp(GAS+'?action=adminsession&token='+encodeURIComponent(t),12000);if(d&&d.success){$('auth').innerHTML='<span class=\"ok\">✓ Admin terhubung • sesi aktif</span>';return true}}catch(e){}$('auth').innerHTML='<span class=\"error\">Session Admin tidak valid • recovery diperlukan</span>';return false}\nsetInterval(function(){if(document.visibilityState==='visible')keepAdminSession()},900000);"
          if old2 not in t:
              print('player auth block not found', file=sys.stderr); sys.exit(1)
          t = t.replace(old2, new2)
          p2.write_text(t, encoding='utf-8')

          Path('.github/workflows/repair-player-admin-session.yml').unlink()
      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/AuthRouter.gs player.html
          git add -A .github/workflows/repair-player-admin-session.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix long-running player admin session"
          git push