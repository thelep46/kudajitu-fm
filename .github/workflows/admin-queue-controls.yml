name: Admin Queue Controls

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-queue-controls.yml'
      - 'admin.html'
      - 'apps-script/Code.gs'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch admin queue UI
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          css = r'''
          .queue-row.dragging{opacity:.45;transform:scale(.995)}
          .queue-row.drop-target{border-color:#2dd4bf!important;box-shadow:0 0 0 1px rgba(45,212,191,.18)}
          .queue-actions{display:flex;align-items:center;justify-content:flex-end;gap:.35rem;flex-wrap:wrap}
          .queue-action{min-width:2.15rem;padding:.42rem .55rem;border-radius:.6rem;font-size:.68rem;font-weight:800;border:1px solid rgba(20,184,166,.25);background:#030a0c;color:#d1d5db}
          .queue-action:hover{background:rgba(13,148,136,.14);border-color:rgba(45,212,191,.5)}
          .queue-action.danger{border-color:rgba(185,28,28,.55);color:#fca5a5}
          .queue-action.primary{background:#0d9488;border-color:#0d9488;color:#fff}
          .queue-drag{cursor:grab;color:#64748b;user-select:none;padding:.25rem}
          .queue-drag:active{cursor:grabbing}
          @media(max-width:640px){.queue-actions{justify-content:flex-start;width:100%;padding-top:.35rem;border-top:1px solid rgba(20,184,166,.08)}.queue-action{flex:1;min-width:0}.queue-drag{display:none}}
          '''
          if '.queue-actions{' not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          js=r'''
          /* Admin Queue Controls v1: per-request actions + manual queue order. */
          async function queueMutate(action,id,status){const q=new URLSearchParams();q.set('id',String(id||''));if(status)q.set('status',status);try{const r=await retry(()=>jsonp(adminUrl(action)+'&'+q.toString(),15000),2);if(!r||r.success===false)throw Error(r?.message||'Operasi gagal');toast(action==='delete'?'Request dihapus dari antrean.':(status==='played'?'Request ditandai sudah diputar.':'Request dikembalikan ke antrean.'));await load(false)}catch(e){toast(e.message||'Operasi gagal.',true)}}
          async function queueDelete(id){if(!id)return;if(!confirm('Hapus request ini dari antrean?'))return;await queueMutate('delete',id)}
          async function queueMark(id,current){if(!id)return;await queueMutate('updateStatus',id,current==='played'?'pending':'played')}
          async function saveQueueOrder(ids){const list=ids.filter(Boolean);if(!list.length)return true;try{const r=await retry(()=>jsonp(adminUrl('reorder')+'&ids='+encodeURIComponent(list.join(',')),15000),2);if(!r||r.success===false)throw Error(r?.message||'Gagal menyimpan urutan');return true}catch(e){toast(e.message||'Gagal menyimpan urutan.',true);return false}}
          async function moveQueue(id,direction){const rows=pendingRows();const i=rows.findIndex(x=>String(x.id)===String(id)),j=i+direction;if(i<0||j<0||j>=rows.length)return;[rows[i],rows[j]]=[rows[j],rows[i]];if(await saveQueueOrder(rows.map(x=>String(x.id))))await load(false)}
          function enableQueueDrag(){document.querySelectorAll('#list .queue-row[data-id]').forEach(row=>{if(row.dataset.status!=='pending')return;row.draggable=true;row.addEventListener('dragstart',e=>{row.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',row.dataset.id)});row.addEventListener('dragend',()=>row.classList.remove('dragging'));row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('drop-target');e.dataTransfer.dropEffect='move'});row.addEventListener('dragleave',()=>row.classList.remove('drop-target'));row.addEventListener('drop',async e=>{e.preventDefault();row.classList.remove('drop-target');const from=e.dataTransfer.getData('text/plain'),to=row.dataset.id;if(!from||!to||from===to)return;const rows=pendingRows(),a=rows.findIndex(x=>String(x.id)===String(from)),b=rows.findIndex(x=>String(x.id)===String(to));if(a<0||b<0)return;const[item]=rows.splice(a,1);rows.splice(b,0,item);if(await saveQueueOrder(rows.map(x=>String(x.id))))await load(false)})})}
          window.render=function(){const rows=visible(),pendingCount=data.filter(x=>x.status==='pending').length,playedCount=data.filter(x=>x.status==='played').length;$('pending').textContent=pendingCount;$('played').textContent=playedCount;$('total').textContent=rows.length;if(typeof renderNext==='function')renderNext();if(!rows.length){$('list').innerHTML='<div class="rounded-xl border border-dashed border-teal-900 p-8 text-center"><div class="text-2xl mb-2">📭</div><p class="font-bold">Tidak ada request</p><p class="text-xs text-gray-500 mt-1">Tidak ada data sesuai filter saat ini.</p></div>';return}$('list').innerHTML=rows.map((r,i)=>{const played=r.status==='played',badge=played?'<span class="text-[9px] px-2 py-1 rounded-full bg-teal-950 text-teal-300 border border-teal-900">SUDAH DIPUTAR</span>':'<span class="text-[9px] px-2 py-1 rounded-full bg-amber-950 text-amber-300 border border-amber-900">MENUNGGU</span>',action=played?'↩ Kembalikan':'✓ Tandai',arrows=played?'':`<button class="queue-action" title="Naikkan" onclick="event.stopPropagation();moveQueue('${esc(r.id)}',-1)">↑</button><button class="queue-action" title="Turunkan" onclick="event.stopPropagation();moveQueue('${esc(r.id)}',1)">↓</button>`;return `<article class="queue-row glass rounded-xl p-3 sm:p-4 border border-teal-900/70" data-id="${esc(r.id)}" data-status="${esc(r.status)}"><div class="flex flex-col sm:flex-row sm:items-center gap-3"><div class="flex items-start gap-3 min-w-0 flex-1">${played?'<span class="w-5 shrink-0"></span>':'<span class="queue-drag" title="Tarik untuk mengatur urutan">☰</span>'}<div class="w-8 h-8 sm:w-9 sm:h-9 shrink-0 rounded-lg bg-gray-950 border border-teal-900 flex items-center justify-center text-amber-300 font-extrabold text-xs">#${i+1}</div><div class="min-w-0 flex-1"><div class="flex flex-wrap items-center gap-2"><h4 class="font-extrabold text-sm truncate">${esc(r.title||'(Tanpa judul)')}</h4>${badge}</div><p class="text-[10px] text-gray-400 mt-1 truncate">${esc(r.artist||'Unknown Artist')} • ${esc(r.requester||'Anonymous')}</p><p class="text-[9px] text-gray-600 mt-1">${esc(ago(r.timestamp))}</p></div></div><div class="queue-actions shrink-0">${arrows}<button class="queue-action primary" onclick="event.stopPropagation();queueMark('${esc(r.id)}','${esc(r.status)}')">${action}</button><button class="queue-action danger" onclick="event.stopPropagation();queueDelete('${esc(r.id)}')">🗑 Hapus</button></div></div></article>`}).join('');enableQueueDrag()};
          '''
          if 'Admin Queue Controls v1' not in s:
              pos=s.rfind('</script>')
              if pos<0:raise SystemExit('admin.html: closing script not found')
              s=s[:pos]+js+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY

      - name: Patch Apps Script queue ordering
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('apps-script/Code.gs');s=p.read_text(encoding='utf-8')
          helper=r'''
          var QUEUE_ORDER_KEY_='kudajitu_queue_order_v1';
          function getQueueOrder_(){try{var raw=PropertiesService.getScriptProperties().getProperty(QUEUE_ORDER_KEY_),a=raw?JSON.parse(raw):[];return Array.isArray(a)?a.map(String):[]}catch(e){return[]}}
          function setQueueOrder_(ids){var clean=(ids||[]).map(String).filter(Boolean);PropertiesService.getScriptProperties().setProperty(QUEUE_ORDER_KEY_,JSON.stringify(clean));return clean}
          function applyQueueOrder_(rows){var order=getQueueOrder_(),rank={};order.forEach(function(id,i){rank[String(id)]=i});rows.sort(function(a,b){if(a.status==='played'&&b.status!=='played')return 1;if(a.status!=='played'&&b.status==='played')return -1;if(a.status==='pending'&&b.status==='pending'){var ar=Object.prototype.hasOwnProperty.call(rank,String(a.id))?rank[String(a.id)]:999999999,br=Object.prototype.hasOwnProperty.call(rank,String(b.id))?rank[String(b.id)]:999999999;if(ar!==br)return ar-br;return(toDate_(a.timestamp)||0)-(toDate_(b.timestamp)||0)}return(toDate_(b.playedAt||b.timestamp)||0)-(toDate_(a.playedAt||a.timestamp)||0)});return rows}
          function pruneQueueOrder_(){try{var sheet=getSheet_(),ids={};getIds_(sheet).forEach(function(id){if(id)ids[String(id)]=true});setQueueOrder_(getQueueOrder_().filter(function(id){return ids[String(id)]}))}catch(e){}}
          function reorderQueue_(p){kudaRequireAdmin_(p);var ids=String(p.ids||'').split(',').map(function(x){return x.trim()}).filter(Boolean).slice(0,1000),found=checkIds_(getSheet_(),ids);setQueueOrder_(found);clearCaches_();return{success:true,action:'reorder',count:found.length,ids:found}}
          '''
          if "QUEUE_ORDER_KEY_='kudajitu_queue_order_v1'" not in s:
              marker='function doGet(e){'
              if marker not in s:raise SystemExit('Code.gs: doGet marker not found')
              s=s.replace(marker,helper+'\n'+marker,1)
          old="out.sort(function(a,b){\n    if(a.status==='played'&&b.status==='played')return(toDate_(b.playedAt||b.timestamp)||0)-(toDate_(a.playedAt||a.timestamp)||0);\n    return(toDate_(a.timestamp)||0)-(toDate_(b.timestamp)||0)\n  });\n  return out;"
          new="out.sort(function(a,b){\n    if(a.status==='played'&&b.status==='played')return(toDate_(b.playedAt||b.timestamp)||0)-(toDate_(a.playedAt||a.timestamp)||0);\n    return(toDate_(a.timestamp)||0)-(toDate_(b.timestamp)||0)\n  });\n  return applyQueueOrder_(out);"
          if old in s:s=s.replace(old,new,1)
          old2='function getAllRows_(sheet){var last=sheet.getLastRow();if(last<2)return[];var vals=sheet.getRange(2,1,last-1,9).getValues(),out=[];for(var i=0;i<vals.length;i++)if(vals[i][0])out.push(rowToObject_(vals[i]));out.reverse();return out}'
          new2='function getAllRows_(sheet){var last=sheet.getLastRow();if(last<2)return[];var vals=sheet.getRange(2,1,last-1,9).getValues(),out=[];for(var i=0;i<vals.length;i++)if(vals[i][0])out.push(rowToObject_(vals[i]));out.reverse();return applyQueueOrder_(out)}'
          if old2 in s:s=s.replace(old2,new2,1)
          needle="if(action==='updateStatus'||action==='markPlayed'||action==='updateStatuses'||action==='delete'||action==='deleteBatch'){"
          if "if(action==='reorder')return respond_(cb,reorderQueue_(p));" not in s:
              if needle not in s:raise SystemExit('Code.gs: mutation dispatch marker not found')
              s=s.replace(needle,"if(action==='reorder')return respond_(cb,reorderQueue_(p));\n    "+needle,1)
          s=s.replace("sheet.deleteRow(dr);clearCaches_();return{success:true,action:'delete',id:did};","sheet.deleteRow(dr);pruneQueueOrder_();clearCaches_();return{success:true,action:'delete',id:did};",1)
          s=s.replace("blocks.forEach(function(b){sheet.deleteRows(b.start,b.count)});\n    clearCaches_();return{success:true,action:'deleteBatch',deleted:rows.length};","blocks.forEach(function(b){sheet.deleteRows(b.start,b.count)});\n    pruneQueueOrder_();clearCaches_();return{success:true,action:'deleteBatch',deleted:rows.length};",1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html apps-script/Code.gs
          if git diff --cached --quiet; then echo 'No changes needed.'; exit 0; fi
          git commit -m 'feat: add per-request queue controls and ordering [skip ci]'
          git push
