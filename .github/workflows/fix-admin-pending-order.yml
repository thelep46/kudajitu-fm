name: Fix Admin Pending Order

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-admin-pending-order.yml'
      - 'admin.html'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pending order helper
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          patch="""
          /* Keep admin controls in the same manual order returned by Apps Script. */
          window.pendingRows=function(){return data.filter(function(x){return x.status==='pending'});};
          """
          if 'Keep admin controls in the same manual order' not in s:
              pos=s.rfind('</script>')
              if pos<0: raise SystemExit('admin.html: closing script not found')
              s=s[:pos]+patch+'\n'+s[pos:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: align admin pending order with player [skip ci]'
          git push
