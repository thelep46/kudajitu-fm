# Queue-order consistency patch
name: Fix Admin Pending Order

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-admin-pending-order.yml'
      - 'admin.html'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch queue ordering logic
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')

          # Replace the move handler so rapid clicks are serialized. Each
          # operation works on the result of the previous operation instead
          # of reading stale data and overwriting the last reorder.
          new_move = r'''async function moveQueue(id, direction){
            queueMutationChain = queueMutationChain.then(async () => {
              const rows = pendingRows();
              const i = rows.findIndex(x => String(x.id) === String(id));
              const j = i + direction;
              if(i < 0 || j < 0 || j >= rows.length) return;
              [rows[i], rows[j]] = [rows[j], rows[i]];
              const ids = rows.map(x => String(x.id));
              if(await saveQueueOrder(ids)){
                applyLocalQueueOrder(ids);
                render();
              }
            }).catch(e => toast(e.message || 'Gagal mengubah urutan.', true));
            return queueMutationChain;
          }'''
          s2,n = re.subn(r'async function moveQueue\(id, direction\)\{.*?\n\}', new_move, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('moveQueue function not found')
          s=s2

          # Add shared queue serialization/local-order helpers once.
          marker='/* Queue reorder state: serialize rapid operator changes. */'
          helper = r'''/* Queue reorder state: serialize rapid operator changes. */
          let queueMutationChain = Promise.resolve();
          function applyLocalQueueOrder(ids){
            const rank={}; ids.forEach((id,i)=>rank[String(id)]=i);
            const pending=data.filter(x=>x.status==='pending');
            pending.sort((a,b)=>(rank[String(a.id)]??999999999)-(rank[String(b.id)]??999999999));
            const played=data.filter(x=>x.status!=='pending');
            data=pending.concat(played);
          }
          '''
          if marker not in s:
              pos=s.find('async function moveQueue(id, direction){')
              if pos < 0: raise SystemExit('moveQueue insertion point not found')
              s=s[:pos]+helper+'\n'+s[pos:]

          # Replace drag-drop persistence with the same serialized chain.
          old = r'''      if(await saveQueueOrder(rows.map(x => String(x.id)))) await load(false);'''
          new = r'''      const ids = rows.map(x => String(x.id));
      queueMutationChain = queueMutationChain.then(async () => {
        if(await saveQueueOrder(ids)){
          applyLocalQueueOrder(ids);
          render();
        }
      }).catch(err => toast(err.message || 'Gagal mengubah urutan.', true));
      await queueMutationChain;'''
          if old in s:
              s=s.replace(old,new,1)

          # Keep the manual-order pendingRows override, but never sort it by timestamp.
          manual = "window.pendingRows=function(){return data.filter(function(x){return x.status==='pending'});};"
          if manual not in s:
              pos=s.rfind('</script>')
              if pos<0: raise SystemExit('closing script not found')
              s=s[:pos]+"\n/* Keep admin controls in the same manual order returned by Apps Script. */\n"+manual+'\n'+s[pos:]

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: serialize admin queue reorder operations [skip ci]'
          git push
