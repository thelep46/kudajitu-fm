name: Fix Announcement Auth Mode

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-announcement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch request auth guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('announcement.js')
          s = p.read_text(encoding='utf-8')
          pattern = r"function installRequestAuthGuard\(\)\{.*?window\.__kudaRequestAuthGuard=true;\}"
          replacement = '''function installRequestAuthGuard(){if(window.__kudaRequestAuthGuard)return;if(typeof window.jsonp!=='function')return;var originalJsonp=window.jsonp;window.jsonp=function(url,timeout){var isMutation=/[?&]action=(?:add|addBatch)(?:&|$)/i.test(String(url||''));if(isMutation){var mode=String(window.KUDAJITUUserLoginMode||'open').toLowerCase();if(mode==='required'){var token=getToken();if(!token)return Promise.reject(new Error('LOGIN_REQUIRED'));if(!/[?&]token=/.test(String(url||'')))url+='&token='+encodeURIComponent(token);}}return originalJsonp(url,timeout);};if(typeof window.canSubmit==='function'){window.canSubmit=function(count){var now=Date.now();if(now-(window.lastSubmit||0)<5000){if(typeof window.toast==='function')window.toast('Tunggu beberapa detik sebelum request lagi.','error');return false;}var nameEl=document.getElementById('name'),name=nameEl?nameEl.value.trim():'';if(!name){if(typeof window.toast==='function')window.toast('Nama wajib diisi.','error');return false;}return true;};}window.__kudaRequestAuthGuard=true;}'''
          ns, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate installRequestAuthGuard')
          p.write_text(ns, encoding='utf-8')
          print('Patched announcement.js auth guard to respect KUDAJITUUserLoginMode')
          PY

      - name: Commit patch if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- announcement.js; then
            echo 'No changes to commit.'
          else
            git add announcement.js
            git commit -m 'fix: respect user login mode in request auth guard'
            git push
          fi
