name: Fix Announcement Auth Mode

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-announcement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch request auth guard and login startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('announcement.js')
          s = p.read_text(encoding='utf-8')

          guard_pattern = r"function installRequestAuthGuard\(\)\{.*?window\.__kudaRequestAuthGuard=true;\}"
          guard_replacement = '''function installRequestAuthGuard(){if(window.__kudaRequestAuthGuard)return;if(typeof window.jsonp!=='function')return;var originalJsonp=window.jsonp;window.jsonp=function(url,timeout){var isMutation=/[?&]action=(?:add|addBatch)(?:&|$)/i.test(String(url||''));if(isMutation){var mode=String(window.KUDAJITUUserLoginMode||'open').toLowerCase();if(mode==='required'){var token=getToken();if(!token)return Promise.reject(new Error('LOGIN_REQUIRED'));if(!/[?&]token=/.test(String(url||'')))url+='&token='+encodeURIComponent(token);}}return originalJsonp(url,timeout);};if(typeof window.canSubmit==='function'){window.canSubmit=function(count){var now=Date.now();if(now-(window.lastSubmit||0)<5000){if(typeof window.toast==='function')window.toast('Tunggu beberapa detik sebelum request lagi.','error');return false;}var nameEl=document.getElementById('name'),name=nameEl?nameEl.value.trim():'';if(!name){if(typeof window.toast==='function')window.toast('Nama wajib diisi.','error');return false;}return true;};}window.__kudaRequestAuthGuard=true;}'''
          s, count = re.subn(guard_pattern, guard_replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate installRequestAuthGuard')

          init_pattern = r"window\.addEventListener\('DOMContentLoaded',function\(\)\{installDataReliabilityGuard\(\);installRequestAuthGuard\(\);addStyle\(\);showLoginButton\(\);validateSession\(\);\}\);"
          init_replacement = "window.addEventListener('DOMContentLoaded',function(){installDataReliabilityGuard();installRequestAuthGuard();addStyle();var mode=String(window.KUDAJITUUserLoginMode||'open').toLowerCase();var hasToken=!!getToken();if(mode==='required'||hasToken){showLoginButton();if(hasToken)validateSession();}else{var loginButton=document.getElementById('loginBtn');if(loginButton)loginButton.remove();}});"
          s, count = re.subn(init_pattern, init_replacement, s, count=1)
          if count != 1:
              raise SystemExit('Could not locate announcement startup handler')

          p.write_text(s, encoding='utf-8')
          print('Patched announcement auth guard and conditional login startup')
          PY

      - name: Commit patch if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- announcement.js; then
            echo 'No changes to commit.'
          else
            git add announcement.js
            git commit -m 'fix: only show user login when required'
            git push
          fi
