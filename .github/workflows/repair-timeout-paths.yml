name: repair-timeout-paths
on:
  push:
    branches: [main]
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair polling and player timeouts
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('const CACHE_KEY=\'kudajitu_user_today_v4\',SYNC_MS=60000;','const CACHE_KEY=\'kudajitu_user_today_v4\';')
          old="""window.addEventListener('online',function(){loadData(false)});window.addEventListener('focus',function(){loadData(false)});document.addEventListener('visibilitychange',function(){if(!document.hidden)loadData(false)});loadCache();loadData(true);setInterval(function(){if(!document.hidden)loadData(false)},SYNC_MS);"""
          new="""loadCache();loadData(true);"""
          if old not in s:
              raise SystemExit('index polling tail not found')
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('performance.js')
          s=p.read_text()
          start=s.find("  if(!window.__kudaQueuePoll){")
          end=s.find("  }\n", start)
          if start!=-1:
              # locate the closing brace for the polling block by balancing braces
              i=start; depth=0; close=None
              while i<len(s):
                  if s[i]=='{': depth+=1
                  elif s[i]=='}':
                      depth-=1
                      if depth==0:
                          close=i+1
                          break
                  i+=1
              if close is None:
                  raise SystemExit('performance polling block end not found')
              s=s[:start]+s[close:]
          s=s.replace("setTimeout(install,1000);","setTimeout(install,1000);")
          p.write_text(s)

          p=Path('player.html')
          s=p.read_text()
          s=s.replace("function jsonp(url,ms=30000)","function jsonp(url,ms=12000)")
          s=s.replace("jsonp(GAS+'?action=youtubemappings&adminToken='+encodeURIComponent(token()),30000)","jsonp(GAS+'?action=youtubemappings&adminToken='+encodeURIComponent(token()),12000)")
          s=s.replace("jsonp(GAS+'?action=data&range=today&status=pending',30000)","jsonp(GAS+'?action=data&range=today&status=pending',12000)")
          s=s.replace("jsonp(GAS+'?action=updateStatus&id='+encodeURIComponent(x.id)+'&status=played&adminToken='+encodeURIComponent(token()),30000)","jsonp(GAS+'?action=updateStatus&id='+encodeURIComponent(x.id)+'&status=played&adminToken='+encodeURIComponent(token()),15000)")
          p.write_text(s)
          PY

          git diff --check
          git diff -- index.html performance.js player.html

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html performance.js player.html
          git diff --cached --quiet && exit 0 || true
          git commit -m "fix duplicate queue polling and player timeout"
          git push origin HEAD:main
          git rm .github/workflows/repair-timeout-paths.yml
          git commit -m "remove temporary timeout repair workflow"
          git push origin HEAD:main
