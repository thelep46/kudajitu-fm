name: Admin Login Fix

on:
  push:
    paths:
      - '.github/workflows/admin-login-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch admin.html for static GitHub Pages
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          text = p.read_text(encoding='utf-8')
          supa = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          bridge = '<script src="/admin-supabase.js?v=20260904-1"></script>'
          if bridge not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('admin.html tidak memiliki </body>')
              text = text.replace(marker, supa + bridge + marker, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched admin.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet || git commit -m 'fix: load Supabase admin login on GitHub Pages'
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/admin-login-fix.yml
          git commit -m 'chore: remove one-time admin login fixer'
          git push
