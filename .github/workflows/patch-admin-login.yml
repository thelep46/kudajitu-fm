name: Patch Admin Login HTML

on:
  push:
    paths:
      - '.github/workflows/patch-admin-login.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin login
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          old='<p class="text-xs text-gray-500 text-center mb-5">Masuk untuk mengelola antrean KUDAJITU FM.</p><input id="password"'
          new='<p class="text-xs text-gray-500 text-center mb-5">Masuk untuk mengelola antrean KUDAJITU FM.</p><input id="adminEmail" type="email" class="field mb-3" placeholder="Email admin" autocomplete="username"><input id="password"'
          if old in s and 'id="adminEmail"' not in s:
              s=s.replace(old,new,1)
          s=s.replace('/admin-login-runtime.js?v=20260904-2','/admin-login-runtime.js?v=20260904-3')
          if '/admin-login-runtime.js?v=20260904-3' not in s:
              s=s.replace('</body>','<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-login-runtime.js?v=20260904-3"></script></body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet || git commit -m 'fix: make Cloudflare admin login self contained'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/patch-admin-login.yml
          git commit -m 'chore: remove temporary admin login patch workflow'
          git push
