name: Apply KUDAJITU UI and request patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch frontend loader and request limit
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          tag = '<script src="./ui-patch.js"></script>'
          if tag not in text:
              marker = '</head>'
              if marker not in text:
                  raise SystemExit('index.html tidak memiliki </head>')
              text = text.replace(marker, tag + marker, 1)
              index.write_text(text, encoding='utf-8')

          code = Path('apps-script/Code.gs')
          code_text = code.read_text(encoding='utf-8')
          old = "var items=raw.slice(0,3).map(function(x){"
          new = "var items=raw.map(function(x){"
          if old in code_text:
              code_text = code_text.replace(old, new, 1)
              code.write_text(code_text, encoding='utf-8')
          else:
              print('Batas batch backend sudah tidak ditemukan; tidak ada perubahan backend.')

      - name: Commit patched files
        shell: bash
        run: |
          if git diff --quiet -- index.html apps-script/Code.gs; then
            echo "Tidak ada perubahan."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html apps-script/Code.gs
          git commit -m "fix: remove request batch limit"
          git push
