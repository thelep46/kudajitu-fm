name: Queue Block Drag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add block selection drag support
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          marker='/* Queue Block Drag v2 */'
          # Remove the previous injected block, whether it was v1 or v2.
          s=re.sub(r'\s*<script>\s*/\* Queue Block Drag v[12] \*/.*?</script>\s*', '\n', s, flags=re.S)
          code=r'''
<script>
/* Queue Block Drag v2 */
(function(){
  const selected=new Set();
  function getRows(){return [...document.querySelectorAll('#list .queue-row[data-id]')];}
  function decorate(){
    getRows().forEach(row=>{
      const id=String(row.dataset.id||'');
      if(!id)return;
      row.draggable=true;
      let box=row.querySelector(':scope > .queue-select, .queue-select');
      if(!box){
        box=document.createElement('input');
        box.type='checkbox';
        box.className='queue-select';
        box.title='Pilih request untuk dipindahkan bersama';
        box.setAttribute('aria-label','Pilih request');
        box.addEventListener('click',e=>{
          e.stopPropagation();
          if(box.checked) selected.add(id); else selected.delete(id);
          sync();
        });
        const handle=row.querySelector('.queue-drag');
        const target=handle?.parentElement || row.firstElementChild || row;
        target.insertBefore(box,target.firstChild);
      }
      box.checked=selected.has(id);
      if(row.dataset.blockReady==='1')return;
      row.dataset.blockReady='1';
      row.addEventListener('dragstart',e=>{
        const ids=selected.size && selected.has(id)?[...selected]:[id];
        e.dataTransfer.effectAllowed='move';
        e.dataTransfer.setData('text/plain',JSON.stringify(ids));
        getRows().forEach(r=>r.classList.toggle('block-drag-source',ids.includes(String(r.dataset.id))));
        row.classList.add('dragging');
      });
      row.addEventListener('dragend',()=>{
        row.classList.remove('dragging');
        getRows().forEach(r=>r.classList.remove('block-drag-source','drop-target'));
      });
      row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('drop-target');e.dataTransfer.dropEffect='move';});
      row.addEventListener('dragleave',()=>row.classList.remove('drop-target'));
      row.addEventListener('drop',async e=>{
        e.preventDefault();
        row.classList.remove('drop-target');
        let ids=[];
        try{ids=JSON.parse(e.dataTransfer.getData('text/plain')||'[]')}catch(_){return;}
        if(!ids.length)return;
        const ordered=typeof pendingRows==='function'?pendingRows().slice():[];
        const moving=ordered.filter(x=>ids.includes(String(x.id)));
        if(!moving.length)return;
        const remaining=ordered.filter(x=>!ids.includes(String(x.id)));
        let at=remaining.findIndex(x=>String(x.id)===id);
        if(at<0)at=remaining.length;
        remaining.splice(at,0,...moving);
        const newIds=remaining.map(x=>String(x.id));
        if(typeof saveQueueOrder==='function' && await saveQueueOrder(newIds)){
          selected.clear();
          await load(false);
        }
      });
    });
    sync();
  }
  function sync(){
    getRows().forEach(row=>{
      const on=selected.has(String(row.dataset.id));
      row.classList.toggle('block-selected',on);
      const cb=row.querySelector('.queue-select');
      if(cb)cb.checked=on;
    });
    let bar=document.getElementById('blockMoveBar');
    if(!bar){
      bar=document.createElement('div');
      bar.id='blockMoveBar';
      bar.className='glass rounded-xl px-3 py-2 mb-3 flex flex-wrap items-center gap-2 text-xs';
      const list=document.getElementById('list');
      if(list&&list.parentNode)list.parentNode.insertBefore(bar,list);
    }
    bar.innerHTML=selected.size?`<b>${selected.size} request dipilih</b><span class="text-gray-500">• Tarik salah satunya untuk memindahkan seluruh blok</span><button class="filter active" type="button" id="clearBlockSelection">Batal pilih</button>`:'';
    const clear=document.getElementById('clearBlockSelection');
    if(clear)clear.onclick=()=>{selected.clear();sync()};
  }
  const st=document.createElement('style');
  st.textContent=`
    .queue-row{user-select:none}
    .queue-row.block-selected{border-color:rgba(45,212,191,.75)!important;background:rgba(13,148,136,.08)}
    .queue-row.block-drag-source{opacity:.6}
    .queue-select{width:18px;height:18px;min-width:18px;margin-right:8px;accent-color:#14b8a6;cursor:pointer;position:relative;z-index:5}
    .queue-row.drop-target{border-color:#2dd4bf!important;box-shadow:0 0 0 1px rgba(45,212,191,.18)}
  `;
  document.head.appendChild(st);
  const oldRender=window.render;
  if(typeof oldRender==='function'){
    window.render=function(){oldRender.apply(this,arguments);setTimeout(decorate,0)};
  }
  const observer=new MutationObserver(()=>decorate());
  const list=document.getElementById('list');
  if(list)observer.observe(list,{childList:true,subtree:true});
  setTimeout(decorate,50);
  setTimeout(decorate,500);
  setTimeout(decorate,1500);
})();
</script>
'''
          s=s.replace('</body>',code+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: show queue block selection checkboxes"
          git push
