name: Repair Admin Syntax

on:
  push:
    paths:
      - '.github/workflows/repair-admin-syntax.yml'
      - 'admin.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair literal escaped newlines in Queue Block script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* Queue Block Drag v1 */'
          if marker not in s:
              print('Queue Block marker not found; nothing to repair.')
              raise SystemExit(0)
          head, tail = s.split(marker, 1)
          # Convert the literal two-character sequence backslash+n to a real newline.
          repaired = tail.replace('\\n', '\n')
          s2 = head + marker + repaired
          if s2 == s:
              print('No escaped-newline corruption found.')
          else:
              p.write_text(s2, encoding='utf-8')
              print('Repaired Queue Block escaped newlines.')
          PY

      - name: Validate admin JavaScript markup
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('admin.html').read_text(encoding='utf-8')
          marker = '/* Queue Block Drag v1 */'
          if marker not in s:
              raise SystemExit('Queue Block marker missing')
          tail = s.split(marker, 1)[1]
          if '\\n' in tail:
              raise SystemExit('Escaped newline corruption remains in Queue Block script')
          print('admin.html validation passed.')
          PY

      - name: Commit repair if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'fix: repair admin queue block script syntax'
            git push
          fi
