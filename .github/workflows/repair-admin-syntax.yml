name: Repair Admin Syntax

on:
  push:
    paths:
      - '.github/workflows/repair-admin-syntax.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair literal escaped newlines
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace('</script>\\n<script>', '</script>\n<script>')
          s = s.replace('})();\\n</script>\\n</body></html>', '})();\n</script>\n</body></html>')
          if s == old:
              print('No escaped-newline corruption found.')
          else:
              p.write_text(s, encoding='utf-8')
              print('Repaired admin.html escaped newlines.')
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'fix: repair admin script markup'
            git push
          fi
