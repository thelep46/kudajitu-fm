name: Repair Admin Syntax

on:
  push:
    paths:
      - '.github/workflows/repair-admin-syntax.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair Queue Block script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* Queue Block Drag v1 */'
          if marker not in s:
              raise SystemExit('Queue Block script marker not found')
          head, tail = s.split(marker, 1)
          tail = tail.replace('\\n', '\n')
          s2 = head + marker + tail
          if s2 == s:
              print('Queue Block script already has real newlines.')
          else:
              p.write_text(s2, encoding='utf-8')
              print('Repaired all literal \\n sequences inside Queue Block script.')
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'fix: repair queue block script syntax'
            git push
          fi
