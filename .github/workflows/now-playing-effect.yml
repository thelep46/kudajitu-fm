name: Add NOW PLAYING visual effect
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'NOW PLAYING visual effect') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix NOW PLAYING sync and visual effect
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          bad = "return (Date.parse(b.playedAt)||Date.parse(b.timestamp)||0)-(Date.parse(a.playedAt)||Date.parse(a.timestamp)||0));"
          good = "return (Date.parse(b.playedAt)||Date.parse(b.timestamp)||0)-(Date.parse(a.playedAt)||Date.parse(a.timestamp)||0);"
          s = s.replace(bad, good)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: NOW PLAYING sync hotfix"
          git push