name: Hotfix Admin Syntax

on:
  push:
    paths:
      - '.github/workflows/hotfix-admin-syntax.yml'
      - 'admin.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair admin.html syntax and loading
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          changed = False

          broken = '</script>\n<script>\\n/* Queue Block Drag v1 */'
          fixed = '</script>\n<script>\n/* Queue Block Drag v1 */'
          if broken in s:
              s = s.replace(broken, fixed, 1)
              changed = True
              print('Repaired Queue Block script delimiter.')

          # Google Apps Script can be slow during cold starts. Give the
          # Admin data request more time and retry it instead of failing
          # after a short 10-second window.
          replacements = {
              "jsonp(adminUrl('data')+'&range='+encodeURIComponent(dateFilter)+'&status=all',10000),2": "jsonp(adminUrl('data')+'&range='+encodeURIComponent(dateFilter)+'&status=all',30000),3",
              "jsonp(adminUrl('userloginmode'),10000)": "jsonp(adminUrl('userloginmode'),20000)",
              "const b=$('refreshBtn')": "const b=$('headerRefreshBtn')",
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
                  changed = True
                  print('Applied Admin loading improvement:', old[:60])

          if changed:
              p.write_text(s, encoding='utf-8')
          else:
              print('No Admin repair changes needed.')
          PY

      - name: Validate admin.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('admin.html').read_text(encoding='utf-8')
          marker = '/* Queue Block Drag v1 */'
          if marker not in s:
              raise SystemExit('Queue Block marker missing')
          if '</script>\n<script>\\n' in s:
              raise SystemExit('Broken script delimiter remains')
          if "jsonp(adminUrl('data')+'&range='+encodeURIComponent(dateFilter)+'&status=all',10000),2" in s:
              raise SystemExit('Short Admin data timeout remains')
          print('admin.html syntax/loading validation OK')
          PY

      - name: Commit repair if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if git diff --cached --quiet; then
            echo 'No admin.html change to commit.'
          else
            git commit -m 'fix: improve admin loading timeout'
            git push
          fi
