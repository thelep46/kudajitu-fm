name: Hotfix Admin Syntax

on:
  push:
    paths:
      - '.github/workflows/hotfix-admin-syntax.yml'
      - 'admin.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair admin.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* Queue Block Drag v1 */'
          if marker not in s:
              raise SystemExit('Queue Block marker not found')
          head, tail = s.split(marker, 1)
          repaired = tail.replace('\\n', '\n')
          out = head + marker + repaired
          if out != s:
              p.write_text(out, encoding='utf-8')
              print('Admin syntax repaired.')
          else:
              print('Admin syntax already clean.')
          PY

      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('admin.html').read_text(encoding='utf-8')
          marker = '/* Queue Block Drag v1 */'
          tail = s.split(marker, 1)[1]
          if '\\n' in tail:
              raise SystemExit('Literal \\n remains after repair')
          print('Validation OK')
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if git diff --cached --quiet; then
            echo 'No admin.html change needed.'
          else
            git commit -m 'fix: remove admin queue syntax corruption'
            git push
          fi
