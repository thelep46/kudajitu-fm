name: Hotfix Admin Syntax

on:
  push:
    paths:
      - '.github/workflows/hotfix-admin-syntax.yml'
      - 'admin.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair admin.html syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')

          # The broken queue patch placed a literal backslash+n between
          # the opening script tag and the Queue Block comment.
          broken = '</script>\n<script>\\n/* Queue Block Drag v1 */'
          fixed = '</script>\n<script>\n/* Queue Block Drag v1 */'

          if broken in s:
              s = s.replace(broken, fixed, 1)
              p.write_text(s, encoding='utf-8')
              print('Repaired admin.html Queue Block script delimiter.')
          else:
              print('Broken delimiter not found; checking for any literal escape.')
          PY

      - name: Validate admin.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('admin.html').read_text(encoding='utf-8')
          marker = '/* Queue Block Drag v1 */'
          if marker not in s:
              raise SystemExit('Queue Block marker missing')
          before, after = s.split(marker, 1)
          if '\\n/* Queue Block Drag v1 */' in before + marker:
              raise SystemExit('Literal backslash+n remains before Queue Block marker')
          if '</script>\n<script>\\n' in s:
              raise SystemExit('Broken script delimiter remains')
          print('admin.html Queue Block syntax validation OK')
          PY

      - name: Commit repair if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if git diff --cached --quiet; then
            echo 'No admin.html change to commit.'
          else
            git commit -m 'fix: repair admin queue script delimiter'
            git push
          fi
