<!doctype html><html lang="id" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUDAJITU FM • User Management</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#061114;color:#f3f4f6;font-family:Arial,sans-serif}.glass{background:#0a181b;border:1px solid rgba(45,212,191,.15)}.btn{padding:.65rem 1rem;border-radius:.7rem;font-size:.75rem;font-weight:800}.field{width:100%;box-sizing:border-box;background:#030a0c;border:1px solid #115e59;border-radius:.75rem;padding:.7rem 1rem;color:white;outline:0}</style></head><body class="min-h-screen"><header class="sticky top-0 z-40 glass px-4 py-3"><div class="max-w-6xl mx-auto flex justify-between items-center gap-3"><div><h1 class="font-extrabold text-xl">KUDAJITU FM <span style="font-size:11px;color:#5eead4">USER MANAGEMENT</span></h1><p style="font-size:11px;color:#94a3b8">Kelola akses member</p></div><a href="admin.html" class="btn" style="background:#030a0c;color:#fff">← Admin</a></div></header><main class="max-w-6xl mx-auto px-4 py-6"><section id="login" class="max-w-md mx-auto mt-10"><div class="glass rounded-2xl p-7"><h2 class="text-xl font-extrabold text-center mb-5">Login Admin</h2><input id="adminPassword" type="password" class="field mb-3" placeholder="Password admin"><button onclick="login()" class="btn w-full" style="background:#0d9488;color:#fff">Masuk</button><p id="loginMsg" style="font-size:12px;color:#f87171;text-align:center"></p></div></section><section id="dashboard" class="hidden space-y-5"><div class="flex flex-wrap justify-between items-center gap-3"><div><h2 class="text-2xl font-extrabold">Daftar User</h2><p style="font-size:11px;color:#64748b">User aktif wajib login sebelum request.</p></div><button onclick="openForm()" class="btn" style="background:#0d9488;color:#fff">+ Tambah User</button></div><div class="glass rounded-2xl p-5"><div id="list" class="space-y-3"></div></div></section></main><div id="modal" class="hidden fixed inset-0 z-50 bg-black/80 items-center justify-center p-4"><div class="glass rounded-2xl p-6 w-full max-w-md"><div class="flex justify-between mb-4"><h3 id="formTitle" class="font-extrabold">Tambah User</h3><button onclick="closeForm()">✕</button></div><input id="uid" type="hidden"><input id="username" class="field mb-3" placeholder="Username"><input id="password" class="field mb-3" placeholder="Password baru (kosong = tetap)"><input id="name" class="field mb-3" placeholder="Nama"><select id="status" class="field mb-4"><option value="aktif">Aktif</option><option value="nonaktif">Nonaktif</option></select><button id="saveBtn" onclick="saveUser()" class="btn w-full" style="background:#0d9488;color:#fff">Simpan</button><p id="formMsg" style="font-size:12px;color:#f87171"></p></div></div><div id="resetModal" class="hidden fixed inset-0 z-50 bg-black/80 items-center justify-center p-4"><div class="glass rounded-2xl p-6 w-full max-w-md"><h3 class="font-extrabold mb-3">Reset Password</h3><p id="resetUser" style="font-size:12px;color:#94a3b8"></p><input id="resetId" type="hidden"><input id="resetPassword" class="field my-4" placeholder="Password sementara"><button onclick="resetPassword()" class="btn w-full" style="background:#0d9488;color:#fff">Reset Password</button><button onclick="closeReset()" class="btn w-full mt-2" style="background:#123033;color:#fff">Batal</button><p id="resetMsg" style="font-size:12px;color:#f87171"></p></div></div><div id="toast" class="fixed right-4 bottom-4 z-50"></div><script>'use strict';const GAS='https://script.google.com/macros/s/AKfycbyUB8drjL1dSJedYjKIKjVc5gzIE3Pe-QS0FF8o1_zU4NkAweGLFquhHLfy1Nt_eITA-Q/exec',ADMIN_KEY='290979';let users=[];const $=id=>document.getElementById(id);function toast(t){let e=document.createElement('div');e.className='glass rounded-xl px-4 py-3 text-xs';e.textContent=t;$('toast').appendChild(e);setTimeout(()=>e.remove(),3000)}function jsonp(url,timeout){return new Promise((resolve,reject)=>{let cb='__u_'+Date.now()+Math.random(),s=document.createElement('script'),t=setTimeout(()=>{s.remove();reject(Error('Timeout'))},timeout||12000);window[cb]=d=>{clearTimeout(t);s.remove();delete window[cb];d&&d.success!==false?resolve(d):reject(Error(d?.message||'Server gagal'))};s.src=url+'&callback='+cb+'&_='+Date.now();s.onerror=()=>{clearTimeout(t);s.remove();reject(Error('Network error'))};document.head.appendChild(s)})}function login(){if($('adminPassword').value!==ADMIN_KEY){$('loginMsg').textContent='Password admin salah.';return}sessionStorage.setItem('kudajitu_users_admin','1');show();load()}function show(){if(sessionStorage.getItem('kudajitu_users_admin')!=='1')return;$('login').classList.add('hidden');$('dashboard').classList.remove('hidden')}function load(){jsonp(GAS+'?action=users&adminKey='+encodeURIComponent(ADMIN_KEY)).then(r=>{users=r.users||[];render()}).catch(e=>toast(e.message))}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function render(){$('list').innerHTML=users.length?users.map(u=>`<div class="glass rounded-xl p-4 flex flex-col sm:flex-row sm:items-center gap-3"><div class="flex-1"><b>${esc(u.name||u.username)}</b> <span style="font-size:10px;color:#5eead4">${esc(u.status)}</span><div style="font-size:12px;color:#94a3b8">@${esc(u.username)} • ${esc(u.id)}</div><div style="font-size:10px;color:#64748b">Login: ${esc(u.lastLogin||'belum pernah')}</div></div><div class="flex gap-2"><button class="btn" style="background:#030a0c;color:#fff" onclick="edit('${encodeURIComponent(u.id)}')">Edit</button><button class="btn" style="background:#123033;color:#5eead4" onclick="resetOpen('${encodeURIComponent(u.id)}')">Reset PW</button><button class="btn" style="background:#3f1111;color:#f87171" onclick="del('${encodeURIComponent(u.id)}')">Hapus</button></div></div>`).join(''):'<div class="text-center text-gray-500 py-10">Belum ada user.</div>'}function openForm(u){$('modal').classList.remove('hidden');$('modal').classList.add('flex');$('formTitle').textContent=u?'Edit User':'Tambah User';$('uid').value=u?.id||'';$('username').value=u?.username||'';$('password').value='';$('name').value=u?.name||'';$('status').value=u?.status||'aktif';$('formMsg').textContent=''}function closeForm(){$('modal').classList.add('hidden');$('modal').classList.remove('flex')}function edit(id){let u=users.find(x=>x.id===decodeURIComponent(id));if(u)openForm(u)}function saveUser(){let id=$('uid').value,u=$('username').value.trim(),p=$('password').value,n=$('name').value.trim(),s=$('status').value;if(!u||!n){$('formMsg').textContent='Username dan nama wajib diisi.';return}if(!id&&!p){$('formMsg').textContent='Password wajib untuk user baru.';return}let q=GAS+'?action=saveuser&adminKey='+encodeURIComponent(ADMIN_KEY)+'&id='+encodeURIComponent(id)+'&username='+encodeURIComponent(u)+'&password='+encodeURIComponent(p)+'&name='+encodeURIComponent(n)+'&status='+encodeURIComponent(s);jsonp(q).then(r=>{toast(r.message);closeForm();load()}).catch(e=>$('formMsg').textContent=e.message)}function resetOpen(id){let u=users.find(x=>x.id===decodeURIComponent(id));if(!u)return;$('resetId').value=u.id;$('resetUser').textContent='User: '+u.username;$('resetPassword').value='';$('resetMsg').textContent='';$('resetModal').classList.remove('hidden');$('resetModal').classList.add('flex')}function closeReset(){$('resetModal').classList.add('hidden');$('resetModal').classList.remove('flex')}function resetPassword(){let p=$('resetPassword').value;if(p.length<6){$('resetMsg').textContent='Minimal 6 karakter.';return}jsonp(GAS+'?action=adminresetpassword&adminKey='+encodeURIComponent(ADMIN_KEY)+'&id='+encodeURIComponent($('resetId').value)+'&newPassword='+encodeURIComponent(p)).then(r=>{toast(r.message);closeReset()}).catch(e=>$('resetMsg').textContent=e.message)}function del(id){id=decodeURIComponent(id);let u=users.find(x=>x.id===id);if(!u||!confirm('Hapus akses '+u.username+'?'))return;jsonp(GAS+'?action=deleteuser&adminKey='+encodeURIComponent(ADMIN_KEY)+'&id='+encodeURIComponent(id)).then(r=>{toast(r.message);load()}).catch(e=>toast(e.message))}window.addEventListener('DOMContentLoaded',()=>{show();if(sessionStorage.getItem('kudajitu_users_admin')==='1')load()});</script></body></html>
