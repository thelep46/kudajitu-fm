<!doctype html><html lang="id" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUDAJITU FM • User Management</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#061114;color:#f3f4f6;font-family:Arial,sans-serif}.glass{background:#0a181b;border:1px solid rgba(45,212,191,.15)}.btn{padding:.65rem 1rem;border-radius:.7rem;font-size:.75rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;transition:.14s}.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(1px) scale(.975)}.btn:disabled{opacity:.55;cursor:wait;transform:none}.field{width:100%;box-sizing:border-box;background:#030a0c;border:1px solid #115e59;border-radius:.75rem;padding:.7rem 1rem;color:white;outline:0}.field:focus{border-color:#2dd4bf;box-shadow:0 0 0 2px rgba(45,212,191,.08)}.row{transition:.18s}.row:hover{transform:translateY(-1px);border-color:rgba(45,212,191,.35)}.badge{font-size:9px;font-weight:900;padding:4px 7px;border-radius:999px;border:1px solid}.badge.pending{color:#fbbf24;background:#2a1d05;border-color:#854d0e}.badge.approved{color:#5eead4;background:#042f2e;border-color:#115e59}.badge.rejected{color:#fca5a5;background:#2a0b0b;border-color:#7f1d1d}.badge.off{color:#cbd5e1;background:#111827;border-color:#334155}.modal{animation:modalIn .18s ease both}@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.btn,.row{transition:none}.modal{animation:none}}</style></head><body class="min-h-screen"><header class="sticky top-0 z-40 glass px-4 py-3"><div class="max-w-6xl mx-auto flex justify-between items-center gap-3"><div><h1 class="font-extrabold text-xl">KUDAJITU FM <span style="font-size:11px;color:#5eead4">USER MANAGEMENT</span></h1><p style="font-size:11px;color:#94a3b8">Kelola akun member • persetujuan, username & password</p></div><a href="admin.html" class="btn" style="background:#030a0c;color:#fff">← Admin</a></div></header><main class="max-w-6xl mx-auto px-4 py-6"><section id="login" class="max-w-md mx-auto mt-10"><div class="glass rounded-2xl p-7"><h2 class="text-xl font-extrabold text-center mb-5">Login Admin</h2><input id="adminEmail" type="email" class="field mb-3" placeholder="Email admin" autocomplete="username"><input id="adminPassword" type="password" class="field mb-3" placeholder="Password admin" autocomplete="current-password"><button id="loginBtn" onclick="login()" class="btn w-full" style="background:#0d9488;color:#fff">Masuk</button><p id="loginMsg" style="font-size:12px;color:#f87171;text-align:center"></p></div></section><section id="dashboard" class="hidden space-y-5"><div class="flex flex-wrap justify-between items-center gap-3"><div><h2 class="text-2xl font-extrabold">Daftar User</h2><p style="font-size:11px;color:#64748b">User dari pendaftaran situs harus disetujui Admin sebelum bisa login.</p></div><div class="flex gap-2"><button id="addBtn" onclick="openForm()" class="btn" style="background:#0d9488;color:#fff">+ Tambah User</button></div></div><div class="grid grid-cols-2 md:grid-cols-4 gap-2"><div class="glass rounded-xl p-3"><div style="font-size:9px;color:#64748b;text-transform:uppercase">Menunggu</div><b id="pendingCount" style="font-size:20px;color:#fbbf24">0</b></div><div class="glass rounded-xl p-3"><div style="font-size:9px;color:#64748b;text-transform:uppercase">Disetujui</div><b id="approvedCount" style="font-size:20px;color:#5eead4">0</b></div><div class="glass rounded-xl p-3"><div style="font-size:9px;color:#64748b;text-transform:uppercase">Ditolak</div><b id="rejectedCount" style="font-size:20px;color:#fca5a5">0</b></div><div class="glass rounded-xl p-3"><div style="font-size:9px;color:#64748b;text-transform:uppercase">Total</div><b id="totalCount" style="font-size:20px;color:#67e8f9">0</b></div></div><div class="glass rounded-2xl p-5"><div class="flex flex-col sm:flex-row gap-2 mb-4"><input id="search" oninput="render()" class="field" placeholder="Cari username atau nama..."><button onclick="load()" class="btn bg-gray-950 border border-teal-800 text-white">↻ Refresh</button></div><div id="list" class="space-y-3"></div></div></section></main><div id="modal" class="hidden fixed inset-0 z-50 bg-black/80 items-center justify-center p-4"><div class="glass rounded-2xl p-6 w-full max-w-md modal"><div class="flex justify-between mb-4"><h3 id="formTitle" class="font-extrabold">Tambah User</h3><button onclick="closeForm()" class="btn">✕</button></div><input id="uid" type="hidden"><input id="username" class="field mb-3" placeholder="Username" maxlength="40"><input id="password" type="password" class="field mb-3" placeholder="Password baru (kosong = tetap)" maxlength="72"><input id="name" class="field mb-3" placeholder="Nama" maxlength="50"><select id="status" class="field mb-4"><option value="aktif">Aktif</option><option value="nonaktif">Nonaktif</option></select><button id="saveBtn" onclick="saveUser()" class="btn w-full" style="background:#0d9488;color:#fff">Simpan</button><p id="formMsg" style="font-size:12px;color:#f87171"></p></div></div><div id="resetModal" class="hidden fixed inset-0 z-50 bg-black/80 items-center justify-center p-4"><div class="glass rounded-2xl p-6 w-full max-w-md modal"><h3 class="font-extrabold mb-3">Reset Password</h3><p id="resetUser" style="font-size:12px;color:#94a3b8"></p><input id="resetId" type="hidden"><input id="resetPassword" type="password" class="field my-4" placeholder="Password baru" maxlength="72"><button id="resetBtn" onclick="resetPassword()" class="btn w-full" style="background:#0d9488;color:#fff">Reset Password</button><button onclick="closeReset()" class="btn w-full mt-2" style="background:#123033;color:#fff">Batal</button><p id="resetMsg" style="font-size:12px;color:#f87171"></p></div></div><div id="toast" class="fixed right-4 bottom-4 z-50 space-y-2"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'use strict';const SUPABASE_URL='https://jdqcvfqysmjreibcaduk.supabase.co',SUPABASE_KEY='sb_publishable_QDcyGfH-3dBNmUYE9pKIkg_uFmRsmOa',FN=SUPABASE_URL+'/functions/v1/kudajitu-user-admin';let client=null,users=[],saving=false;const $=id=>document.getElementById(id);function getClient(){if(!client)client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);return client}function toast(t,error=false){const e=document.createElement('div');e.className='glass rounded-xl px-4 py-3 text-xs shadow-xl '+(error?'text-red-300 border border-red-800':'text-teal-200 border border-teal-800');e.textContent=t;$('toast').appendChild(e);setTimeout(()=>e.remove(),3200)}function setBusy(b,on,label){if(!b)return;if(on){b.disabled=true;b.dataset.old=b.innerHTML;b.innerHTML=label}else{b.disabled=false;b.innerHTML=b.dataset.old||b.innerHTML}}async function session(){const {data}=await getClient().auth.getSession();return data?.session||null}async function adminCall(action,payload={}){const s=await session();if(!s)throw Error('LOGIN_REQUIRED');const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token},body:JSON.stringify({action,...payload}),cache:'no-store'});const d=await r.json().catch(()=>null);if(!r.ok||!d?.success)throw Error(d?.message||'Server gagal.');return d}async function login(){const email=$('adminEmail').value.trim(),password=$('adminPassword').value,b=$('loginBtn');if(!email||!password){$('loginMsg').textContent='Email dan password wajib diisi.';return}setBusy(b,true,'Memeriksa...');try{const {data,error}=await getClient().auth.signInWithPassword({email,password});if(error)throw error;if(data.user?.app_metadata?.role!=='admin'){await getClient().auth.signOut();throw Error('Akun bukan Admin.')}sessionStorage.setItem('kudajitu_admin_supabase','1');$('adminPassword').value='';$('loginMsg').textContent='';show();await load()}catch(e){$('loginMsg').textContent=e.message||'Login gagal.'}finally{setBusy(b,false)}}async function boot(){const s=await session();if(s&&s.user?.app_metadata?.role==='admin'){show();await load()}else{$('login').classList.remove('hidden');$('dashboard').classList.add('hidden')}}function show(){$('login').classList.add('hidden');$('dashboard').classList.remove('hidden')}async function load(){try{const r=await adminCall('users');users=r.users||[];render()}catch(e){if(e.message==='LOGIN_REQUIRED'){location.href='admin.html';return}toast('Gagal memuat user: '+e.message,true)}}async function setApproval(u,status){if(!u?.id)return;const labels={approved:'menyetujui',rejected:'menolak',pending:'mengembalikan ke pending'};if(!confirm('Yakin '+labels[status]+' akun @'+u.username+'?'))return;try{const r=await adminCall('setapproval',{id:u.id,approvalStatus:status});toast(r.message||'Status diperbarui.');await load()}catch(e){toast('Gagal mengubah persetujuan: '+e.message,true)}}async function logout(){await getClient().auth.signOut();sessionStorage.removeItem('kudajitu_admin_supabase');location.href='admin.html'}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function statusBadge(u){const a=u.approvalStatus||'approved';if(a==='pending')return '<span class="badge pending">MENUNGGU PERSETUJUAN</span>';if(a==='rejected')return '<span class="badge rejected">DITOLAK</span>';return u.status==='aktif'?'<span class="badge approved">DISETUJUI • AKTIF</span>':'<span class="badge off">DISETUJUI • NONAKTIF</span>'}function render(){const q=$('search').value.toLowerCase().trim(),rows=users.filter(u=>!q||[u.username,u.name].join(' ').toLowerCase().includes(q));const pending=users.filter(u=>u.approvalStatus==='pending').length,approved=users.filter(u=>u.approvalStatus==='approved').length,rejected=users.filter(u=>u.approvalStatus==='rejected').length;$('pendingCount').textContent=pending;$('approvedCount').textContent=approved;$('rejectedCount').textContent=rejected;$('totalCount').textContent=users.length;$('list').innerHTML=rows.length?rows.map(u=>`<div class="row glass rounded-xl p-4 flex flex-col gap-3"><div class="flex flex-col sm:flex-row sm:items-center gap-3"><div class="flex-1 min-w-0"><div class="flex flex-wrap items-center gap-2"><b>${esc(u.name||u.username)}</b>${statusBadge(u)}</div><div class="text-xs text-gray-400">@${esc(u.username)}</div><div class="text-[10px] text-gray-600 mt-1">Login terakhir: ${esc(u.lastLogin||'belum pernah')}</div></div><div class="flex flex-wrap gap-2">${u.approvalStatus==='pending'?`<button class="btn bg-teal-950 border border-teal-800 text-teal-200" onclick='setApproval(${JSON.stringify(u).replace(/</g,'\\u003c')},"approved")'>✅ ACC</button><button class="btn bg-red-950 border border-red-800 text-red-300" onclick='setApproval(${JSON.stringify(u).replace(/</g,'\\u003c')},"rejected")'>❌ Tolak</button>`:u.approvalStatus==='rejected'?`<button class="btn bg-teal-950 border border-teal-800 text-teal-200" onclick='setApproval(${JSON.stringify(u).replace(/</g,'\\u003c')},"approved")'>✅ Setujui Lagi</button>`:`<button class="btn bg-gray-950 border border-teal-800 text-white" onclick='edit(${JSON.stringify(u).replace(/</g,'\\u003c')})'>✏️ Edit</button>`}<button class="btn bg-teal-950 border border-teal-800 text-teal-200" onclick='resetOpen(${JSON.stringify(u).replace(/</g,'\\u003c')})'>🔑 Reset PW</button><button class="btn bg-red-950 border border-red-800 text-red-300" onclick='del(${JSON.stringify(u).replace(/</g,'\\u003c')})'>🗑️ Hapus</button></div></div>${u.approvalStatus==='pending'?'<div style="font-size:10px;color:#fbbf24;border-top:1px solid #3f2f08;padding-top:8px">Akun sudah dibuat di sistem, tetapi belum dapat digunakan sampai Admin menyetujui.</div>':''}${u.approvalStatus==='rejected'?'<div style="font-size:10px;color:#fca5a5;border-top:1px solid #3f1111;padding-top:8px">Akun ditolak tetapi tetap tersimpan dan dapat disetujui kembali.</div>':''}</div>`).join(''):'<div class="text-center text-gray-500 py-10">Belum ada user.</div>'}function openForm(u){$('modal').classList.remove('hidden');$('modal').classList.add('flex');$('formTitle').textContent=u?'Edit User':'Tambah User';$('uid').value=u?.id||'';$('username').value=u?.username||'';$('password').value='';$('name').value=u?.name||'';$('status').value=u?.status||'aktif';$('formMsg').textContent=''}function closeForm(){$('modal').classList.add('hidden');$('modal').classList.remove('flex')}function edit(u){openForm(u)}async function saveUser(){if(saving)return;const username=$('username').value.trim(),password=$('password').value,name=$('name').value.trim(),status=$('status').value,id=$('uid').value;if(!username||!name){$('formMsg').textContent='Username dan nama wajib diisi.';return}if(!id&&!password){$('formMsg').textContent='Password wajib untuk user baru.';return}saving=true;const b=$('saveBtn');setBusy(b,true,'Menyimpan...');try{const r=await adminCall('saveuser',{id,username,password,name,status});toast(r.message||'User berhasil disimpan.');closeForm();await load()}catch(e){$('formMsg').textContent=e.message||'Gagal menyimpan.';toast('Gagal menyimpan user.',true)}finally{saving=false;setBusy(b,false)}}function resetOpen(u){$('resetId').value=u.id;$('resetUser').textContent='User: '+u.username;$('resetPassword').value='';$('resetMsg').textContent='';$('resetModal').classList.remove('hidden');$('resetModal').classList.add('flex')}function closeReset(){$('resetModal').classList.add('hidden');$('resetModal').classList.remove('flex')}async function resetPassword(){const p=$('resetPassword').value,b=$('resetBtn');if(p.length<6){$('resetMsg').textContent='Minimal 6 karakter.';return}setBusy(b,true,'Mereset...');try{const r=await adminCall('adminresetpassword',{id:$('resetId').value,newPassword:p});toast(r.message||'Password berhasil direset.');closeReset()}catch(e){$('resetMsg').textContent=e.message;toast('Reset password gagal.',true)}finally{setBusy(b,false)}}async function del(u){if(!confirm('Hapus akses '+u.username+'?'))return;try{const r=await adminCall('deleteuser',{id:u.id});toast(r.message||'User berhasil dihapus.');await load()}catch(e){toast('Gagal menghapus user: '+e.message,true)}}boot();</script></body></html>
