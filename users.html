<!doctype html><html lang="id" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUDAJITU FM • User Management</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#061114;color:#f3f4f6}.glass{background:rgba(10,24,27,.9);backdrop-filter:blur(14px);border:1px solid rgba(45,212,191,.15)}.btn{padding:.65rem 1rem;border-radius:.7rem;font-size:.75rem;font-weight:800}.field{width:100%;background:#030a0c;border:1px solid #115e59;border-radius:.75rem;padding:.7rem 1rem;color:white;outline:0}.spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body class="min-h-screen"><header class="sticky top-0 z-40 glass border-b border-teal-900/50 px-4 lg:px-8 py-3"><div class="max-w-6xl mx-auto flex justify-between items-center gap-3"><div><h1 class="font-extrabold text-xl">KUDAJITU FM <span class="text-xs text-teal-300">USER MANAGEMENT</span></h1><p class="text-xs text-gray-400">Kelola akses member KUDAJITU FM</p></div><div class="flex gap-2"><a href="admin.html" class="btn bg-gray-950 border border-teal-800">← Admin</a><a href="./" class="btn bg-gray-950 border border-teal-800">User</a></div></div></header><main class="max-w-6xl mx-auto px-4 lg:px-8 py-6"><section id="login" class="max-w-md mx-auto mt-10"><div class="glass rounded-2xl p-7"><h2 class="text-xl font-extrabold text-center mb-5">Login Admin</h2><input id="adminPassword" type="password" class="field mb-3" placeholder="Password admin"><button id="adminLoginBtn" onclick="login()" class="btn w-full bg-teal-600">Masuk</button><p id="loginMsg" class="text-xs text-red-400 mt-3 text-center"></p></div></section><section id="dashboard" class="hidden space-y-5"><div class="flex flex-wrap justify-between items-center gap-3"><div><h2 class="text-2xl font-extrabold">Daftar User</h2><p class="text-xs text-gray-500">User aktif wajib login sebelum dapat mengirim request.</p></div><button onclick="openForm()" class="btn bg-teal-600">+ Tambah User</button></div><div class="glass rounded-2xl p-5"><div id="list" class="space-y-3"></div></div></section></main><div id="modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm items-center justify-center p-4"><div class="glass rounded-2xl p-6 w-full max-w-md"><div class="flex justify-between items-center mb-4"><h3 id="formTitle" class="font-extrabold text-lg">Tambah User</h3><button onclick="closeForm()">✕</button></div><input id="uid" type="hidden"><label class="block text-xs font-bold mb-1">Username</label><input id="username" class="field mb-3" placeholder="contoh: budi"><label class="block text-xs font-bold mb-1">Password</label><input id="password" class="field mb-3" placeholder="Password user"><label class="block text-xs font-bold mb-1">Nama</label><input id="name" class="field mb-3" placeholder="Nama yang tampil di request"><label class="block text-xs font-bold mb-1">Status</label><select id="status" class="field mb-4"><option value="aktif">Aktif</option><option value="nonaktif">Nonaktif</option></select><button id="saveBtn" onclick="saveUser()" class="btn w-full bg-teal-600">Simpan</button><p id="formMsg" class="text-xs text-red-400 mt-3"></p></div></div><div id="toast" class="fixed right-4 bottom-4 z-50"></div><script>'use strict';const GAS='https://script.google.com/macros/s/AKfycbyUB8drjL1dSJedYjKIKjVc5gzIE3Pe-QS0FF8o1_zU4NkAweGLFquhHLfy1Nt_eITA-Q/exec',ADMIN_KEY='290979';let users=[];const $=id=>document.getElementById(id);function toast(t,error){let e=document.createElement('div');e.className='glass rounded-xl px-4 py-3 text-xs border '+(error?'border-red-700':'border-teal-800');e.textContent=t;$('toast').appendChild(e);setTimeout(()=>e.remove(),3000)}function jsonp(url,timeout){return new Promise((resolve,reject)=>{let cb='__users_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script'),done=false,t=setTimeout(()=>{finish();reject(Error('Timeout'))},timeout||12000);function finish(){if(done)return;done=true;clearTimeout(t);s.remove();try{delete window[cb]}catch(e){}}window[cb]=d=>{finish();d&&d.success!==false?resolve(d):reject(Error(d?.message||'Server gagal'))};s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&_='+Date.now();s.onerror=()=>{finish();reject(Error('Network error'))};document.head.appendChild(s)})}function login(){if($('adminPassword').value!==ADMIN_KEY){$('loginMsg').textContent='Password admin salah.';return}sessionStorage.setItem('kudajitu_users_admin','1');show();load()}function show(){if(sessionStorage.getItem('kudajitu_users_admin')!=='1')return;$('login').classList.add('hidden');$('dashboard').classList.remove('hidden')}function load(){jsonp(GAS+'?action=users&adminKey='+encodeURIComponent(ADMIN_KEY),12000).then(r=>{users=r.users||[];render()}).catch(e=>toast(e.message,true))}function render(){if(!users.length){$('list').innerHTML='<div class="text-center text-gray-500 py-10">Belum ada user. Tambahkan user pertama.</div>';return}$('list').innerHTML=users.map(u=>`<div class="glass rounded-xl p-4 flex flex-col sm:flex-row sm:items-center gap-3"><div class="flex-1"><div class="flex items-center gap-2"><b>${esc(u.name||u.username)}</b><span class="text-[10px] px-2 py-1 rounded-full ${u.status==='aktif'?'bg-teal-500/10 text-teal-300':'bg-red-500/10 text-red-300'}">${esc(u.status)}</span></div><div class="text-xs text-gray-400">@${esc(u.username)} • ID ${esc(u.id)}</div><div class="text-[10px] text-gray-500">Login terakhir: ${esc(u.lastLogin||'belum pernah')}</div></div><div class="flex gap-2"><button class="btn bg-gray-950 border border-teal-800" onclick="edit('${encodeURIComponent(u.id)}')">Edit</button><button class="btn bg-red-950 border border-red-800" onclick="del('${encodeURIComponent(u.id)}')">Hapus</button></div></div>`).join('')}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function openForm(u){$('modal').classList.remove('hidden');$('modal').classList.add('flex');$('formTitle').textContent=u?'Edit User':'Tambah User';$('uid').value=u?.id||'';$('username').value=u?.username||'';$('password').value='';$('name').value=u?.name||'';$('status').value=u?.status||'aktif';$('formMsg').textContent=''}function closeForm(){$('modal').classList.add('hidden');$('modal').classList.remove('flex')}function edit(id){let u=users.find(x=>x.id===decodeURIComponent(id));if(u)openForm(u)}function saveUser(){let id=$('uid').value,u=$('username').value.trim(),p=$('password').value,n=$('name').value.trim(),s=$('status').value;if(!u||!n){$('formMsg').textContent='Username dan nama wajib diisi.';return}if(!id&&!p){$('formMsg').textContent='Password wajib diisi untuk user baru.';return}let q='?action=saveuser&adminKey='+encodeURIComponent(ADMIN_KEY)+'&id='+encodeURIComponent(id)+'&username='+encodeURIComponent(u)+'&password='+encodeURIComponent(p)+'&name='+encodeURIComponent(n)+'&status='+encodeURIComponent(s);$('saveBtn').disabled=true;jsonp(GAS+q,12000).then(r=>{toast(r.message||'Tersimpan');closeForm();load()}).catch(e=>{$('formMsg').textContent=e.message}).finally(()=>$('saveBtn').disabled=false)}function del(id){id=decodeURIComponent(id);let u=users.find(x=>x.id===id);if(!u||!confirm('Hapus akses '+u.username+'?'))return;jsonp(GAS+'?action=deleteuser&adminKey='+encodeURIComponent(ADMIN_KEY)+'&id='+encodeURIComponent(id),12000).then(r=>{toast(r.message||'Dihapus');load()}).catch(e=>toast(e.message,true))}window.addEventListener('DOMContentLoaded',()=>{show();if(sessionStorage.getItem('kudajitu_users_admin')==='1')load()});</script></body></html>
