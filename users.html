<!doctype html><html lang="id" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUDAJITU FM • User Management</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#061114;color:#f3f4f6;font-family:Arial,sans-serif}.glass{background:#0a181b;border:1px solid rgba(45,212,191,.15)}.btn{padding:.65rem 1rem;border-radius:.7rem;font-size:.75rem;font-weight:800}.field{width:100%;box-sizing:border-box;background:#030a0c;border:1px solid #115e59;border-radius:.75rem;padding:.7rem 1rem;color:white;outline:0}.busy{opacity:.7;pointer-events:none}</style></head><body class="min-h-screen"><header class="sticky top-0 z-40 glass px-4 py-3"><div class="max-w-6xl mx-auto flex justify-between items-center gap-3"><div><h1 class="font-extrabold text-xl">KUDAJITU FM <span style="font-size:11px;color:#5eead4">USER MANAGEMENT</span></h1><p style="font-size:11px;color:#94a3b8">Kelola akses member</p></div><a href="admin.html" class="btn" style="background:#030a0c;color:#fff">← Admin</a></div></header><main class="max-w-6xl mx-auto px-4 py-6"><section id="login" class="max-w-md mx-auto mt-10"><div class="glass rounded-2xl p-7"><h2 class="text-xl font-extrabold text-center mb-5">Login Admin</h2><input id="adminPassword" type="password" class="field mb-3" placeholder="Password admin" onkeydown="if(event.key==='Enter')login()"><button id="loginBtn" onclick="login()" class="btn w-full" style="background:#0d9488;color:#fff">Masuk</button><p id="loginMsg" style="font-size:12px;color:#f87171;text-align:center"></p></div></section><section id="dashboard" class="hidden space-y-5"><div class="flex flex-wrap justify-between items-center gap-3"><div><h2 class="text-2xl font-extrabold">Daftar User</h2><p style="font-size:11px;color:#64748b">User aktif wajib login sebelum request.</p></div><button id="addBtn" onclick="openForm()" class="btn" style="background:#0d9488;color:#fff">+ Tambah User</button></div><div class="glass rounded-2xl p-5"><div id="list" class="space-y-3"></div></div></section></main><div id="modal" class="hidden fixed inset-0 z-50 bg-black/80 items-center justify-center p-4"><div class="glass rounded-2xl p-6 w-full max-w-md"><div class="flex justify-between mb-4"><h3 id="formTitle" class="font-extrabold">Tambah User</h3><button onclick="closeForm()">✕</button></div><input id="uid" type="hidden"><input id="username" class="field mb-3" placeholder="Username"><input id="password" type="password" class="field mb-3" placeholder="Password baru (kosong = tetap)"><input id="name" class="field mb-3" placeholder="Nama"><select id="status" class="field mb-4"><option value="aktif">Aktif</option><option value="nonaktif">Nonaktif</option></select><button id="saveBtn" onclick="saveUser()" class="btn w-full" style="background:#0d9488;color:#fff">Simpan</button><p id="formMsg" style="font-size:12px;color:#f87171"></p></div></div><div id="resetModal" class="hidden fixed inset-0 z-50 bg-black/80 items-center justify-center p-4"><div class="glass rounded-2xl p-6 w-full max-w-md"><h3 class="font-extrabold mb-3">Reset Password</h3><p id="resetUser" style="font-size:12px;color:#94a3b8"></p><input id="resetId" type="hidden"><input id="resetPassword" type="password" class="field my-4" placeholder="Password sementara"><button id="resetBtn" onclick="resetPassword()" class="btn w-full" style="background:#0d9488;color:#fff">Reset Password</button><button onclick="closeReset()" class="btn w-full mt-2" style="background:#123033;color:#fff">Batal</button><p id="resetMsg" style="font-size:12px;color:#f87171"></p></div></div><div id="toast" class="fixed right-4 bottom-4 z-50"></div><script>'use strict';const GAS='/api/gas',ADMIN_TOKEN_KEY='kudajitu_admin_token';let users=[],saving=false;const $=id=>document.getElementById(id);function toast(t,error){let e=document.createElement('div');e.className='glass rounded-xl px-4 py-3 text-xs '+(error?'text-red-300':'text-teal-200');e.textContent=t;$('toast').appendChild(e);setTimeout(()=>e.remove(),3500)}function jsonp(url,timeout){return new Promise((resolve,reject)=>{let cb='__u_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script'),done=false,t=setTimeout(()=>{if(done)return;done=true;s.remove();try{delete window[cb]}catch(e){}reject(Error('Timeout'))},timeout||30000);window[cb]=d=>{if(done)return;done=true;clearTimeout(t);s.remove();try{delete window[cb]}catch(e){}d&&d.success!==false?resolve(d):reject(Error(d?.message||'Server gagal'))};s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&_='+Date.now();s.onerror=()=>{if(done)return;done=true;clearTimeout(t);s.remove();try{delete window[cb]}catch(e){}reject(Error('Network error'))};document.head.appendChild(s)})}async function request(url,tries){let last;for(let i=0;i<(tries||3);i++){try{return await jsonp(url,30000)}catch(e){last=e;if(i<(tries||3)-1)await new Promise(r=>setTimeout(r,800*(i+1)))}}throw last}function token(){return sessionStorage.getItem(ADMIN_TOKEN_KEY)||''}function adminUrl(action,params){const q=new URLSearchParams(Object.assign({},params||{},{adminToken:token()}));return GAS+'?action='+encodeURIComponent(action)+'&'+q.toString()}async function login(){const pw=$('adminPassword').value.trim();if(!pw){$('loginMsg').textContent='Password admin wajib diisi.';return}const b=$('loginBtn');setBusy(b,true,'Memeriksa...');try{const r=await request(GAS+'?action=adminlogin&password='+encodeURIComponent(pw),2);if(!r.success)throw Error(r.message||'Login gagal.');sessionStorage.setItem(ADMIN_TOKEN_KEY,r.token);$('adminPassword').value='';$('loginMsg').textContent='';show();await load()}catch(e){$('loginMsg').textContent=e.message;sessionStorage.removeItem(ADMIN_TOKEN_KEY)}finally{setBusy(b,false)}}async function verifySession(){const t=token();if(!t)return false;try{const r=await request(GAS+'?action=adminsession&token='+encodeURIComponent(t),1);return r.success===true}catch(e){return false}}function show(){$('login').classList.add('hidden');$('dashboard').classList.remove('hidden')}function requireLogin(){if(token())return true;$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');return false}async function boot(){if(!token()){requireLogin();return}if(await verifySession()){show();await load()}else{sessionStorage.removeItem(ADMIN_TOKEN_KEY);requireLogin()}}async function logout(){const t=token();try{if(t)await request(GAS+'?action=adminlogout&token='+encodeURIComponent(t),1)}catch(e){}sessionStorage.removeItem(ADMIN_TOKEN_KEY);location.href='admin.html'}async function load(){if(!token()){requireLogin();return}try{let r=await request(adminUrl('users'),2);users=r.users||[];render()}catch(e){if(e.message==='LOGIN_REQUIRED'){sessionStorage.removeItem(ADMIN_TOKEN_KEY);requireLogin();return}toast('Gagal memuat user: '+e.message,true)}}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function render(){$('list').innerHTML=users.length?users.map(u=>`<div class="glass rounded-xl p-4 flex flex-col sm:flex-row sm:items-center gap-3"><div class="flex-1"><b>${esc(u.name||u.username)}</b> <span style="font-size:10px;color:#5eead4">${esc(u.status)}</span><div style="font-size:12px;color:#94a3b8">@${esc(u.username)} • ${esc(u.id)}</div><div style="font-size:10px;color:#64748b">Login: ${esc(u.lastLogin||'belum pernah')}</div></div><div class="flex gap-2"><button class="btn" style="background:#030a0c;color:#fff" onclick="edit('${encodeURIComponent(u.id)}')">Edit</button><button class="btn" style="background:#123033;color:#5eead4" onclick="resetOpen('${encodeURIComponent(u.id)}')">Reset PW</button><button class="btn" style="background:#3f1111;color:#f87171" onclick="del('${encodeURIComponent(u.id)}')">Hapus</button></div></div>`).join(''):'<div class="text-center text-gray-500 py-10">Belum ada user.</div>'}function openForm(u){$('modal').classList.remove('hidden');$('modal').classList.add('flex');$('formTitle').textContent=u?'Edit User':'Tambah User';$('uid').value=u?.id||'';$('username').value=u?.username||'';$('password').value='';$('name').value=u?.name||'';$('status').value=u?.status||'aktif';$('formMsg').textContent=''}function closeForm(){$('modal').classList.add('hidden');$('modal').classList.remove('flex')}function edit(id){let u=users.find(x=>x.id===decodeURIComponent(id));if(u)openForm(u)}async function saveUser(){if(saving)return;if(!token()){requireLogin();return}let id=$('uid').value,u=$('username').value.trim(),p=$('password').value,n=$('name').value.trim(),s=$('status').value;if(!u||!n){$('formMsg').textContent='Username dan nama wajib diisi.';return}if(!id&&!p){$('formMsg').textContent='Password wajib untuk user baru.';return}saving=true;let b=$('saveBtn');setBusy(b,true,'Menyimpan...');$('formMsg').textContent='';try{let r=await request(adminUrl('saveuser',{id:id,username:u,password:p,name:n,status:s}),2);toast(r.message||'User berhasil disimpan.');closeForm();await load()}catch(e){if(e.message==='LOGIN_REQUIRED'){sessionStorage.removeItem(ADMIN_TOKEN_KEY);requireLogin()}else{$('formMsg').textContent=e.message==='Timeout'?'Server lambat merespons. Silakan coba Simpan sekali lagi.':e.message;toast('Gagal menyimpan: '+e.message,true)}}finally{saving=false;setBusy(b,false)}}function resetOpen(id){let u=users.find(x=>x.id===decodeURIComponent(id));if(!u)return;$('resetId').value=u.id;$('resetUser').textContent='User: '+u.username;$('resetPassword').value='';$('resetMsg').textContent='';$('resetModal').classList.remove('hidden');$('resetModal').classList.add('flex')}function closeReset(){$('resetModal').classList.add('hidden');$('resetModal').classList.remove('flex')}async function resetPassword(){if(!token()){requireLogin();return}let p=$('resetPassword').value;if(p.length<6){$('resetMsg').textContent='Minimal 6 karakter.';return}let b=$('resetBtn');setBusy(b,true,'Mereset...');try{let r=await request(adminUrl('adminresetpassword',{id:$('resetId').value,newPassword:p}),2);toast(r.message);closeReset()}catch(e){if(e.message==='LOGIN_REQUIRED'){sessionStorage.removeItem(ADMIN_TOKEN_KEY);requireLogin()}else{$('resetMsg').textContent=e.message;toast('Reset gagal: '+e.message,true)}}finally{setBusy(b,false)}}async function del(id){id=decodeURIComponent(id);let u=users.find(x=>x.id===id);if(!u||!confirm('Hapus akses '+u.username+'?'))return;if(!token()){requireLogin();return}try{let r=await request(adminUrl('deleteuser',{id:id}),2);toast(r.message);await load()}catch(e){if(e.message==='LOGIN_REQUIRED'){sessionStorage.removeItem(ADMIN_TOKEN_KEY);requireLogin()}else toast(e.message,true)}}function setBusy(btn,on,label){if(!btn)return;if(on){btn.classList.add('busy');btn.dataset.old=btn.innerHTML;btn.innerHTML=label}else{btn.classList.remove('busy');btn.innerHTML=btn.dataset.old||btn.innerHTML}}window.addEventListener('DOMContentLoaded',boot);</script></body></html>
