<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kudajitu Auto Player</title><style>body{margin:0;background:#090b10;color:#f4f7fb;font-family:system-ui,sans-serif}main{max-width:720px;margin:auto;padding:14px}.card{background:#121620;border:1px solid #273044;border-radius:16px;padding:14px;margin:10px 0}button{min-height:46px;border:1px solid #273044;border-radius:12px;background:#1a2130;color:#fff;font-weight:700;padding:10px;cursor:pointer}button.primary{background:#ef4444;border-color:#ef4444}button.green{background:#0f9f8f;border-color:#0f9f8f}.controls{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}input{box-sizing:border-box;width:100%;padding:11px;border-radius:10px;background:#0c111a;color:#fff;border:1px solid #273044}.row{display:flex;gap:8px}.row input{flex:1}.small{font-size:12px;color:#9aa5b5}.error{color:#fca5a5}.ok{color:#86efac}.hint{font-size:12px;color:#cbd5e1;line-height:1.45}#player{margin-top:10px;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}#player iframe{width:100%!important;height:100%!important}.item{padding:9px;border:1px solid #273044;border-radius:10px;margin-top:7px}.searchbox{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:9px}@media(max-width:380px){main{padding:9px}.card{padding:11px}.controls{grid-template-columns:1fr 1fr 1fr}.controls button{font-size:11px;padding:8px}.searchbox{grid-template-columns:1fr}}</style></head><body><main><div class="card"><b>🎧 Kudajitu Auto Player</b><div class="small">Player Admin • mobile</div><button id="refresh" style="float:right;margin-top:-28px">↻ Refresh</button><div style="clear:both"></div></div><div id="auth" class="card"><b>Memeriksa Login Admin…</b></div><section class="card"><div class="small">Sekarang</div><h2 id="title">Belum ada lagu</h2><div id="meta" class="small">-</div><div id="player"></div><div class="controls" style="margin-top:10px"><button id="prev">⏮ Sebelumnya</button><button id="start" class="primary">▶ Mulai</button><button id="next">Berikutnya ⏭</button></div><p id="status" class="small">Menyiapkan player…</p></section><section class="card"><b>🎯 Pilih Video YouTube</b><p class="hint">Lagu baru cukup dipasangkan sekali. Video ID disimpan di Google Sheet sehingga tetap dikenal dari HP/browser Admin lain.</p><div class="searchbox"><button id="searchyt" class="green">🔎 Cari di YouTube</button><button id="clearMap">Hapus Mapping</button></div><div class="row" style="margin-top:8px"><input id="video" placeholder="Tempel URL YouTube di sini"><button id="save">Pasang</button></div><p id="mapping" class="small"></p></section><section class="card"><b>Antrean berikutnya</b><div id="queue" class="small"></div></section></main><script>const GAS='https://script.google.com/macros/s/AKfycbyUB8drjL1dSJedYjKIKjVc5gzIE3Pe-QS0FF8o1_zU4NkAweGLFquhHLfy1Nt_eITA-Q/exec',TK='kudajitu_admin_token';let q=[],i=0,yt=null,ready=false,started=false,busy=false,apiLoading=false,currentMarked=false,currentPlaying=false,maps={};const $=x=>document.getElementById(x);function token(){return sessionStorage.getItem(TK)||localStorage.getItem(TK)||''}function jsonp(url,ms=18000){return new Promise((res,rej)=>{let c='__kp'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script'),done=false,t=setTimeout(()=>fin(Error('Timeout')),ms);function fin(e,d){if(done)return;done=true;clearTimeout(t);s.remove();try{delete window[c]}catch(_){}e?rej(e):res(d)}window[c]=d=>d&&d.success===false?fin(Error(d.message||'Server gagal')):fin(null,d);s.src=url+(url.includes('?')?'&':'?')+'callback='+c+'&_='+Date.now();s.onerror=()=>fin(Error('Network error'));document.head.appendChild(s)})}function songKey(x){return String((x?.title||'')+'|'+(x?.artist&&x.artist!=='Unknown Artist'?x.artist:'')).trim().toLowerCase().replace(/\s+/g,' ')}function getVideo(x){if(!x)return'';return maps[songKey(x)]||localStorage.getItem('kpyt_'+x.id)||localStorage.getItem('kpyt_song_'+songKey(x))||''}function setVideo(x,id){if(!x)return;maps[songKey(x)]=id;localStorage.setItem('kpyt_'+x.id,id);localStorage.setItem('kpyt_song_'+songKey(x),id)}async function auth(){let t=token();if(!t){$('auth').innerHTML='<b>Login Admin diperlukan</b><p class="small">Login di /admin terlebih dahulu. Setelah login, buka menu 🎧 Player.</p>';return false}try{let d=await jsonp(GAS+'?action=adminsession&token='+encodeURIComponent(t),12000);if(d.success){sessionStorage.setItem(TK,t);localStorage.setItem(TK,t);$('auth').innerHTML='<span class="ok">✓ Admin terhubung</span>';return true}}catch(e){}sessionStorage.removeItem(TK);localStorage.removeItem(TK);$('auth').innerHTML='<b>Session Admin tidak valid</b><p class="small">Silakan login Admin kembali.</p>';return false}async function loadMaps(){let d=await jsonp(GAS+'?action=youtubemappings&adminToken='+encodeURIComponent(token()),12000);maps=d.mappings||{};localStorage.setItem('kpyt_mappings_v1',JSON.stringify(maps))}async function load(){if(busy)return;if(!(await auth()))return;busy=true;try{try{await loadMaps()}catch(e){try{maps=JSON.parse(localStorage.getItem('kpyt_mappings_v1')||'{}')}catch(_){} }let d=await jsonp(GAS+'?action=data&range=today&status=pending');q=Array.isArray(d.data)?d.data:[];if(i>=q.length)i=Math.max(0,q.length-1);currentMarked=false;currentPlaying=false;render();$('status').textContent=q.length?q.length+' request pending. Player siap.':'Tidak ada request pending.'}catch(e){$('status').textContent='Gagal memuat antrean: '+e.message;$('status').className='small error'}finally{busy=false}}function esc(x){return String(x||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function render(){let x=q[i];$('title').textContent=x?.title||'Belum ada lagu';$('meta').textContent=x?(x.artist||'Tanpa penyanyi')+' • '+(x.requester||'User'):'Antrean kosong';let id=getVideo(x);$('video').value=id;$('mapping').innerHTML=id?'<span class="ok">✓ Video sudah dipasangkan secara permanen.</span>':'Belum ada video yang dikonfirmasi untuk lagu ini.';let r=q.slice(i+1,i+6);$('queue').innerHTML=r.length?r.map((x,n)=>'<div class="item">'+(n+1)+'. '+esc(x.title)+'<br><span class="small">'+esc(x.artist||'')+(getVideo(x)?' • ✓ video siap':' • ⚠ belum dipasangkan')+'</span></div>').join(''):'Tidak ada request berikutnya.'}function ytLoad(){if(window.YT?.Player){makeYT();return}if(apiLoading)return;apiLoading=true;let s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);window.onYouTubeIframeAPIReady=()=>{apiLoading=false;makeYT()}}function makeYT(){if(yt||!window.YT?.Player)return;yt=new YT.Player('player',{width:'100%',height:'100%',videoId:'',playerVars:{playsinline:1,rel:0,controls:1,modestbranding:1},events:{onReady:()=>{ready=true;$('status').textContent=q.length?'Player siap. Pilih video lalu tekan Mulai.':'Player siap.'},onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)finish()},onError:e=>{$('status').textContent='YouTube error '+e.data;$('status').className='small error'}}})}function currentVideo(){return getVideo(q[i])}function play(){let id=currentVideo();if(!id){$('status').textContent='Pilih dan pasangkan video YouTube untuk request ini terlebih dahulu.';$('status').className='small error';return false}if(!yt||!ready){$('status').textContent='Player masih disiapkan. Tekan Mulai lagi setelah player siap.';return false}$('status').textContent='Memuat '+q[i].title+'…';currentPlaying=true;yt.loadVideoById({videoId:id,startSeconds:0});return true}async function markCurrent(){let x=q[i];if(!x||currentMarked)return true;$('status').textContent='Menandai '+x.title+'…';$('status').className='small';try{let d=await jsonp(GAS+'?action=updateStatus&id='+encodeURIComponent(x.id)+'&status=played&adminToken='+encodeURIComponent(token()),18000);if(d.success===true){currentMarked=true;$('status').textContent='✓ Status = played. Memulai '+x.title+'…';$('status').className='small ok';return true}throw Error(d.message||'Gagal update status')}catch(e){$('status').textContent='Gagal menandai request: '+e.message;$('status').className='small error';return false}}async function start(){if(!q.length){await load();if(!q.length)return}started=true;if(!yt||!ready){ytLoad();$('status').textContent='Player disiapkan. Tekan Mulai lagi setelah player siap.';return}let id=currentVideo();if(!id){$('status').textContent='Pasangkan video YouTube untuk request ini terlebih dahulu.';$('status').className='small error';return}if(!currentMarked){let ok=await markCurrent();if(!ok){started=false;return}}play()}async function finish(){if(busy)return;let x=q[i];if(!x)return;if(!currentMarked){let ok=await markCurrent();if(!ok)return}currentPlaying=false;q.splice(i,1);if(i>=q.length)i=0;currentMarked=false;render();if(q.length&&started)play();else if(q.length)$('status').textContent='Request berikutnya siap. Tekan Mulai.';else $('status').textContent='Antrean selesai.'}function openSearch(){let x=q[i];if(!x)return;let query=encodeURIComponent([x.title,x.artist].filter(Boolean).join(' '));window.open('https://www.youtube.com/results?search_query='+query,'_blank','noopener,noreferrer');$('status').textContent='Pilih video yang paling sesuai di YouTube, lalu salin URL dan tempel di sini.'}function parseVideo(raw){raw=String(raw||'').trim();let m=raw.match(/(?:v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/);return m?m[1]:raw}$('start').onclick=start;$('refresh').onclick=load;$('prev').onclick=()=>{if(i>0){i--;currentMarked=false;currentPlaying=false;render();if(started)play()}};$('next').onclick=finish;$('searchyt').onclick=openSearch;$('save').onclick=async()=>{let x=q[i],id=parseVideo($('video').value);if(!x||!/^[A-Za-z0-9_-]{11}$/.test(id)){$('status').textContent='URL/Video ID YouTube tidak valid atau request belum tersedia.';$('status').className='small error';return}try{let d=await jsonp(GAS+'?action=saveyoutubemapping&title='+encodeURIComponent(x.title)+'&artist='+encodeURIComponent(x.artist||'')+'&videoId='+encodeURIComponent(id)+'&adminToken='+encodeURIComponent(token()),12000);if(!d.success)throw Error(d.message||'Gagal menyimpan mapping');setVideo(x,id);localStorage.setItem('kpyt_mappings_v1',JSON.stringify(maps));render();$('status').textContent='✓ Mapping tersimpan di Google Sheet. Lagu ini akan dikenali dari perangkat Admin lain.';$('status').className='small ok';if(started)play()}catch(e){$('status').textContent='Gagal menyimpan mapping: '+e.message;$('status').className='small error'}};$('clearMap').onclick=async()=>{let x=q[i];if(!x)return;let k=songKey(x);try{await jsonp(GAS+'?action=deleteyoutubemapping&key='+encodeURIComponent(k)+'&adminToken='+encodeURIComponent(token()),12000)}catch(e){}delete maps[k];localStorage.removeItem('kpyt_'+x.id);localStorage.removeItem('kpyt_song_'+k);localStorage.setItem('kpyt_mappings_v1',JSON.stringify(maps));render();$('status').textContent='Mapping video dihapus.'};load();ytLoad();</script></body></html>
