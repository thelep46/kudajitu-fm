<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kudajitu Auto Player</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#090b10;color:#f4f7fb;font-family:system-ui,sans-serif}main{max-width:900px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#121620;border:1px solid #273044;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 30px #0005}.small{font-size:13px;color:#9aa5b5}.ok{color:#86efac}.error{color:#fca5a5}.now{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:18px}.cover{aspect-ratio:16/9;background:linear-gradient(135deg,#161d2b,#050609);border-radius:14px;display:grid;place-items:center;color:#657085;font-size:52px;overflow:hidden}.cover iframe{width:100%;height:100%;border:0}.meta{margin:12px 0}.controls{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}button{min-height:44px;border:1px solid #30394b;border-radius:12px;background:#1a2130;color:#fff;font-weight:700;padding:9px 12px;cursor:pointer;transition:.15s}button:hover{transform:translateY(-1px);border-color:#66738c}button:active{transform:translateY(1px) scale(.98)}button.primary{background:#e53935;border-color:#e53935}.item{padding:12px;border:1px solid #273044;border-radius:12px;margin-top:8px}.ready{border-color:#245c48}.missing{border-color:#6b3d3d}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#1d2636;font-size:11px}.empty{text-align:center;padding:25px;color:#7f8999}@media(max-width:700px){.now{grid-template-columns:1fr}main{padding:12px}.top h1{font-size:20px}}</style></head><body><main><div class="top"><div><h1 style="margin:0">🎧 KudaJitu Player</h1><div class="small">Auto Queue · YouTube Mapping · Supabase Realtime</div></div><button id="refresh">↻ Refresh</button></div><div id="auth" class="card small">Memeriksa koneksi…</div><section class="card now"><div><div id="media" class="cover">▶</div></div><div><span class="badge">SEKARANG DIPUTAR</span><h2 id="title">Menunggu antrean…</h2><div id="meta" class="small">-</div><p id="status" class="small">Memuat data…</p><div class="controls"><button id="prev">⏮ Sebelumnya</button><button id="start" class="primary">▶ Mulai</button><button id="next">Berikutnya ⏭</button></div></div></section><section class="card"><div class="top"><div><h2 style="margin:0">Antrean</h2><div class="small">Request pending dari User</div></div><span id="count" class="badge">0</span></div><div id="queue"><div class="empty">Memuat antrean…</div></div></section></main><script>'use strict';const SUPABASE_URL='https://jdqcvfqysmjreibcaduk.supabase.co',SUPABASE_KEY='sb_publishable_QDcyGfH-3dBNmUYE9pKIkg_uFmRsmOa',ADMIN_FN=SUPABASE_URL+'/functions/v1/kudajitu-admin-v4';let db,q=[],i=0,yt=null,ready=false,busy=false,playing=false,maps={};const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function norm(x){return String(x||'').trim().toLowerCase().replace(/\s+/g,' ')}function mapKey(t,a){return norm(String(t||'')+'|'+String(a||''))}function youtubeId(raw){const s=String(raw||'').trim();if(!s)return'';try{const u=new globalThis.URL(s),h=u.hostname.toLowerCase().replace(/^www\./,'');if(h==='youtu.be')return(u.pathname.split('/').filter(Boolean)[0]||'').slice(0,11);if(['youtube.com','m.youtube.com','music.youtube.com'].includes(h)){const v=u.searchParams.get('v');if(v)return v.slice(0,11);const p=u.pathname.split('/').filter(Boolean);if(['shorts','embed','live'].includes(p[0])&&p[1])return p[1].slice(0,11)}}catch{}return/^[A-Za-z0-9_-]{11}$/.test(s)?s:''}async function loadMaps(){const r=await db.from('youtube_mappings').select('title,artist,youtube_id,youtube_url');if(r.error)throw r.error;maps={};for(const x of r.data||[]){const id=youtubeId(x.youtube_id)||youtubeId(x.youtube_url);if(id)maps[mapKey(x.title,x.artist)]=id}}async function loadQueue(){const r=await db.from('requests').select('id,requester,title,artist,note,status,timestamp,played_at,queue_position').eq('status','pending').order('queue_position',{ascending:true,nullsFirst:false}).order('timestamp',{ascending:true}).limit(500);if(r.error)throw r.error;return r.data||[]}function video(x){return youtubeId(x?.note)||maps[mapKey(x?.title,x?.artist&&x.artist!=='Unknown Artist'?x.artist:'')]||maps[mapKey(x?.title,'')]}function render(){const x=q[i];$('count').textContent=String(q.length);$('title').textContent=x?.title||'Antrean kosong';$('meta').textContent=x?(x.artist||'Tanpa penyanyi')+' · '+(x.requester||'User'):'Belum ada request pending';if(x){const v=video(x);$('media').innerHTML=v?'<div id="yt"></div>':'<span>♪</span>';$('status').textContent=v?'Video YouTube tersedia. Tekan Mulai.':'Mapping YouTube belum ditemukan untuk lagu ini.';$('status').className='small '+(v?'ok':'error')}else{$('media').innerHTML='<span>▶</span>';$('status').textContent='Tidak ada request pending.';$('status').className='small'}const rest=q.map((x,n)=>({x,n})).filter(a=>a.n!==i).slice(0,20);$('queue').innerHTML=rest.length?rest.map((a,n)=>{const v=video(a.x);return '<div class="item '+(v?'ready':'missing')+'"><b>'+(n+1)+'. '+esc(a.x.title||'-')+'</b><br><span class="small">'+esc(a.x.artist||'Unknown Artist')+' · '+esc(a.x.requester||'User')+(v?' · ✓ video siap':' · ⚠ mapping belum ada')+'</span></div>'}).join(''):'<div class="empty">Belum ada request berikutnya.</div>';ready=false;yt=null}function ytLoad(){if(window.YT?.Player){makeYT();return}if(document.getElementById('yt-api'))return;const s=document.createElement('script');s.id='yt-api';s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);window.onYouTubeIframeAPIReady=makeYT}function makeYT(){const x=q[i],v=video(x);if(!x||!v||yt||!window.YT?.Player)return;yt=new YT.Player('yt',{width:'100%',height:'100%',videoId:v,playerVars:{playsinline:1,rel:0,controls:1,modestbranding:1,enablejsapi:1,origin:location.origin},events:{onReady:()=>{ready=true},onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)next()},onError:e=>{$('status').textContent='YouTube gagal memutar video ('+e.data+').';$('status').className='small error'}}})}async function authInfo(){const s=(await db.auth.getSession()).data.session;$('auth').innerHTML=s?.user?.app_metadata?.role==='admin'?'<span class="ok">✓ Admin terhubung · Player siap</span>':'<span>● Player publik · Login Admin hanya diperlukan untuk aksi Played</span>'}async function load(){if(busy)return;busy=true;$('status').textContent='Memuat antrean…';try{await loadMaps();q=await loadQueue();i=Math.min(i,Math.max(0,q.length-1));render();await authInfo();if(q[i]&&video(q[i]))ytLoad()}catch(e){$('status').textContent='Gagal memuat: '+(e?.message||e);$('status').className='small error'}finally{busy=false}}async function adminCall(action,payload){const s=(await db.auth.getSession()).data.session;if(!s||s.user?.app_metadata?.role!=='admin')throw Error('Login Admin diperlukan untuk aksi ini.');const r=await fetch(ADMIN_FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token},body:JSON.stringify({action,...payload}),cache:'no-store'});const d=await r.json().catch(()=>null);if(!r.ok||!d?.success)throw Error(d?.message||'Server gagal.');return d}async function start(){const x=q[i],v=video(x);if(!x){await load();return}if(!v){$('status').textContent='Mapping YouTube belum ditemukan.';return}if(!ready){ytLoad();setTimeout(start,500);return}if(!playing){try{await adminCall('updateStatus',{id:String(x.id),status:'played'})}catch(e){$('status').textContent=e.message;$('status').className='small error';return}}playing=true;yt.loadVideoById(v);$('status').textContent='▶ Memutar '+x.title;$('status').className='small ok'}async function next(){if(!q[i])return;try{await adminCall('updateStatus',{id:String(q[i].id),status:'played'})}catch(e){$('status').textContent=e.message;$('status').className='small error';return}q.splice(i,1);if(i>=q.length)i=0;playing=false;render();if(q.length)ytLoad()}$('refresh').onclick=load;$('start').onclick=start;$('next').onclick=next;$('prev').onclick=()=>{if(i>0){i--;playing=false;render();ytLoad()}};db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{realtime:{params:{eventsPerSecond:10}}});db.channel('kudajitu-player').on('postgres_changes',{event:'*',schema:'public',table:'requests'},()=>load()).subscribe();load();ytLoad();</script></body></html>
