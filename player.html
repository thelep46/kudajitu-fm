<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kudajitu Auto Player</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#090b10;color:#f4f7fb;font-family:system-ui,sans-serif}main{max-width:720px;margin:auto;padding:14px}.card{background:#121620;border:1px solid #273044;border-radius:16px;padding:14px;margin:10px 0}button{min-height:44px;border:1px solid #273044;border-radius:12px;background:#1a2130;color:#fff;font-weight:700;padding:9px 12px;cursor:pointer}button.primary{background:#ef4444;border-color:#ef4444}.controls{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}.small{font-size:12px;color:#9aa5b5}.ok{color:#86efac}.error{color:#fca5a5}.item{padding:10px;border:1px solid #273044;border-radius:10px;margin-top:8px}.ready{border-color:#245c48}.missing{border-color:#6b3d3d}#player{margin-top:10px;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}#player iframe{width:100%!important;height:100%!important}</style></head><body><main><div class="card"><b>🎧 Kudajitu Auto Player</b><div class="small">Auto Queue • Supabase YouTube Mapping</div><button id="refresh" style="float:right;margin-top:-27px">↻ Refresh</button><div style="clear:both"></div></div><div id="auth" class="card"><span class="small">Memeriksa akses player…</span></div><section class="card"><div class="small">Sekarang</div><h2 id="title">Belum ada lagu</h2><div id="meta" class="small">-</div><div id="player"></div><div class="controls" style="margin-top:10px"><button id="prev">⏮ Sebelumnya</button><button id="start" class="primary">▶ Mulai</button><button id="next">Berikutnya ⏭</button></div><p id="status" class="small">Menyiapkan player…</p></section><section class="card"><b>Antrean berikutnya</b><p class="small">Link YouTube dari request diprioritaskan. Jika tidak ada, Player menggunakan mapping Supabase.</p><div id="queue" class="small"></div></section></main><script>'use strict';const URL='https://jdqcvfqysmjreibcaduk.supabase.co',KEY='sb_publishable_QDcyGfH-3dBNmUYE9pKIkg_uFmRsmOa',FN=URL+'/functions/v1/kudajitu-admin-v4';let db,q=[],i=0,yt=null,ready=false,started=false,busy=false,currentMarked=false,maps={};const $=id=>document.getElementById(id),esc=x=>String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function key(x){return String((x?.title||'')+'|'+(x?.artist&&x.artist!=='Unknown Artist'?x.artist:'')).trim().toLowerCase().replace(/\s+/g,' ')}function vid(v){const raw=String(v||'').trim();if(!raw)return'';try{const u=new URL(raw),h=u.hostname.toLowerCase().replace(/^www\./,'');if(h==='youtu.be')return(u.pathname.split('/').filter(Boolean)[0]||'').slice(0,11);if(['youtube.com','m.youtube.com','music.youtube.com'].includes(h)){if(u.searchParams.get('v'))return u.searchParams.get('v').slice(0,11);const p=u.pathname.split('/').filter(Boolean);if(['shorts','embed','live'].includes(p[0])&&p[1])return p[1].slice(0,11)}}catch(_){}return''}function video(x){return vid(x?.note)||maps[key(x)]||''}async function loadMaps(){const r=await db.from('youtube_mappings').select('map_key,youtube_id');if(r.error)throw r.error;maps={};(r.data||[]).forEach(x=>{if(x.map_key&&x.youtube_id)maps[String(x.map_key)]=String(x.youtube_id)});return true}async function loadQueue(){const r=await db.from('requests').select('id,requester,title,artist,note,status,timestamp,played_at,queue_position').eq('status','pending').order('queue_position',{ascending:true,nullsFirst:false}).order('timestamp',{ascending:true}).limit(1000);if(r.error)throw r.error;return r.data||[]}async function adminCall(action,payload){const s=(await db.auth.getSession()).data.session;if(!s)throw Error('Login Admin diperlukan untuk aksi ini.');const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token},body:JSON.stringify({action,...(payload||{})}),cache:'no-store'});const d=await r.json().catch(()=>null);if(!r.ok||!d?.success)throw Error(d?.message||'Server gagal.');return d}async function authInfo(){const s=(await db.auth.getSession()).data.session;if(s?.user?.app_metadata?.role==='admin'){$('auth').innerHTML='<span class="ok">✓ Admin terhubung via Supabase</span>';return true}$('auth').innerHTML='<span class="small">Player publik • Login Admin hanya diperlukan saat menandai lagu selesai.</span>';return false}async function mark(){const x=q[i];if(!x||currentMarked)return true;try{await adminCall('updateStatus',{id:String(x.id),status:'played'});currentMarked=true;$('status').textContent='✓ Status = played. Memulai '+x.title+'…';$('status').className='small ok';return true}catch(e){$('status').textContent='Gagal menandai: '+e.message;$('status').className='small error';return false}}async function load(){if(busy)return;busy=true;const prev=q[i]?.id||'';$('status').textContent='Memuat antrean…';try{await loadMaps();const nq=await loadQueue();const keep=q.find(x=>String(x.id)===String(prev));q=nq;if(keep){q=[keep,...q.filter(x=>String(x.id)!==String(prev))];i=0}else i=Math.min(i,q.length?q.length-1:0);render();await authInfo();$('status').textContent=q.length?(started?'✓ Antrean diperbarui.':q.length+' request pending. Player siap.'):'Tidak ada request pending.'}catch(e){$('status').textContent='Gagal memuat: '+e.message;$('status').className='small error'}finally{busy=false}}function render(){const x=q[i],v=video(x);$('title').textContent=x?.title||'Belum ada lagu';$('meta').textContent=x?(x.artist||'Tanpa penyanyi')+' • '+(x.requester||'User'):'Antrean kosong';const rows=q.map((x,n)=>({x,n})).filter(a=>a.n!==i).slice(0,12);$('queue').innerHTML=rows.length?rows.map((a,n)=>'<div class="item '+(video(a.x)?'ready':'missing')+'"><b>'+(n+1)+'. '+esc(a.x.title)+'</b><br><span class="small">'+esc(a.x.artist||'Unknown Artist')+(video(a.x)?' • ✓ video siap':' • ⚠ belum ada Link/Mapping YouTube')+'</span></div>').join(''):'Tidak ada request berikutnya.';if(x&&!v&&!started){$('status').textContent='⚠ Lagu ini belum mempunyai Link atau mapping YouTube.';$('status').className='small error'}}function ytLoad(){if(window.YT?.Player){makeYT();return}const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);window.onYouTubeIframeAPIReady=makeYT}function makeYT(){if(yt||!window.YT?.Player)return;yt=new YT.Player('player',{width:'100%',height:'100%',videoId:'',playerVars:{playsinline:1,rel:0,controls:1,modestbranding:1,enablejsapi:1,origin:location.origin},events:{onReady:()=>{ready=true},onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)finish()},onError:e=>{$('status').textContent='YouTube error '+e.data;$('status').className='small error'}}})}async function start(){if(!q.length){await load();if(!q.length)return}started=true;if(!ready){ytLoad();$('status').textContent='Player sedang disiapkan. Tekan Mulai lagi setelah siap.';return}const v=video(q[i]);if(!v){started=false;render();return}if(!currentMarked){const s=(await db.auth.getSession()).data.session;if(s?.user?.app_metadata?.role==='admin'){if(!(await mark()))return}else{$('status').textContent='⚠ Login Admin diperlukan untuk menandai lagu sebagai Played.';$('status').className='small error';return}}yt.loadVideoById({videoId:v,startSeconds:0});$('status').textContent='▶ Memutar '+q[i].title+'…';$('status').className='small ok'}async function finish(){if(busy||!q[i])return;if(!currentMarked&&!(await mark()))return;q.splice(i,1);if(i>=q.length)i=0;currentMarked=false;render();if(q.length&&started)await start();else $('status').textContent=q.length?'Request berikutnya siap.':'Antrean selesai.'}$('refresh').onclick=load;$('start').onclick=start;$('next').onclick=finish;$('prev').onclick=()=>{if(i>0){i--;currentMarked=false;render();if(started&&video(q[i]))start()}};db=window.supabase.createClient(URL,KEY,{realtime:{params:{eventsPerSecond:10}}});db.channel('player-requests').on('postgres_changes',{event:'INSERT',schema:'public',table:'requests'},()=>load()).on('postgres_changes',{event:'UPDATE',schema:'public',table:'requests'},()=>load()).on('postgres_changes',{event:'DELETE',schema:'public',table:'requests'},()=>load()).subscribe();load();ytLoad();</script></body></html>
