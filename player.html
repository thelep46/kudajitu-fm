<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KudaJitu • Auto Player</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07090d;color:#f5f7fb;font-family:Inter,system-ui,-apple-system,sans-serif}main{max-width:1050px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{font-size:22px;font-weight:800}.sub{font-size:12px;color:#8f9bad}.actions{display:flex;gap:8px}button,.back{border:1px solid #293246;background:#151b27;color:#fff;border-radius:10px;min-height:40px;padding:8px 13px;font-weight:700;text-decoration:none;cursor:pointer}.back{display:inline-flex;align-items:center}.primary{background:#ef4444;border-color:#ef4444}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:14px}.card{background:#0f141d;border:1px solid #263044;border-radius:16px;overflow:hidden}.now{padding:14px}.badge{display:inline-block;font-size:10px;font-weight:800;background:#202938;color:#b9c4d4;border-radius:999px;padding:5px 8px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center}.video{background:#000;aspect-ratio:16/9;border-radius:12px;overflow:hidden}.video iframe{width:100%!important;height:100%!important}.info h1{margin:7px 0 4px;font-size:30px}.meta{color:#9aa5b5;font-size:13px}.status{margin-top:12px;font-size:12px;color:#9aa5b5}.ok{color:#86efac}.err{color:#fca5a5}.controls{display:flex;gap:8px;margin-top:14px}.controls button{flex:1}.queue-head{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid #232c3c}.queue{padding:10px}.item{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid #273246;border-radius:11px;margin-bottom:8px}.num{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#202938;font-size:11px;font-weight:800}.item b{font-size:13px}.item small{display:block;color:#8f9bad;margin-top:3px}.ready{border-color:#285b49}.missing{border-color:#5b3737}.empty{padding:25px;text-align:center;color:#8f9bad}.footer{margin-top:12px;text-align:center;color:#667286;font-size:11px}@media(max-width:760px){main{padding:10px}.layout,.hero{grid-template-columns:1fr}.info h1{font-size:23px}.actions{flex-wrap:wrap}.back{order:2}}</style></head><body><main><header class="top"><div><div class="brand">🎧 KudaJitu Player</div><div class="sub">Auto Queue • Supabase Realtime • YouTube Mapping</div></div><div class="actions"><a class="back" href="/admin">← Kembali ke Admin</a><button id="refresh">↻ Refresh</button></div></header><div id="auth" class="card" style="padding:10px 14px;margin-bottom:14px;font-size:12px;color:#9aa5b5">Memeriksa koneksi…</div><div class="layout"><section class="card"><div class="now"><span class="badge">SEKARANG DIPUTAR</span><div class="hero"><div class="video" id="player"></div><div class="info"><h1 id="title">Memuat…</h1><div id="meta" class="meta">-</div><div id="status" class="status">Menyiapkan player…</div><div class="controls"><button id="prev">⏮</button><button id="start" class="primary">▶ Mulai</button><button id="next">⏭</button></div></div></div></div></section><section class="card"><div class="queue-head"><b>Antrean</b><span id="count" class="badge">0</span></div><div id="queue" class="queue"><div class="empty">Memuat antrean…</div></div></section></div><div class="footer">KudaJitu • Player production</div></main><script>'use strict';const SUPABASE_URL='https://jdqcvfqysmjreibcaduk.supabase.co',SUPABASE_KEY='sb_publishable_QDcyGfH-3dBNmUYE9pKIkg_uFmRsmOa',ADMIN_FN=SUPABASE_URL+'/functions/v1/kudajitu-admin-v4';let db,q=[],i=0,yt=null,ready=false,started=false,busy=false,currentMarked=false,maps={},autoAttempted=false;const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=x=>String(x??'').trim().toLowerCase().replace(/\s+/g,' ');const mapKey=(t,a)=>norm(String(t??'')+'|'+String(a??''));function vid(v){const raw=String(v||'').trim();if(!raw)return'';try{const u=new globalThis.URL(raw),h=u.hostname.toLowerCase().replace(/^www\./,'');if(h==='youtu.be')return(u.pathname.split('/').filter(Boolean)[0]||'').slice(0,11);if(['youtube.com','m.youtube.com','music.youtube.com'].includes(h)){const z=u.searchParams.get('v');if(z)return z.slice(0,11);const p=u.pathname.split('/').filter(Boolean);if(['shorts','embed','live'].includes(p[0])&&p[1])return p[1].slice(0,11)}}catch(_){}return/^[A-Za-z0-9_-]{11}$/.test(raw)?raw:''}async function loadMaps(){const r=await db.from('youtube_mappings').select('title,artist,youtube_id');if(r.error)throw r.error;maps={};(r.data||[]).forEach(x=>{if(x.youtube_id)maps[mapKey(x.title,x.artist)]=String(x.youtube_id)})}async function loadQueue(){const r=await db.from('requests').select('id,requester,title,artist,note,status,timestamp,queue_position,played_at').eq('status','pending').order('queue_position',{ascending:true,nullsFirst:false}).order('timestamp',{ascending:true}).limit(1000);if(r.error)throw r.error;return r.data||[]}function video(x){return vid(x?.note)||maps[mapKey(x?.title,x?.artist&&x.artist!=='Unknown Artist'?x.artist:'')]||''}function render(){const x=q[i];$('count').textContent=q.length;$('title').textContent=x?.title||'Belum ada request';$('meta').textContent=x?(x.artist||'Tanpa penyanyi')+' • '+(x.requester||'User'):'Antrean kosong';const rows=q.filter((_,n)=>n!==i).slice(0,12);$('queue').innerHTML=rows.length?rows.map((x,n)=>'<div class="item '+(video(x)?'ready':'missing')+'"><span class="num">'+(n+1)+'</span><div><b>'+esc(x.title)+'</b><small>'+esc(x.artist||'Unknown Artist')+' • '+(video(x)?'✓ Video siap':'⚠ Mapping belum tersedia')+'</small></div></div>').join(''):'<div class="empty">Tidak ada request pending.</div>'}async function authInfo(){const s=(await db.auth.getSession()).data.session;$('auth').innerHTML=s?.user?.app_metadata?.role==='admin'?'<span class="ok">✓ Admin terhubung • Auto-play aktif</span>':'Player publik • Login Admin diperlukan untuk menandai lagu selesai.';return s}async function load(){if(busy)return;busy=true;try{await loadMaps();q=await loadQueue();i=Math.min(i,Math.max(q.length-1,0));render();const s=await authInfo();$('status').textContent=q.length?(started?'✓ Antrean diperbarui':q.length+' request pending • Player siap'):'Antrean kosong';$('status').className='status';if(s?.user?.app_metadata?.role==='admin'&&ready&&!autoAttempted&&!started){autoAttempted=true;setTimeout(()=>start(true),300)}}catch(e){$('status').textContent='Gagal memuat: '+e.message;$('status').className='status err'}finally{busy=false}}function ytLoad(){if(window.YT?.Player){makeYT();return}if(document.getElementById('yt-api'))return;const s=document.createElement('script');s.id='yt-api';s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);window.onYouTubeIframeAPIReady=makeYT}function makeYT(){if(yt||!window.YT?.Player)return;yt=new YT.Player('player',{width:'100%',height:'100%',videoId:'',playerVars:{playsinline:1,rel:0,controls:1,modestbranding:1,enablejsapi:1,origin:location.origin},events:{onReady:()=>{ready=true;$('status').textContent='Player siap.';if(!autoAttempted){autoAttempted=true;setTimeout(()=>start(true),250)}},onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)finish()},onError:e=>{$('status').textContent='YouTube error '+e.data;$('status').className='status err'}}})}async function adminCall(action,payload){const s=(await db.auth.getSession()).data.session;if(!s||s.user?.app_metadata?.role!=='admin')throw Error('Login Admin diperlukan untuk aksi ini.');const r=await fetch(ADMIN_FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token},body:JSON.stringify({action,...payload}),cache:'no-store'});const d=await r.json().catch(()=>null);if(!r.ok||!d?.success)throw Error(d?.message||'Server gagal');return d}async function mark(){if(!q[i]||currentMarked)return true;await adminCall('updateStatus',{id:String(q[i].id),status:'played'});currentMarked=true;return true}async function start(auto=false){if(!q.length){await load();if(!q.length)return}if(!ready){ytLoad();$('status').textContent='Menyiapkan YouTube…';return}const v=video(q[i]);if(!v){$('status').textContent='⚠ Video belum tersedia untuk lagu ini.';$('status').className='status err';return}if(!currentMarked){try{await mark()}catch(e){$('status').textContent=auto?'Auto-play menunggu sesi Admin: '+e.message:e.message;$('status').className='status err';return}}started=true;try{yt.mute();yt.loadVideoById({videoId:v,startSeconds:0});$('status').textContent=auto?'▶ Auto-play aktif • suara dimatikan browser':'▶ '+q[i].title;$('status').className='status ok';setTimeout(()=>{try{yt.playVideo()}catch(_){}} ,150)}catch(e){$('status').textContent='Gagal memulai video: '+e.message;$('status').className='status err'}}async function finish(){if(busy||!q[i])return;try{if(!currentMarked)await mark();q.splice(i,1);if(i>=q.length)i=0;currentMarked=false;render();if(q.length&&started)await start(true)}catch(e){$('status').textContent=e.message;$('status').className='status err'}}$('refresh').onclick=load;$('start').onclick=()=>start(false);$('next').onclick=finish;$('prev').onclick=()=>{if(i>0){i--;currentMarked=false;render();if(started)start(false)}};db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{realtime:{params:{eventsPerSecond:10}}});db.channel('player-requests').on('postgres_changes',{event:'*',schema:'public',table:'requests'},()=>load()).subscribe();load();ytLoad();</script></body></html>
