<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KudaJitu • Auto Player</title><style>*{box-sizing:border-box}body{margin:0;background:#070b10;color:#f5f7fb;font-family:Inter,system-ui,-apple-system,sans-serif}main{max-width:1100px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{font-size:23px;font-weight:850}.sub{font-size:12px;color:#8f9bad}.actions{display:flex;gap:8px}button,.back{border:1px solid #293246;background:#151b27;color:#fff;border-radius:10px;min-height:40px;padding:8px 13px;font-weight:750;text-decoration:none;cursor:pointer;transition:.18s}button:hover,.back:hover{transform:translateY(-1px);border-color:#14b8a6}button:active{transform:scale(.98)}.primary{background:#ef4444;border-color:#ef4444}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:14px}.card{background:#0f141d;border:1px solid #263044;border-radius:16px;overflow:hidden}.now{padding:14px}.badge{display:inline-block;font-size:10px;font-weight:800;background:#202938;color:#b9c4d4;border-radius:999px;padding:5px 8px}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;align-items:center}.video{background:#000;aspect-ratio:16/9;border-radius:12px;overflow:hidden}.video iframe{width:100%!important;height:100%!important}.info h1{margin:8px 0 4px;font-size:30px;line-height:1.1}.meta{color:#9aa5b5;font-size:13px}.status{margin-top:12px;font-size:12px;color:#9aa5b5}.ok{color:#86efac}.err{color:#fca5a5}.controls{display:flex;gap:8px;margin-top:14px}.controls button{flex:1}.queue-head{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid #232c3c}.queue{padding:10px}.item{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid #273246;border-radius:11px;margin-bottom:8px}.num{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#202938;font-size:11px;font-weight:800}.item b{font-size:13px}.item small{display:block;color:#8f9bad;margin-top:3px}.ready{border-color:#285b49}.missing{border-color:#5b3737}.empty{padding:25px;text-align:center;color:#8f9bad}.footer{margin-top:12px;text-align:center;color:#667286;font-size:11px}@media(max-width:760px){main{padding:10px}.layout,.hero{grid-template-columns:1fr}.info h1{font-size:23px}.actions{flex-wrap:wrap}.back{order:2}}</style></head><body><main><header class="top"><div><div class="brand">🎧 KudaJitu Player</div><div class="sub">Auto Queue • Supabase Realtime • YouTube Mapping</div></div><div class="actions"><a class="back" href="/admin">← Kembali ke Admin</a><button id="refresh">↻ Refresh</button></div></header><div id="auth" class="card" style="padding:10px 14px;margin-bottom:14px;font-size:12px;color:#9aa5b5">Memeriksa koneksi…</div><div class="layout"><section class="card"><div class="now"><span class="badge">SEKARANG DIPUTAR</span><div class="hero"><div class="video" id="player"></div><div class="info"><h1 id="title">Memuat…</h1><div id="meta" class="meta">-</div><div id="status" class="status">Menyiapkan player…</div><div class="controls"><button id="prev" disabled>⏮</button><button id="start" class="primary">▶ Mulai</button><button id="next">⏭</button></div></div></div></div></section><section class="card"><div class="queue-head"><b>Antrean</b><span id="count" class="badge">0</span></div><div id="queue" class="queue"><div class="empty">Memuat antrean…</div></div></section></div><div class="footer">KudaJitu • Player production</div></main></body></html>
