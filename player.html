<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kudajitu Auto Player</title>
<style>body{margin:0;background:#090b10;color:#f4f7fb;font-family:system-ui,sans-serif}main{max-width:720px;margin:auto;padding:14px}.card{background:#121620;border:1px solid #273044;border-radius:16px;padding:14px;margin:10px 0}button{min-height:44px;border:1px solid #273044;border-radius:12px;background:#1a2130;color:#fff;font-weight:700;padding:9px 12px;cursor:pointer}button.primary{background:#ef4444;border-color:#ef4444}.controls{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}.small{font-size:12px;color:#9aa5b5}.ok{color:#86efac}.error{color:#fca5a5}.item{padding:10px;border:1px solid #273044;border-radius:10px;margin-top:8px}.ready{border-color:#245c48}.missing{border-color:#6b3d3d}#player{margin-top:10px;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}#player iframe{width:100%!important;height:100%!important}@media(max-width:380px){main{padding:9px}.card{padding:11px}.controls{grid-template-columns:1fr 1fr 1fr}.controls button{font-size:11px;padding:8px}}</style>
</head><body><main>
<div class="card"><b>🎧 Kudajitu Auto Player</b><div class="small">Auto Queue • Google Sheet YouTube Mapping • Mobile Admin</div><button id="refresh" style="float:right;margin-top:-27px">↻ Refresh</button><div style="clear:both"></div></div>
<div id="auth" class="card"><b>Memeriksa Login Admin…</b></div>
<section class="card"><div class="small">Sekarang</div><h2 id="title">Belum ada lagu</h2><div id="meta" class="small">-</div><div id="player"></div><div class="controls" style="margin-top:10px"><button id="prev">⏮ Sebelumnya</button><button id="start" class="primary">▶ Mulai</button><button id="next">Berikutnya ⏭</button></div><p id="status" class="small">Menyiapkan player…</p></section>
<section class="card"><b>Antrean berikutnya</b><p class="small">Link YouTube dari request diprioritaskan. Jika tidak ada, Player menggunakan mapping dari Google Sheet.</p><div id="queue" class="small"></div></section>
</main><script>
const GAS='https://script.google.com/macros/s/AKfycbyUB8drjL1dSJedYjKIKjVc5gzIE3Pe-QS0FF8o1_zU4NkAweGLFquhHLfy1Nt_eITA-Q/exec',TK='kudajitu_admin_token';
let q=[],i=0,yt=null,ready=false,started=false,busy=false,api=false,currentMarked=false,maps={};
const $=id=>document.getElementById(id); const token=()=>sessionStorage.getItem(TK)||localStorage.getItem(TK)||'';
function jsonp(url,ms=12000){return new Promise((res,rej)=>{const c='__kp'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const t=setTimeout(()=>finish(Error('Timeout')),ms);function finish(e,d){if(done)return;done=true;clearTimeout(t);s.remove();try{delete window[c]}catch(_){}e?rej(e):res(d)}window[c]=d=>d&&d.success===false?finish(Error(d.message||'Server gagal')):finish(null,d);s.src=url+(url.includes('?')?'&':'?')+'callback='+c+'&_='+Date.now();s.onerror=()=>finish(Error('Network error'));document.head.appendChild(s)})}
function key(x){return String((x?.title||'')+'|'+(x?.artist&&x.artist!=='Unknown Artist'?x.artist:'')).trim().toLowerCase().replace(/\s+/g,' ')}
function youtubeVideoId(value){const raw=String(value||'').trim();if(!raw)return'';try{const u=new URL(raw);const host=u.hostname.toLowerCase().replace(/^www\./,'');if(host==='youtu.be')return(u.pathname.split('/').filter(Boolean)[0]||'').slice(0,11);if(host==='youtube.com'||host==='m.youtube.com'||host==='music.youtube.com'){if(u.searchParams.get('v'))return u.searchParams.get('v').slice(0,11);const p=u.pathname.split('/').filter(Boolean);if((p[0]==='shorts'||p[0]==='embed'||p[0]==='live')&&p[1])return p[1].slice(0,11)}}catch(_){}return''}
function video(x){if(!x)return'';const direct=youtubeVideoId(x.note||x.youtubeUrl||x.youtubeId||'');return direct||maps[key(x)]||localStorage.getItem('kpyt_'+x.id)||localStorage.getItem('kpyt_song_'+key(x))||''}
function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function cachedMaps(){try{return JSON.parse(localStorage.getItem('kpyt_mappings_v1')||'{}')}catch(_){return{}}}
async function auth(){const t=token();if(!t){$('auth').innerHTML='<b>Login Admin diperlukan</b><p class="small">Login di /admin lalu buka menu 🎧 Player.</p>';return false}try{const d=await jsonp(GAS+'?action=adminsession&token='+encodeURIComponent(t),7000);if(d.success){$('auth').innerHTML='<span class="ok">✓ Admin terhubung</span>';return true}}catch(e){}$('auth').innerHTML='<b class="error">Session Admin tidak valid</b>';return false}
async function loadMaps(){try{maps=cachedMaps();const p=jsonp(GAS+'?action=youtubemappings&adminToken='+encodeURIComponent(token()),9000).then(d=>{maps=d.mappings||{};try{localStorage.setItem('kpyt_mappings_v1',JSON.stringify(maps))}catch(_){}return true});return p}catch(e){return false}}
async function loadQueue(){const d=await jsonp(GAS+'?action=data&range=today&status=pending',9000);return Array.isArray(d.data)?d.data:[]}
async function load(){if(busy)return;if(!(await auth()))return;busy=true;const startedAt=performance.now();$('status').textContent='Memuat antrean…';$('status').className='small';try{maps=cachedMaps();const [queue]=await Promise.all([loadQueue(),loadMaps()]);q=queue;if(i>=q.length)i=Math.max(0,q.length-1);currentMarked=false;render();$('status').textContent=q.length?q.length+' request pending. Player siap.':'Tidak ada request pending.';console.info('[Kudajitu Player] loaded in '+Math.round(performance.now()-startedAt)+'ms')}catch(e){$('status').textContent='Gagal memuat antrean: '+e.message;$('status').className='small error'}finally{busy=false}}
function render(){const x=q[i],v=video(x);$('title').textContent=x?.title||'Belum ada lagu';$('meta').textContent=x?(x.artist||'Tanpa penyanyi')+' • '+(x.requester||'User'):'Antrean kosong';const rows=q.map((x,n)=>({x,n})).filter(a=>a.n!==i).slice(0,12);$('queue').innerHTML=rows.length?rows.map((a,n)=>{const has=!!video(a.x);return '<div class="item '+(has?'ready':'missing')+'"><b>'+(n+1)+'. '+esc(a.x.title)+'</b><br><span class="small">'+esc(a.x.artist||'Unknown Artist')+(has?' • ✓ video siap':' • ⚠ belum ada Link/Mapping YouTube')+'</span></div>'}).join(''):'Tidak ada request berikutnya.';if(x&&!v&&!started){$('status').textContent='⚠ Lagu ini belum mempunyai Link atau mapping YouTube.';$('status').className='small error'}}
function ytLoad(){if(window.YT?.Player){makeYT();return}if(api)return;api=true;const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);window.onYouTubeIframeAPIReady=()=>makeYT()}
function makeYT(){if(yt||!window.YT?.Player)return;yt=new YT.Player('player',{width:'100%',height:'100%',videoId:'',playerVars:{playsinline:1,rel:0,controls:1,modestbranding:1},events:{onReady:()=>{ready=true;if(!started)$('status').textContent=q.length?'Player siap.':'Player siap.'},onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)finish()},onError:e=>{$('status').textContent='YouTube error '+e.data;$('status').className='small error'}}})}
async function mark(){const x=q[i];if(!x||currentMarked)return true;$('status').textContent='Menandai '+x.title+'…';try{const d=await jsonp(GAS+'?action=updateStatus&id='+encodeURIComponent(x.id)+'&status=played&adminToken='+encodeURIComponent(token()),9000);if(!d.success)throw Error(d.message||'Gagal update status');currentMarked=true;$('status').textContent='✓ Status = played. Memulai '+x.title+'…';$('status').className='small ok';return true}catch(e){$('status').textContent='Gagal menandai: '+e.message;$('status').className='small error';return false}}
function play(){const x=q[i],v=video(x);if(!x)return false;if(!v){$('status').textContent='⚠ Lagu ini belum mempunyai Link atau mapping YouTube.';$('status').className='small error';return false}if(!yt||!ready){$('status').textContent='Player belum siap, tekan Mulai lagi.';return false}yt.loadVideoById({videoId:v,startSeconds:0});$('status').textContent='▶ Memutar '+x.title+'…';$('status').className='small ok';return true}
async function start(){if(!q.length){await load();if(!q.length)return}started=true;if(!ready){ytLoad();$('status').textContent='Player sedang disiapkan. Tekan Mulai lagi setelah siap.';return}if(!video(q[i])){started=false;play();return}if(!currentMarked&&!(await mark()))return;play()}
async function finish(){if(busy||!q[i])return;const x=q[i];if(!currentMarked&&!(await mark()))return;q.splice(i,1);if(i>=q.length)i=0;currentMarked=false;render();if(q.length&&started){if(video(q[i]))await start();else{$('status').textContent='⚠ Lagu berikutnya belum mempunyai Link atau mapping YouTube. Player berhenti sementara.';$('status').className='small error'}}else $('status').textContent=q.length?'Request berikutnya siap.':'Antrean selesai.'}
$('refresh').onclick=load;$('start').onclick=start;$('next').onclick=finish;$('prev').onclick=()=>{if(i>0){i--;currentMarked=false;render();if(started&&video(q[i]))start()}};maps=cachedMaps();load();ytLoad();
</script></body></html>
