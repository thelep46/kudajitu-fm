<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kudajitu Auto Player</title><style>body{margin:0;background:#090b10;color:#f4f7fb;font-family:system-ui,sans-serif}main{max-width:720px;margin:auto;padding:14px}.card{background:#121620;border:1px solid #273044;border-radius:16px;padding:14px;margin:10px 0}button{min-height:46px;border:1px solid #273044;border-radius:12px;background:#1a2130;color:#fff;font-weight:700;padding:10px;cursor:pointer}button.primary{background:#ef4444;border-color:#ef4444}.controls{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}input{box-sizing:border-box;width:100%;padding:11px;border-radius:10px;background:#0c111a;color:#fff;border:1px solid #273044}.row{display:flex;gap:8px}.row input{flex:1}.small{font-size:12px;color:#9aa5b5}.error{color:#fca5a5}.ok{color:#86efac}#player{margin-top:10px;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}.item{padding:9px;border:1px solid #273044;border-radius:10px;margin-top:7px}@media(max-width:380px){main{padding:9px}.card{padding:11px}}</style></head><body><main><div class="card"><b>🎧 Kudajitu Auto Player</b><div class="small">Player Admin • mobile</div><button id="refresh" style="float:right;margin-top:-28px">↻ Refresh</button><div style="clear:both"></div></div><div id="auth" class="card"><b>Memeriksa Login Admin…</b></div><section class="card"><div class="small">Sekarang</div><h2 id="title">Belum ada lagu</h2><div id="meta" class="small">-</div><div id="player"></div><div class="controls" style="margin-top:10px"><button id="prev">⏮ Sebelumnya</button><button id="start" class="primary">▶ Mulai</button><button id="next">Berikutnya ⏭</button></div><p id="status" class="small">-</p></section><section class="card"><b>Video YouTube request ini</b><div class="row" style="margin-top:8px"><input id="video" placeholder="YouTube Video ID"><button id="save">Pasang</button></div><p class="small">Contoh URL: youtube.com/watch?v=XXXXXXXXXXX — yang disimpan hanya ID videonya.</p></section><section class="card"><b>Antrean berikutnya</b><div id="queue" class="small"></div></section></main><script>const GAS='https://script.google.com/macros/s/AKfycbyUB8drjL1dSJedYjKIKjVc5gzIE3Pe-QS0FF8o1_zU4NkAweGLFquhHLfy1Nt_eITA-Q/exec',TK='kudajitu_admin_token';let q=[],i=0,yt,ready=false,started=false,busy=false;const $=x=>document.getElementById(x);function token(){return sessionStorage.getItem(TK)||''}function jsonp(url,ms=18000){return new Promise((res,rej)=>{let c='__kp'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script'),done=false,t=setTimeout(()=>fin(Error('Timeout')),ms);function fin(e,d){if(done)return;done=true;clearTimeout(t);s.remove();try{delete window[c]}catch(_){}e?rej(e):res(d)}window[c]=d=>d&&d.success===false?fin(Error(d.message||'Server gagal')):fin(null,d);s.src=url+(url.includes('?')?'&':'?')+'callback='+c+'&_='+Date.now();s.onerror=()=>fin(Error('Network error'));document.head.appendChild(s)})}async function auth(){let t=token();if(!t){$('auth').innerHTML='<b>Login Admin diperlukan</b><p class="small">Login di /admin pada browser ini terlebih dahulu.</p>';return false}try{let d=await jsonp(GAS+'?action=adminsession&token='+encodeURIComponent(t),12000);if(d.success){$('auth').innerHTML='<span class="ok">✓ Admin terhubung</span>';return true}}catch(e){}sessionStorage.removeItem(TK);$('auth').innerHTML='<b>Session Admin tidak valid</b>';return false}async function load(){if(busy)return;if(!(await auth()))return;busy=true;try{let d=await jsonp(GAS+'?action=data&range=today&status=pending');q=Array.isArray(d.data)?d.data:[];if(i>=q.length)i=Math.max(0,q.length-1);render();$('status').textContent=q.length?q.length+' request pending.':'Tidak ada request pending.'}catch(e){$('status').textContent='Gagal memuat antrean: '+e.message;$('status').className='small error'}finally{busy=false}}function render(){let x=q[i];$('title').textContent=x?.title||'Belum ada lagu';$('meta').textContent=x?(x.artist||'Tanpa penyanyi')+' • '+(x.requester||'User'):'Antrean kosong';$('video').value=x?localStorage.getItem('kpyt_'+x.id)||'':'';let r=q.slice(i+1,i+6);$('queue').innerHTML=r.length?r.map((x,n)=>'<div class="item">'+(n+1)+'. '+esc(x.title)+'<br><span class="small">'+esc(x.artist||'')+'</span></div>').join(''):'Tidak ada request berikutnya.'}function esc(x){return String(x||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function ytLoad(){if(window.YT?.Player){makeYT();return}if(document.getElementById('yta'))return;let s=document.createElement('script');s.id='yta';s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);window.onYouTubeIframeAPIReady=makeYT}function makeYT(){if(yt)return;yt=new YT.Player('player',{width:'100%',height:'100%',videoId:'',playerVars:{playsinline:1,rel:0},events:{onReady:()=>{ready=true;if(started)play()},onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)finish()},onError:e=>{$('status').textContent='YouTube error '+e.data;$('status').className='small error'}}})}function play(){let id=q[i]&&localStorage.getItem('kpyt_'+q[i].id);if(!id){$('status').textContent='Pasang Video ID untuk request ini terlebih dahulu.';return}if(!yt){ytLoad();return}if(!ready)return;$('status').textContent='Memutar '+q[i].title;yt.loadVideoById(id);try{yt.playVideo()}catch(_){} }async function start(){started=true;if(!q.length){await load();if(!q.length)return}ytLoad();play()}async function mark(x){try{let d=await jsonp(GAS+'?action=updateStatus&id='+encodeURIComponent(x.id)+'&status=played&adminToken='+encodeURIComponent(token()));return d.success===true}catch(e){return false}}async function finish(){let x=q[i];if(!x)return;$('status').textContent='Lagu selesai, menandai…';if(!(await mark(x))){$('status').textContent='Gagal menandai request. Player berhenti agar status tidak salah.';$('status').className='small error';return}q.splice(i,1);if(i>=q.length)i=0;render();if(q.length)play();else $('status').textContent='Antrean selesai.'}$('start').onclick=start;$('refresh').onclick=load;$('prev').onclick=()=>{if(i>0){i--;render();if(started)play()}};$('next').onclick=finish;$('save').onclick=()=>{let raw=$('video').value.trim(),m=raw.match(/(?:v=|youtu\.be\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{11})/),id=m?m[1]:raw;if(!/^[A-Za-z0-9_-]{11}$/.test(id)||!q[i]){$('status').textContent='Video ID tidak valid atau request belum tersedia.';return}localStorage.setItem('kpyt_'+q[i].id,id);$('status').textContent='Video ID tersimpan.';ytLoad();if(started)play()};load();</script></body></html>
